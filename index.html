<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>瞬時に話せる英会話大特訓 (全90 UNIT 完全版)</title>
  <meta name="description" content="瞬時に話せる英会話大特訓 全90 UNIT (800項目) 完全版Webリーダー。PC全画面フィット見開き表示＆スマホ単語帳モード対応。">
  <meta name="theme-color" content="#21242d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="瞬時英会話">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-desk: #21242d;
      --paper-bg: #fdfbf7;
      --paper-border: #e6dfd3;
      --text-main: #1f2328;
      --text-sub: #4b5563;
      --text-muted: #8c959f;
      --accent-red: #c92a2a;
      --accent-red-light: #fff5f5;
      --accent-red-border: #ffc9c9;
      --accent-blue: #1864ab;
      --accent-blue-light: #e7f5ff;
      --accent-gold: #f59f00;
      --accent-gold-light: #fff9db;
      --card-bg: #ffffff;
      --card-border: #eae4d8;
      --card-hover: #faf8f3;
      --shadow-book: 0 20px 45px -10px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.08);
      --badge-left: #c92a2a;
      --badge-right: #212529;
    }

    [data-theme="white"] {
      --bg-desk: #edf2f7;
      --paper-bg: #ffffff;
      --paper-border: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #334155;
      --card-bg: #f8fafc;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --shadow-book: 0 15px 35px -8px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      --badge-right: #334155;
    }

    [data-theme="dark"] {
      --bg-desk: #090d16;
      --paper-bg: #151d2e;
      --paper-border: #2a374d;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-red: #ff6b6b;
      --accent-red-light: #3d1414;
      --accent-red-border: #661a1a;
      --accent-blue: #4dabf7;
      --accent-blue-light: #102847;
      --accent-gold: #fcc419;
      --accent-gold-light: #382d0d;
      --card-bg: #1c263b;
      --card-border: #2d3b55;
      --card-hover: #222f47;
      --shadow-book: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --badge-left: #e03131;
      --badge-right: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-desk);
      color: var(--text-main);
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Default to no scroll in fit mode */
      transition: background-color 0.25s ease;
    }

    body.scroll-mode {
      overflow-y: auto;
      height: auto;
      min-height: 100vh;
    }

    /* Top Sticky Toolbar */
    .top-bar {
      background: rgba(18, 22, 33, 0.96);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 1000;
      box-shadow: 0 2px 14px rgba(0,0,0,0.35);
      gap: 10px;
      height: 48px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-master {
      background: linear-gradient(135deg, #c92a2a, #e03131);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .unit-select {
      background: #1e2538;
      color: #fff;
      border: 1px solid #3b4561;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 220px;
    }

    .search-bar-wrap {
      position: relative;
      width: 170px;
    }

    .search-input {
      width: 100%;
      background: #1e2538;
      border: 1px solid #3b4561;
      color: #fff;
      padding: 5px 10px 5px 28px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      transition: width 0.2s;
    }
    .search-input:focus {
      border-color: #4dabf7;
      width: 210px;
    }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: #8c959f;
      pointer-events: none;
    }

    .btn-tool {
      background: #1e2538;
      color: #f1f5f9;
      border: 1px solid #3b4561;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-tool:hover { background: #2b344d; }
    .btn-tool.active {
      background: #c92a2a;
      border-color: #e03131;
      color: #fff;
    }

    /* Main Presentation Stage */
    .book-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      overflow: hidden;
      position: relative;
    }

    body.scroll-mode .book-stage {
      overflow-y: visible;
      height: auto;
      padding: 20px 16px 40px;
    }

    /* SYNCHRONIZED CSS GRID SPREAD (FIT TO VIEWPORT) */
    .book-spread-grid {
      display: grid;
      grid-template-columns: 1fr 14px 1fr;
      grid-template-rows: auto repeat(9, 1fr) auto;
      gap: clamp(3px, 0.6vh, 6px) 0;
      background: var(--paper-bg);
      box-shadow: var(--shadow-book);
      border-radius: 10px;
      width: 100%;
      max-width: 1300px;
      height: calc(100vh - 98px); /* exact fit between top and bottom nav */
      margin: 0 auto;
      padding: clamp(10px, 1.4vh, 18px) clamp(16px, 1.8vw, 28px);
      position: relative;
      border: 1px solid var(--paper-border);
      transition: transform 0.15s ease-out;
    }

    body.scroll-mode .book-spread-grid {
      height: auto;
      grid-template-rows: auto repeat(9, minmax(72px, auto)) auto;
      gap: 8px 0;
      padding: 24px 28px;
    }

    /* Center Spine Divider */
    .book-spine-divider {
      grid-column: 2;
      grid-row: 1 / span 11;
      background: linear-gradient(to right,
        rgba(0,0,0,0.12) 0%,
        rgba(0,0,0,0.03) 35%,
        rgba(0,0,0,0.01) 50%,
        rgba(0,0,0,0.03) 65%,
        rgba(0,0,0,0.12) 100%
      );
      position: relative;
      margin: -18px 0;
    }
    .book-spine-divider::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 1px;
      background: rgba(0,0,0,0.12);
      transform: translateX(-50%);
    }

    .left-col-item {
      grid-column: 1;
      padding-right: clamp(10px, 1.2vw, 18px);
    }
    .right-col-item {
      grid-column: 3;
      padding-left: clamp(10px, 1.2vw, 18px);
    }

    /* Row 1: Header Row */
    .header-left {
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: clamp(4px, 0.8vh, 8px);
      margin-bottom: 2px;
    }

    .header-right {
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: clamp(4px, 0.8vh, 8px);
      margin-bottom: 2px;
    }

    .unit-meta-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .unit-badge-pill {
      background: var(--accent-red);
      color: #fff;
      font-size: clamp(0.72rem, 1.1vh, 0.82rem);
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .chapter-tag {
      font-size: clamp(0.72rem, 1.1vh, 0.8rem);
      font-weight: 600;
      color: var(--text-sub);
    }

    .unit-main-title {
      font-family: 'Noto Serif JP', 'BIZ UDMincho', serif;
      font-size: clamp(1.15rem, 2.1vh, 1.55rem);
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.2;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .mascot-intro-box {
      background: var(--accent-red-light);
      border-left: 3px solid var(--accent-red);
      border-radius: 4px;
      padding: clamp(3px, 0.6vh, 6px) clamp(6px, 0.8vw, 10px);
      font-size: clamp(0.74rem, 1.15vh, 0.84rem);
      line-height: 1.35;
      color: var(--text-sub);
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .mascot-intro-box .mascot-icon { font-size: 0.95rem; flex-shrink: 0; }

    /* Right Header: CD Badge & Key Box */
    .cd-track-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .cd-pill {
      background: var(--accent-blue);
      color: #fff;
      font-size: clamp(0.72rem, 1.1vh, 0.8rem);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .repetition-header-badge {
      font-size: clamp(0.68rem, 1vh, 0.76rem);
      font-weight: 600;
      color: var(--text-muted);
    }

    .key-box-card {
      background: var(--accent-gold-light);
      border: 1px solid rgba(245, 159, 0, 0.3);
      border-radius: 4px;
      padding: clamp(3px, 0.6vh, 6px) clamp(6px, 0.8vw, 10px);
      font-size: clamp(0.72rem, 1.15vh, 0.82rem);
      line-height: 1.35;
      color: var(--text-sub);
    }

    .key-box-title {
      font-weight: 800;
      color: #d97706;
      font-size: clamp(0.74rem, 1.15vh, 0.84rem);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    [data-theme="dark"] .key-box-title { color: #fcc419; }

    /* ITEM CARDS - BALANCED IN EXACT SAME ROW */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: clamp(4px, 0.65vh, 8px) clamp(8px, 0.9vw, 12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: background-color 0.15s, border-color 0.15s;
    }
    .item-card:hover {
      border-color: #cbd5e1;
      background: var(--card-hover);
    }

    .item-header-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .item-num-badge {
      width: clamp(19px, 2.3vh, 23px);
      height: clamp(19px, 2.3vh, 23px);
      border-radius: 50%;
      background: var(--badge-left);
      color: #fff;
      font-size: clamp(0.72rem, 1.1vh, 0.82rem);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .right-card .item-num-badge {
      background: var(--badge-right);
    }

    .item-text-area {
      flex: 1;
      min-width: 0;
    }

    .japanese-sentence {
      font-size: clamp(0.88rem, 1.45vh, 1.05rem);
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    .hint-note-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
      font-size: clamp(0.68rem, 1.05vh, 0.78rem);
    }

    .hint-tag {
      background: var(--accent-red-light);
      color: var(--accent-red);
      border: 1px solid var(--accent-red-border);
      padding: 0 5px;
      border-radius: 3px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      line-height: 1.3;
    }

    .note-text {
      color: var(--text-sub);
      line-height: 1.25;
    }

    /* 5-step Checkboxes */
    .checks-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      padding-top: 2px;
      border-top: 1px dashed var(--card-border);
      font-size: clamp(0.65rem, 0.95vh, 0.72rem);
      color: var(--text-muted);
      font-weight: 600;
    }

    .check-box-input {
      appearance: none;
      width: clamp(11px, 1.4vh, 13px);
      height: clamp(11px, 1.4vh, 13px);
      border: 1.5px solid #a0aec0;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      background: transparent;
    }
    .check-box-input:checked {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }
    .check-box-input:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Right Card: English Content */
    .english-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .english-sentence {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: clamp(0.92rem, 1.55vh, 1.12rem);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .pronunciation-tag {
      display: inline-block;
      font-size: clamp(0.68rem, 1vh, 0.76rem);
      color: var(--text-muted);
      background: rgba(0,0,0,0.04);
      padding: 0 4px;
      border-radius: 3px;
      margin-top: 1px;
    }
    [data-theme="dark"] .pronunciation-tag { background: rgba(255,255,255,0.06); }

    .btn-speak {
      background: var(--accent-blue-light);
      color: var(--accent-blue);
      border: 1px solid rgba(24, 100, 171, 0.25);
      width: clamp(22px, 2.6vh, 26px);
      height: clamp(22px, 2.6vh, 26px);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.75rem, 1.2vh, 0.85rem);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-speak:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    .explanation-callout {
      margin-top: 2px;
      padding-top: 2px;
      border-top: 1px dashed var(--card-border);
      font-size: clamp(0.68rem, 1.05vh, 0.78rem);
      line-height: 1.25;
      color: var(--text-sub);
    }

    /* Mask Mode Styling (Blur Answer) */
    .book-spread-grid.masked .right-card .english-sentence,
    .book-spread-grid.masked .right-card .pronunciation-tag,
    .book-spread-grid.masked .right-card .explanation-callout {
      filter: blur(6px);
      user-select: none;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .book-spread-grid.masked .right-card.revealed .english-sentence,
    .book-spread-grid.masked .right-card.revealed .pronunciation-tag,
    .book-spread-grid.masked .right-card.revealed .explanation-callout {
      filter: none;
    }
    .book-spread-grid.masked .right-card {
      cursor: pointer;
      position: relative;
    }
    .book-spread-grid.masked .right-card:not(.revealed)::after {
      content: "👆 タップして英文を表示";
      display: block;
      font-size: 0.72rem;
      color: var(--accent-blue);
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    /* Row 11: Footer (Page Numbers) */
    .footer-left {
      grid-row: 11;
      padding-right: 18px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-size: clamp(0.72rem, 1.1vh, 0.8rem);
      font-weight: 700;
      color: var(--text-muted);
      border-top: 1px solid var(--paper-border);
      padding-top: 3px;
      margin-top: 1px;
    }

    .footer-right {
      grid-row: 11;
      padding-left: 18px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: clamp(0.72rem, 1.1vh, 0.8rem);
      font-weight: 700;
      color: var(--text-muted);
      border-top: 1px solid var(--paper-border);
      padding-top: 3px;
      margin-top: 1px;
    }

    /* Scan View Spread Mode */
    .scan-view-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 1300px;
      margin: 0 auto;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-book);
    }
    .scan-view-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: pointer;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      background: rgba(18, 22, 33, 0.96);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 1000;
      box-shadow: 0 -2px 14px rgba(0,0,0,0.35);
      height: 48px;
    }

    .btn-nav-action {
      background: #252e44;
      color: #fff;
      border: 1px solid #3d4a6c;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-nav-action:hover:not(:disabled) { background: #344061; }
    .btn-nav-action:disabled { opacity: 0.35; cursor: not-allowed; }

    .page-indicator-badge {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* SMARTPHONE RESPONSIVE STYLING (< 860px) */
    @media (max-width: 860px) {
      body {
        overflow-y: auto !important;
        height: auto !important;
        min-height: 100vh;
      }

      /* Compact horizontal toolstrip on mobile */
      .top-bar {
        position: sticky;
        top: 0;
        height: auto;
        min-height: 46px;
        padding: 6px 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .brand-section {
        flex: 1 1 auto;
      }
      .brand-title {
        font-size: 0.88rem;
      }
      .brand-title span:last-child {
        display: none;
      }
      .toolbar-actions {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        gap: 6px;
      }
      .toolbar-actions::-webkit-scrollbar {
        display: none;
      }
      .unit-select {
        flex-shrink: 0;
        max-width: 145px;
        font-size: 0.76rem;
        padding: 4px 6px;
      }
      .search-bar-wrap {
        flex-shrink: 0;
        width: 110px;
      }
      .search-input {
        font-size: 0.76rem;
        padding: 4px 8px 4px 24px;
      }
      .search-input:focus {
        width: 135px;
      }
      .btn-tool {
        flex-shrink: 0;
        padding: 4px 8px;
        font-size: 0.76rem;
      }
      #fitScreenBtn, .btn-print {
        display: none !important;
      }

      /* Content container */
      .book-stage {
        padding: 8px 8px 65px 8px;
        overflow-y: visible;
        height: auto;
      }
      .book-spread-grid {
        display: flex;
        flex-direction: column;
        padding: 12px 10px;
        gap: 0;
        height: auto !important;

です。", "en": "I'm afraid it'll rain tomorrow.", "exp": "it will の短縮形は it'll で［イトゥロー］のように発音します。"}, {"num": 9, "ja": "残念ながら来られないと思います。", "hint": "I'm afraid ~", "notes": "", "en": "I'm afraid I can't come.", "exp": "「（残念ながら）違うと思います」は I'm afraid not. です。"}], "book_pages": "pp. 56-57", "page": 29, "scan_image": "reader_pages/page_029.jpg"}, {"unit": 23, "chapter": "第1章 定型フレーズ編", "title": "思いやる・励ます", "intro": "I wish や Don't worry など簡単な表現を使うことで相手を励ますことができます。しっかり声に出して、励ましてあげましょう。", "cd_info": "CD1 23 (Track 23)", "key_title": "英会話のカギ", "key_content": "人を励ます表現は、多彩です。ここに紹介するフレーズを使って相手に思いやりの気持ちを伝えましょう。英語は日本語以上に言葉で表現することを重視する言語なので、「黙っていても伝わる」という考えはなかなか通用しません。言葉で励ましてもらったら、言葉でお礼を言いましょう。", "items": [{"num": 1, "ja": "幸運を祈ります。", "hint": "I wish ~", "notes": "「運」は luck を使います。", "en": "I wish you luck.", "exp": "もちろん Good luck. でもOK。"}, {"num": 2, "ja": "あきらめないで。", "hint": "give up", "notes": "", "en": "Don't give up.", "exp": "I give up. は「もうやめた」という意味です。"}, {"num": 3, "ja": "ベストを尽くしてください。", "hint": "Do ~", "notes": "基本動詞の do を使ったお決まりの表現です。", "en": "Do your best.", "exp": "best の前には所有格を使います。"}, {"num": 4, "ja": "あまり心配しないで。", "hint": "Don't worry ~", "notes": "", "en": "Don't worry too much.", "exp": ""}, {"num": 5, "ja": "がんばって。", "hint": "Hang in ~", "notes": "", "en": "Hang in there.", "exp": "Hang on in there. とも言います。"}, {"num": 6, "ja": "あと一息です。", "hint": "almost there", "notes": "「あなたはほとんどそこまで来ている」という文になります。", "en": "You are almost there.", "exp": "almost の t音は小さな「ッ」のようになり there につながります。"}, {"num": 7, "ja": "きっと上手くできるよ。", "hint": "do well", "notes": "「きっと」は「確信して」という意味の sure を使います。", "en": "I'm sure you'll do well.", "exp": ""}, {"num": 8, "ja": "すべて大丈夫ですよ。", "hint": "all right", "notes": "「すべて」は everything を使います。", "en": "Everything's going to be all right.", "exp": "going to be（〜だろう）はつながって［ガナビ］のように聞こえます。"}, {"num": 9, "ja": "自信を持ちましょう。", "hint": "have confidence", "notes": "should を使ってみましょう。", "en": "You should have confidence in yourself.", "exp": "「自信」という意味で confidence は数えられない名詞。うっかり a をつけないように。"}], "book_pages": "pp. 58-59", "page": 30, "scan_image": "reader_pages/page_030.jpg"}, {"unit": 24, "chapter": "第1章 定型フレーズ編", "title": "お祝いをする", "intro": "Congratulations ~ と Happy ~ がお祝いの表現の代表です。Let's celebrate（お祝いしましょう）も覚えておくと重宝します。", "cd_info": "CD1 24 (Track 24)", "key_title": "英会話のカギ", "key_content": "お祝いの言葉は定型パターンで表現できます。出来事に関する語句さえおさえておけば、あとはそれを後ろに並べるだけでOKです。お祝いの場合は非言語コミュニケーションが大切です。言葉と同時に握手や笑顔を忘れないようにしましょう。", "items": [{"num": 1, "ja": "卒業おめでとう！", "hint": "Congratulations ~!", "notes": "「卒業」は graduation を使います。", "en": "Congratulations on your graduation!", "exp": "congratulation の後ろに複数形の s をつけましょう。"}, {"num": 2, "ja": "試験合格おめでとう！", "hint": "Congratulations ~!", "notes": "「合格する」は pass を使います。", "en": "Congratulations on passing the exam!", "exp": "「〜おめでとう！」と言う場合は、後ろに on〜 を続けます。"}, {"num": 3, "ja": "ご昇進おめでとうございます！", "hint": "Congratulations ~!", "notes": "「昇進」は promotion を使います。", "en": "Congratulations on your promotion!", "exp": "前置詞 on の後ろは名詞や動詞の 〜ing 形です。"}, {"num": 4, "ja": "ご結婚おめでとうございます！", "hint": "Congratulations ~!", "notes": "", "en": "Congratulations on your marriage!", "exp": ""}, {"num": 5, "ja": "結婚記念日おめでとうございます！", "hint": "Happy ~!", "notes": "", "en": "Happy anniversary!", "exp": "anniversary は記念日のことですが、特に結婚記念日を指す場合が多いです。"}, {"num": 6, "ja": "楽しいバレンタインデーを！", "hint": "Happy ~!", "notes": "", "en": "Happy Valentine's Day!", "exp": "英語では Valentine の後ろに 's が必要です。"}, {"num": 7, "ja": "お幸せに！", "hint": "happy", "notes": "英語では「楽しい人生を！」となります。", "en": "Have a happy life together!", "exp": "happy life の前に a をつけ忘れないようにしましょう。"}, {"num": 8, "ja": "新年のお祝いをしましょう！", "hint": "Let's celebrate ~!", "notes": "「新年」の前には the が必要です。", "en": "Let's celebrate the New Year!", "exp": "celebrate は「祝う」という動詞です。"}, {"num": 9, "ja": "彼女の誕生日のお祝いをしましょう！", "hint": "Let's celebrate ~", "notes": "", "en": "Let's celebrate her birthday!", "exp": ""}], "book_pages": "pp. 60-61", "page": 31, "scan_image": "reader_pages/page_031.jpg"}, {"unit": 25, "chapter": "第1章 定型フレーズ編", "title": "期待する", "intro": "期待する気持ちについては「当てにしている」とか「楽しみにしている」なども一緒に覚えておくと、英会話の幅が広がります。", "cd_info": "CD1 25 (Track 25)", "key_title": "英会話のカギ", "key_content": "期待する気持ちを伝えるには hope を使った表現が便利です。日本語では単に「思う」と表現する場合でも、普通のことには I think〜、悪いことを思うときには I'm afraid〜、いいことを思うときには I hope〜 を使います。", "items": [{"num": 1, "ja": "そうならいいのですが。", "hint": "I hope ~", "notes": "英語で「そう」は日本語ととてもよく似た単語です。", "en": "I hope so.", "exp": "I think so. や I'm afraid so. の場合と形は同じです。"}, {"num": 2, "ja": "そうでないならいいのですが。", "hint": "I hope ~", "notes": "hope の後ろに否定語を入れます。", "en": "I hope not.", "exp": "I'm afraid〜 の場合も not を後ろにつけるだけでしたね（UNIT 22の9参照）。"}, {"num": 3, "ja": "来週お会いできたらと思います。", "hint": "I hope ~", "notes": "後ろに「to＋動詞の原形」が続きます。", "en": "I hope to see you next week.", "exp": "望む人と後ろの動詞（see）の主語が同じならば「to＋動詞の原形」を使います。"}, {"num": 4, "ja": "あなたがパーティーを楽しんでくれたらと思います。", "hint": "I hope ~", "notes": "後ろに「主語＋動詞」が続きます。", "en": "I hope you'll enjoy the party.", "exp": "望む人（I）と後ろの動詞（enjoy）の主語（you）が異なれば、「主語＋動詞」にします。"}, {"num": 5, "ja": "彼女がもっと熱心に仕事をすることを期待します。", "hint": "I expect ~", "notes": "「expect 人 to 〜」となります。", "en": "I expect her to work harder.", "exp": "期待する（expect）人と後ろの動詞（work）の意味上の主語が異なれば、その人を to の前に。"}, {"num": 6, "ja": "私にあまり期待しないでください。", "hint": "Don't expect ~", "notes": "", "en": "Don't expect too much of me.", "exp": "「私に関してあまりたくさんのことを期待するな」ということですね。"}, {"num": 7, "ja": "当てにしていますよ。", "hint": "count on ~", "notes": "現在進行形を使います。", "en": "I'm counting on you.", "exp": "count on〜 は「〜を当てにする」という決まり文句です。"}, {"num": 8, "ja": "もうすぐお会いできることを楽しみにしています。", "hint": "I'm looking forward to ~", "notes": "「会う」は see でOKです。", "en": "I'm looking forward to seeing you soon.", "exp": "to の後ろは動詞の 〜ing 形になるところがポイントです。"}, {"num": 9, "ja": "あなたからお便りがあることを楽しみにしています。", "hint": "I'm looking forward to ~", "notes": "「〜から便りがある」は hear from〜 です。", "en": "I'm looking forward to hearing from you.", "exp": "単に「楽しみにしています」は I'm looking forward to it. でOKです。"}], "book_pages": "pp. 62-63", "page": 32, "scan_image": "reader_pages/page_032.jpg"}, {"unit": 26, "chapter": "第1章 定型フレーズ編", "title": "強制・義務のフレーズ", "intro": "「強制・義務」を表す表現には must と have to があります。must は相手に「〜しなさい」のように命じるときに使います。", "cd_info": "CD1 26 (Track 26)", "key_title": "英会話のカギ", "key_content": "must はかなり強い強制の響きがあるので、特に you を主語にする場合は使う場面や話し相手によって注意しなければなりません。must の否定の mustn't は「〜してはいけない」という意味で、have to の否定は don't have to で「〜しなくてもよい」となり、意味が異なります。", "items": [{"num": 1, "ja": "あなたは話をやめなければなりません。", "hint": "must", "notes": "「〜することをやめる」は「stop＋動詞の〜ing形」です。", "en": "You must stop talking.", "exp": "must の後ろは動詞の原形です。"}, {"num": 2, "ja": "私たちはエネルギーを節約しなければなりません。", "hint": "must", "notes": "「節約する」は save を使います。", "en": "We must save energy.", "exp": "「節約する」、「大切に使う」は conserve とも言います。energy の発音は［エナジー］です。"}, {"num": 3, "ja": "私は会議に出席しなければなりませんか。", "hint": "must", "notes": "「出席する」は attend を使います。", "en": "Must I attend the meeting?", "exp": "疑問文は must を主語の前に置きます。"}, {"num": 4, "ja": "この部屋でタバコを吸ってはいけません。", "hint": "must", "notes": "must の否定文を使います。", "en": "You mustn't smoke in this room.", "exp": "mustn't は［マスントゥ］と発音します。"}, {"num": 5, "ja": "これを最初に終わらせなければなりません。", "hint": "have to", "notes": "", "en": "You have to finish this first.", "exp": "have to は［ハフトゥ］と発音します。"}, {"num": 6, "ja": "私は明日の朝早く起きなければいけません。", "hint": "have to", "notes": "", "en": "I have to get up early tomorrow morning.", "exp": ""}, {"num": 7, "ja": "先週の日曜日は仕事をしなければなりませんでした。", "hint": "have to", "notes": "過去形にするのを忘れないように。", "en": "I had to work last Sunday.", "exp": "had to は［ハットゥー］と発音します。must の過去形はありません。"}, {"num": 8, "ja": "もう帰らないといけないのですか。", "hint": "have to", "notes": "「帰る」は leave を使ってみましょう。", "en": "Do you have to leave so soon?", "exp": "must と違い、do を文頭に置きます。"}, {"num": 9, "ja": "今それをする必要はありません。", "hint": "don't have to", "notes": "must の否定文は mustn't。では、have to の否定文は？", "en": "You don't have to do it now.", "exp": "mustn't は「〜してはいけない」、don't have to は「〜しなくてもよい」です。"}], "book_pages": "pp. 64-65", "page": 33, "scan_image": "reader_pages/page_033.jpg"}, {"unit": 27, "chapter": "第1章 定型フレーズ編", "title": "申し出る・提案する", "intro": "申し出る表現は Shall I 〜? だけではありません。丁寧な言い方から親しい間柄で使う表現まで覚えておきましょう。", "cd_info": "CD1 27 (Track 27)", "key_title": "英会話のカギ", "key_content": "「〜しましょうか！」とか「〜させてください」と相手に申し出る場合、とても丁寧な言い方に Shall I 〜? や Would you like me to 〜? があります。友人同士では Do you want me to 〜? の方が自然でしょう。文を Let me〜 で始めれば、より積極的な気持ちを表せます。", "items": [{"num": 1, "ja": "窓を開けましょうか。", "hint": "Shall I 〜?", "notes": "", "en": "Shall I open the window?", "exp": "Shall の後は常に動詞の原形が来ます。"}, {"num": 2, "ja": "何か読むものを持って来ましょうか。", "hint": "Shall I 〜?", "notes": "「持って来る」は bring や get を使います。", "en": "Shall I bring you something to read?", "exp": "something の後ろに動詞を使い「何か〜するもの」となります。"}, {"num": 3, "ja": "自宅まで車で送りましょうか。", "hint": "Shall I 〜?", "notes": "drive には「〜を車で連れていく」という意味もあります。", "en": "Shall I drive you home?", "exp": "この場合の home は「家に」という副詞なので、「〜に」の to はつけません。"}, {"num": 4, "ja": "緒に行きましょうか。", "hint": "Would you like me to ~?", "notes": "「私に一緒に行ってほしいですか」と言います。", "en": "Would you like me to go with you?", "exp": "me を抜かさないように注意しましょう。to の後ろは動詞の原形です。"}, {"num": 5, "ja": "それをしてあげましょうか。", "hint": "Would you like me to ~?", "notes": "「あなたのために」という意味の for you を使います。", "en": "Would you like me to do it for you?", "exp": ""}, {"num": 6, "ja": "電気をつけましょうか。", "hint": "Do you want me to ~?", "notes": "「〜をつける」は turn on〜 です。", "en": "Do you want me to turn on the light?", "exp": "light の前に the を忘れないように。「消す」は turn off または shut off です。"}, {"num": 7, "ja": "それについて彼に尋ねてみましょうか。", "hint": "Do you want me to ~?", "notes": "", "en": "Do you want me to ask him about that?", "exp": "want to〜 は「〜したい」、want 人 to〜 は「（人に）〜してほしい」という意味です。"}, {"num": 8, "ja": "あなたをそこにお連れしましょう。", "hint": "Let me ~", "notes": "Let me の後ろは動詞の原形です。「〜してあげましょう」という意味です。", "en": "Let me take you there.", "exp": "there は「そこに」という副詞なので「〜に」の to は必要ありません。"}, {"num": 9, "ja": "その箱を運んであげましょう。", "hint": "Let me ~", "notes": "ここでも「あなたのために」の for you を使うと自然な英語になります。", "en": "Let me carry that box for you.", "exp": "carry には「（重いもの）を運ぶ」や「〜を持ち歩く」という意味があります。"}], "book_pages": "pp. 66-67", "page": 34, "scan_image": "reader_pages/page_034.jpg"}, {"unit": 28, "chapter": "第1章 定型フレーズ編", "title": "好き・嫌いを言う", "intro": "英語では「好き・嫌い」を相手に言葉ではっきり伝えます。変に遠慮すると、Yes, or no? と聞き返されてしまいます。", "cd_info": "CD1 28 (Track 28)", "key_title": "英会話のカギ", "key_content": "「好き」である気持ちを表すには、一般的に like や love を使います。hate は「大嫌い」という意味です。UNIT 10に出てきた prefer は「〜のほうが好き」という意味で、別のものと比較するときに使います。", "items": [{"num": 1, "ja": "ジャズがとても好きです。", "hint": "like", "notes": "「とても」は very much 以外を使ってみましょう。", "en": "I like jazz a lot.", "exp": "a lot は very much のくだけた言い方です。"}, {"num": 2, "ja": "あなたの新しいドレスが好きです。", "hint": "like", "notes": "", "en": "I like your new dress.", "exp": "これは褒める表現でもありますね。"}, {"num": 3, "ja": "サッカーは好きですか。", "hint": "like", "notes": "疑問文は主語の前に Do を置きます。", "en": "Do you like soccer?", "exp": ""}, {"num": 4, "ja": "買い物はあまり好きではありません。", "hint": "like", "notes": "英語では「あまり」と「とても」は同じ語句を使います。", "en": "I don't like shopping very much.", "exp": ""}, {"num": 5, "ja": "家族を愛しています。", "hint": "love", "notes": "", "en": "I love my family.", "exp": "love は like よりも好きな気持ちが強いことを表します。"}, {"num": 6, "ja": "インド料理がとても好きです。", "hint": "love", "notes": "料理は food でOK。", "en": "I love Indian food.", "exp": "love は人以外にも使います。「料理」には cuisine という単語もありますよ。"}, {"num": 7, "ja": "運転は大嫌いです。", "hint": "hate", "notes": "", "en": "I hate driving.", "exp": "hate は don't like よりも嫌いな気持ちが強いことを表します。"}, {"num": 8, "ja": "このような天気は大嫌いです。", "hint": "hate", "notes": "「天気」は weather を使います。", "en": "I hate this kind of weather.", "exp": "kind は「種類」という意味。「this kind of 〜」で「このような〜」となります。"}, {"num": 9, "ja": "コーヒーより紅茶のほうがいいです。", "hint": "prefer", "notes": "prefer A to B で「BよりもAを好む」という意味です。", "en": "I prefer tea to coffee.", "exp": "prefer は like と違い、比較を示す動詞です。"}], "book_pages": "pp. 68-69", "page": 35, "scan_image": "reader_pages/page_035.jpg"}, {"unit": 29, "chapter": "第1章 定型フレーズ編", "title": "分かる・分からない", "intro": "know と understand を使うのが基本ですが、ニュアンスが違うので上手に使い分けましょう。", "cd_info": "CD1 29 (Track 29)", "key_title": "英会話のカギ", "key_content": "「知っている」「分かっている」は know がよく使われます。「理解する」には understand がありますが、know は「（内容を）確信している」というニュアンスで、understand は「深く認識している」という意味です。基本動詞の get や have を使った表現もあります。", "items": [{"num": 1, "ja": "それは分かっています。", "hint": "know", "notes": "", "en": "I know that.", "exp": ""}, {"num": 2, "ja": "あなたがおっしゃっていることは分かります。", "hint": "know", "notes": "「意味する」という動詞の mean を使います。", "en": "I know what you mean.", "exp": "「what主語＋動詞」で「〜すること」。この例では「あなたが意味すること」となります。"}, {"num": 3, "ja": "お気持ちは分かります。", "hint": "know", "notes": "「あなたがどう感じているのか分かります」と言います。", "en": "I know how you feel.", "exp": ""}, {"num": 4, "ja": "その違いは理解できます。", "hint": "understand", "notes": "", "en": "I understand the difference.", "exp": "冠詞の the を忘れないようにしましょう。"}, {"num": 5, "ja": "私が言っていることが理解できますか。", "hint": "understand", "notes": "2と同様、「〜すること」には「what主語＋動詞」を使います。", "en": "Do you understand what I'm saying?", "exp": ""}, {"num": 6, "ja": "彼のプレゼンの要点が分かりましたか。", "hint": "get", "notes": "「要点」は point です。", "en": "Did you get the point of his presentation?", "exp": "get には「〜を理解する」という意味があります。"}, {"num": 7, "ja": "よく分かりませんでした。", "hint": "get", "notes": "「まったく」という意味の quite を使ってみましょう。", "en": "I didn't quite get it.", "exp": "「完全に分かったわけではない」という意味です。get it は［ゲーリッ］と発音します。"}, {"num": 8, "ja": "さっぱり分かりません。", "hint": "have ~ idea", "notes": "", "en": "I have no idea.", "exp": "I don't know. の意味を強調するような表現です。"}, {"num": 9, "ja": "彼女がいつ戻るか分かりますか。", "hint": "have ~ idea", "notes": "idea の前に any を使います。「戻る」は be back です。", "en": "Do you have any idea when she'll be back?", "exp": "Do you have any idea?（分かりますか）とだけ言うこともできます。"}], "book_pages": "pp. 70-71", "page": 36, "scan_image": "reader_pages/page_036.jpg"}, {"unit": 30, "chapter": "第1章 定型フレーズ編", "title": "同意する・反対する", "intro": "アメリカなどでは、意見が違っているのは当たり前という考え方です。相手と異なる意見でもはっきりと言ってみましょう。", "cd_info": "CD1 30 (Track 30)", "key_title": "英会話のカギ", "key_content": "相手に同意するときには、相手がひと言言うたびに Yes. を繰り返すのではなく、いろいろな表現を使ってみましょう。You're right. や I agree. などは、同意していることが明確に分かる表現です。", "items": [{"num": 1, "ja": "その通りです。", "hint": "right", "notes": "「それは正しい」という文になります。", "en": "That's right.", "exp": "That's correct. とも言います。"}, {"num": 2, "ja": "君は絶対正しいよ。", "hint": "right", "notes": "「絶対に」とか「まったく」という副詞の absolutely を使います。", "en": "You are absolutely right.", "exp": "absolutely の tの発音は「小さなツ」のようになり、ほとんど聞こえません。"}, {"num": 3, "ja": "あなたに賛成です。", "hint": "agree", "notes": "", "en": "I agree with you.", "exp": "「〜に賛成だ」というときには with〜 を使います。"}, {"num": 4, "ja": "私たちは彼女の意見に賛成です。", "hint": "agree", "notes": "「意見」は opinion です。", "en": "We agree with her opinion.", "exp": "「反対する」は disagree です。"}, {"num": 5, "ja": "それはいい考えですね。", "hint": "a good idea", "notes": "", "en": "That's a good idea.", "exp": "Sounds like a good idea. と言うこともできます。"}, {"num": 6, "ja": "それはあまりいい考えではないと思います。", "hint": "I don't think ~", "notes": "否定文での「あまり」は very を使います。", "en": "I don't think that's a very good idea.", "exp": ""}, {"num": 7, "ja": "私は賛成できないと思います。", "hint": "I don't think ~", "notes": "can ではなく think の方を否定します。", "en": "I don't think I can agree.", "exp": ""}, {"num": 8, "ja": "私はそれには反対です。", "hint": "against", "notes": "against は前置詞です。前に be動詞が必要です。", "en": "I'm against that.", "exp": "against の反対語は for で「〜に賛成」という意味です。"}, {"num": 9, "ja": "私たちは残業には反対です。", "hint": "against", "notes": "「残業する」は work overtime です。", "en": "We are against working overtime.", "exp": "against の後ろの動詞は 〜ing 形にします。"}], "book_pages": "pp. 72-73", "page": 37, "scan_image": "reader_pages/page_037.jpg"}, {"unit": 31, "chapter": "第2章 文法活用フレーズ編", "title": "「今」を話す 現在形", "book_pages": "pp. 76-77", "page": 39, "scan_image": "reader_pages/page_039.jpg", "cd_info": "CD1 31 (Track 31)", "intro": "会話でも文の基本となるのは、be動詞と一般動詞です。応用の利くカンタンフレーズで練習しましょう。", "key_title": "英会話のカギ", "key_content": "動詞にはbe動詞と一般動詞があります。be動詞は「〜である」とか「存在する」という意味で使います。現在形はamとareとisで、主語によって使い分けます。一般動詞はplay（遊ぶ）やhave（持っている）など動作や状態を表します。3人称の単数が主語になる場合は通常語尾に-sや-esをつけます。", "items": [{"num": 1, "ja": "私はとても幸せです。", "hint": "am", "notes": "", "en": "I'm very happy.", "pron": "", "exp": "「私」=「幸せ」ととらえます。happyはIの補語です。"}, {"num": 2, "ja": "あなたはいい生徒ですね。", "hint": "are", "notes": "「生徒」はstudent。数えられる名詞なので冠詞のaを忘れないように。", "en": "You are a good student.", "pron": "", "exp": "「あなた」=「いい生徒」。studentはyouの補語です。"}, {"num": 3, "ja": "彼はいま東京にいます。", "hint": "is", "notes": "", "en": "He is in Tokyo now.", "pron": "", "exp": "「彼は東京の中に存在する」ということです。"}, {"num": 4, "ja": "私は毎日ピアノを弾きます。", "hint": "play", "notes": "playは「(楽器)を弾く」。楽器の名前の前にはtheをつけましょう。", "en": "I play the piano every day.", "pron": "", "exp": "「毎日〜する」という習慣には現在形を使います。"}, {"num": 5, "ja": "あなたのジャケットはすてきですね。", "hint": "look", "notes": "「〜はすてきに見える」と言います。", "en": "Your jacket looks nice.", "pron": "", "exp": "主語が3人称単数の場合は-sをつけましょう。"}, {"num": 6, "ja": "アスカは数学をとても熱心に勉強します。", "hint": "study", "notes": "「熱心に」はhardです。", "en": "Asuka studies math so hard.", "pron": "", "exp": "yの前が子音で終わる場合はiに変えて-esをつけます。"}, {"num": 7, "ja": "ローラには姉妹が2人います。", "hint": "have", "notes": "「ローラは姉妹を2人持っている」と考えます。", "en": "Laura has two sisters.", "pron": "", "exp": "主語が3人称単数の場合、haveはhasに変わります。"}, {"num": 8, "ja": "私はよく上司に質問をします。", "hint": "ask", "notes": "askの後ろにまず「上司」を持って来ます。", "en": "I often ask my boss questions.", "pron": "", "exp": "目的語が2つ（my bossとquestions）あります。「ask 人＋質問」の順番です。"}, {"num": 9, "ja": "みんなは彼をJTと呼んでいます。", "hint": "call", "notes": "", "en": "People call him JT.", "pron": "", "exp": "「彼」（目的語）=「JT」（補語）の形になります。"}]}, {"unit": 32, "chapter": "第2章 文法活用フレーズ編", "title": "「これから」を話す 未来形", "book_pages": "pp. 78-79", "page": 40, "scan_image": "reader_pages/page_040.jpg", "cd_info": "CD1 32 (Track 32)", "intro": "未来のことを言い表すのはwillやbe going toです。用法を理解すれば、未来のことを何でも話せるようになります。", "key_title": "英会話のカギ", "key_content": "willは「来年〜歳になります」のように自然にそうになる場合（単純未来）と、「電話します」のように自分の意志でそうする場合（意志未来）があります。be going toは「〜する予定です」、「〜するつもりです」と言いたいときに使います。", "items": [{"num": 1, "ja": "リサは来年20歳になります。", "hint": "will", "notes": "「〜になる」はbe動詞を使います。", "en": "Lisa will be twenty next year.", "pron": "", "exp": "[単純未来] willの後ろは動詞の原形です。"}, {"num": 2, "ja": "明日はくもりです。", "hint": "will", "notes": "「くもり」はcloudyです。", "en": "It will be cloudy tomorrow.", "pron": "", "exp": "[単純未来] 天気のことを言う場合はItを主語にします。"}, {"num": 3, "ja": "ベストを尽くします。", "hint": "will", "notes": "「尽くす」は基本動詞doを使います。", "en": "I will do my best.", "pron": "", "exp": "[意志未来] 「do＋所有格＋best」で「ベストを尽くす」となります(UNIT 23の3参照)。"}, {"num": 4, "ja": "今夜お電話します。", "hint": "will", "notes": "", "en": "I will call you tonight.", "pron": "", "exp": "[意志未来] 「〜に電話する」はgive 〜 a callとも言います。"}, {"num": 5, "ja": "君に指輪を買ってあげるよ。", "hint": "will", "notes": "「buy＋人＋物」の順番です。", "en": "I will buy you a ring.", "pron": "", "exp": "[意志未来] buy a ring for youとも言えます。"}, {"num": 6, "ja": "宿題を手伝ってあげるよ。", "hint": "will", "notes": "helpの後ろには「人」が来ます。", "en": "I will help you with your homework.", "pron": "", "exp": "[意志未来] 「help＋人＋with 〜」という形になります。"}, {"num": 7, "ja": "彼らは結婚する予定です。", "hint": "are going to", "notes": "", "en": "They are going to get married.", "pron": "", "exp": "[予定] 「〜と結婚する」はget married to 〜です。"}, {"num": 8, "ja": "彼は来月ハワイを訪問する予定です。", "hint": "is going to", "notes": "", "en": "He is going to visit Hawaii next month.", "pron": "", "exp": "[予定] visitの後ろにtoを入れないように注意しましょう。"}, {"num": 9, "ja": "私はエンジニアになるつもりです。", "hint": "am going to", "notes": "「〜になる」はbecomeを使ってみましょう。", "en": "I'm going to become an engineer.", "pron": "", "exp": "[〜するつもり] become (〜になる) の代わりにbeを使うこともできます。"}]}, {"unit": 33, "chapter": "第2章 文法活用フレーズ編", "title": "「〜した」「〜だった」 過去形", "book_pages": "pp. 80-81", "page": 41, "scan_image": "reader_pages/page_041.jpg", "cd_info": "CD1 33 (Track 33)", "intro": "過去のことは動詞を変化させるだけで話せます。不規則に変化する動詞があるので、しっかり覚えておきましょう。", "key_title": "英会話のカギ", "key_content": "be動詞のamとisの過去形はwas、areの過去形はwereです。一般動詞の過去形は多くの場合、語尾にedがつきます。stoppedのように最後の子音が重なるもの、studiedのようにstudyの最後のyがiに変わってedがつくもの、cutのように形が変わらないもの、tell→toldのように形が変わるものなどがあります。", "items": [{"num": 1, "ja": "私は先週忙しかったです。", "hint": "was", "notes": "「先週」のような時を表す副詞(句)は通常、文の最後に置きます。", "en": "I was busy last week.", "pron": "", "exp": "主語が1人称単数(I)の場合、be動詞はwasを使います。"}, {"num": 2, "ja": "あなたはとても幸運でしたね。", "hint": "were", "notes": "", "en": "You were so lucky.", "pron": "", "exp": "主語が2人称(you)の場合、be動詞はwereを使います。"}, {"num": 3, "ja": "昨日は本当に天気がよかったですね。", "hint": "was", "notes": "「天気」はweatherです。", "en": "The weather was so nice yesterday.", "pron": "", "exp": "主語が3人称単数(The weather)の場合、be動詞はwasを使います。"}, {"num": 4, "ja": "私たちは先週の日曜日にゴルフをしました。", "hint": "played", "notes": "「ゴルフをする」はplay golfです。", "en": "We played golf last Sunday.", "pron": "", "exp": "playedの語尾のedの発音は[-d]です。"}, {"num": 5, "ja": "私は本当にゴッホの絵が好きでした。", "hint": "liked", "notes": "「本当に」という副詞は動詞の前に置きます。", "en": "I really liked van Gogh's paintings.", "pron": "", "exp": "likedの語尾のedの発音は[-t]、「ゴッホ」はvan Gogh [ヴァンゴウ] です。"}, {"num": 6, "ja": "学校は2週間前に始まりました。", "hint": "started", "notes": "", "en": "School started two weeks ago.", "pron": "", "exp": "語尾のedの発音は[-id]となります。"}, {"num": 7, "ja": "彼女は私にたくさんの情報をくれました。", "hint": "gave", "notes": "「くれる」、「あげる」はgiveです。", "en": "She gave me a lot of information.", "pron": "", "exp": "giveの過去形はgaveです。informationには複数のsはつけません。"}, {"num": 8, "ja": "彼らは去年、家を建てました。", "hint": "built", "notes": "", "en": "They built the house last year.", "pron": "", "exp": "buildの過去形はbuiltです。"}, {"num": 9, "ja": "彼は私にその事故について話してくれました。", "hint": "told", "notes": "tell (told) の直後には「人」が来ます。", "en": "He told me about the accident.", "pron": "", "exp": "tellの過去形はtoldです。"}]}, {"unit": 34, "chapter": "第2章 文法活用フレーズ編", "title": "「〜している」 進行形", "book_pages": "pp. 82-83", "page": 42, "scan_image": "reader_pages/page_042.jpg", "cd_info": "CD1 34 (Track 34)", "intro": "継続している動作を示すときに進行形を使います。他に、近未来の予定も進行形で表すことができます。", "key_title": "英会話のカギ", "key_content": "「〜している」のように動作の進行は「be動詞＋〜ing形」を使います。現在形のbe動詞（am, are, is）＋〜ing形で「〜している」（現在進行形）、過去形のbe動詞（was, were）＋〜ing形で「〜していた」（過去進行形）となります。know（知っている）やlike（好きだ）のような状態を表す動詞は進行形にはなりません。", "items": [{"num": 1, "ja": "私は今テレビを見ています。", "hint": "am watching", "notes": "", "en": "I'm watching TV now.", "pron": "", "exp": "会話の場合、I amは普通I'mという短縮形を使います。"}, {"num": 2, "ja": "私たちはジェームズを待っています。", "hint": "are waiting", "notes": "", "en": "We are waiting for James.", "pron": "", "exp": "「〜を待つ」と言う場合、waitの後ろにforを忘れないようにしましょう。"}, {"num": 3, "ja": "カオリは台所で夕食を作っています。", "hint": "is cooking", "notes": "「夕食」はdinnerです。", "en": "Kaori is cooking dinner in the kitchen.", "pron": "", "exp": "「夕食」はsupperとも言います。"}, {"num": 4, "ja": "子どもたちはソファーに座っています。", "hint": "are sitting", "notes": "child (子ども) の複数形はchildrenです。", "en": "The children are sitting on the sofa.", "pron": "", "exp": ""}, {"num": 5, "ja": "彼女は明日、日本を出発する予定です。", "hint": "is leaving", "notes": "「明日」などの時を表す副詞はたいてい一番後ろに置きます。", "en": "She is leaving Japan tomorrow.", "pron": "", "exp": "「be＋〜ing形」で近い未来を表す場合もあります。"}, {"num": 6, "ja": "私はそのときシャワーを浴びていました。", "hint": "was taking", "notes": "", "en": "I was taking a shower then.", "pron": "", "exp": "過去を表す言葉then (そのとき) があるのでwasを使い、過去進行形にします。"}, {"num": 7, "ja": "私たちはレストランでお昼ご飯を食べていました。", "hint": "were eating", "notes": "「〜で」のように場所を表す場合はatを使います。", "en": "We were eating lunch at the restaurant.", "pron": "", "exp": "lunchにaはつきません。bigなどの形容詞がつくとa big lunchと言います。"}, {"num": 8, "ja": "彼はベッドに横たわっていました。", "hint": "was lying", "notes": "lie (横になる) を〜ing形にするとlyingとなります。", "en": "He was lying down on the bed.", "pron": "", "exp": ""}, {"num": 9, "ja": "学生たちは讃美歌を歌っていました。", "hint": "were singing", "notes": "", "en": "The students were singing Christmas carols.", "pron": "", "exp": "主語が複数の場合、be動詞の過去形はwereを使います。"}]}, {"unit": 35, "chapter": "第2章 文法活用フレーズ編", "title": "「過去」から「現在」まで 現在完了形", "book_pages": "pp. 84-85", "page": 43, "scan_image": "reader_pages/page_043.jpg", "cd_info": "CD1 35 (Track 35)", "intro": "過去の出来事は過去形、現在の事実は現在形を使いますが、「過去から現在まで継続している動作」には現在完了形を使います。", "key_title": "英会話のカギ", "key_content": "現在完了形の基本形は「have＋過去分詞」です。過去分詞は過去形と同じ形のものが多いですが、独特の変化するものもあるので覚えておきましょう。「〜したことがある」という経験や、「ずっと〜している」という継続を表します。「〜してしまった」という完了や結果を表す場合もあります。", "items": [{"num": 1, "ja": "私はすでにその本を読み終えました。", "hint": "have finished", "notes": "「すでに」はalreadyです。", "en": "I have already finished reading that book.", "pron": "", "exp": "「〜してしまった」という完了・結果の用法です。"}, {"num": 2, "ja": "父はちょうど帰ってきたところです。", "hint": "has come", "notes": "「ちょうど」はjustです。", "en": "My father has just come home.", "pron": "", "exp": "My fatherは3人称単数です。hasを使いましょう。"}, {"num": 3, "ja": "フランクはニューヨークに行ってしまいました。", "hint": "has gone", "notes": "", "en": "Frank has gone to New York.", "pron": "", "exp": "目的地に行ってまだ帰っていない場合はgoneを使います。"}, {"num": 4, "ja": "私はハワイに2度行ったことがあります。", "hint": "have been", "notes": "「1度」はonce、「2度」はtwiceです。", "en": "I have been to Hawaii twice.", "pron": "", "exp": "「行ったことがある」のように目的地に行き、帰って来ている場合はbeenを使います。"}, {"num": 5, "ja": "私は彼に以前会ったことがあります。", "hint": "have met", "notes": "", "en": "I have met him before.", "pron": "", "exp": "4と同様、「〜したことがある」という経験の用法です。"}, {"num": 6, "ja": "私は5年間東京にいます。", "hint": "have been", "notes": "「〜年間」など期間を表す場合はforを使います。", "en": "I have been in Tokyo for five years.", "pron": "", "exp": "「存在する」という意味のbe動詞の過去分詞beenを使います。"}, {"num": 7, "ja": "私はデビーを長い間知っています。", "hint": "have known", "notes": "", "en": "I have known Debby for a long time.", "pron": "", "exp": "「知っている（know）」という状態の継続を表します。"}, {"num": 8, "ja": "私はこの会社に3年間勤めています。", "hint": "have been working", "notes": "「〜に勤める」はwork for 〜を使いましょう。", "en": "I have been working for this company for three years.", "pron": "", "exp": "workなど動作の動詞の継続は現在完了進行形（have been＋〜ing形）を使います。"}, {"num": 9, "ja": "昨日からずっと雨が降っています。", "hint": "has been raining", "notes": "天候について話す場合、主語はItでしたね（UNIT 22の8を参照）。", "en": "It has been raining since yesterday.", "pron": "", "exp": "sinceの後ろにはyesterdayなど過去を表す単語が置かれて「〜以来」となります。"}]}, {"unit": 36, "chapter": "第2章 文法活用フレーズ編", "title": "「〜しない」意志を示す 否定文", "book_pages": "pp. 86-87", "page": 44, "scan_image": "reader_pages/page_044.jpg", "cd_info": "CD1 36 (Track 36)", "intro": "否定文で話すときには、notがはっきりしないと肯定文に受け取られます。話す練習をしっかりしておきましょう。", "key_title": "英会話のカギ", "key_content": "「〜ではない」とか「〜しない」のように否定文を作る場合、be動詞は後ろにnotをつけるだけでOK。一般動詞は前にdon'tやdoesn'tなどをつけます。英語は日本語と違い、否定の言葉が主語のすぐ後に来るので、文の最初のほうで相手が何を言おうとしているのかが分かります。", "items": [{"num": 1, "ja": "私はそんなにお腹が減っていません。", "hint": "am not", "notes": "", "en": "I'm not so hungry.", "pron": "", "exp": "I'm notはI am notの短縮形です。"}, {"num": 2, "ja": "ボブはスポーツが得意ではありません。", "hint": "is not", "notes": "", "en": "Bob is not good at sports.", "pron": "", "exp": "「〜が得意だ」はbe good at 〜です。"}, {"num": 3, "ja": "私は土日は仕事はしません。", "hint": "don't", "notes": "work（働く）の前にdon'tを置きます。", "en": "I don't work on Saturdays or Sundays.", "pron": "", "exp": "don'tはdo notの短縮形です。「土曜日に」など日を表すときはonを使います。"}, {"num": 4, "ja": "彼女は野菜があまり好きではありません。", "hint": "doesn't", "notes": "like（好きだ）の前にdoesn'tを置きます。", "en": "She doesn't like vegetables very much.", "pron": "", "exp": "sheは3人称単数で現在形なのでdoesn't (does not) を使います。"}, {"num": 5, "ja": "すみません。聞いていませんでした。", "hint": "wasn't", "notes": "過去進行形（be＋〜ing形）にします。", "en": "I'm sorry. I wasn't listening.", "pron": "", "exp": ""}, {"num": 6, "ja": "今朝は朝ご飯を食べませんでした。", "hint": "didn't", "notes": "eat（食べる）は一般動詞ですから、eatの前にdidn'tをつけます。", "en": "I didn't eat breakfast this morning.", "pron": "", "exp": "don'tとdoesn'tの過去形はdidn't (did not) です。"}, {"num": 7, "ja": "そのことは誰にも言いませんよ。", "hint": "won't", "notes": "未来の文にはwon't（will notの短縮形）を動詞の前に置きます。", "en": "I won't tell anybody about it.", "pron": "", "exp": "notとanybodyを一緒に使うと「誰も〜ない」のように全否定になります。"}, {"num": 8, "ja": "彼には何年も会っていません。", "hint": "haven't", "notes": "haven'tの後ろはsee（会う）の過去分詞が来ます。", "en": "I haven't seen him for years.", "pron": "", "exp": "過去から現在までずっと会っていないのですから現在完了形を使います。"}, {"num": 9, "ja": "ニューヨークへは一度も行ったことがありません。", "hint": "never", "notes": "「行ったことがある（ない）」（経験）はgoneではなくbeenを使います。", "en": "I have never been to New York.", "pron": "", "exp": "neverは「まったく〜ない」という意味。notの強調で使います。"}]}, {"unit": 37, "chapter": "第2章 文法活用フレーズ編", "title": "「ですか」「ますか」 一般疑問文", "book_pages": "pp. 88-89", "page": 45, "scan_image": "reader_pages/page_045.jpg", "cd_info": "CD1 37 (Track 37)", "intro": "疑問文は語順が変わるのでなかなか瞬時に出にくいものです。be動詞と一般動詞でそれぞれ練習しておくことが大切です。", "key_title": "英会話のカギ", "key_content": "am、are、isなどbe動詞を使った文を疑問文にする場合、be動詞を主語の前に出します。一般動詞の場合は、doやdoesを主語の前に置きます。その場合、動詞の語尾の3人称単数のsやes、そして過去形は原形に戻します。通常、文の最後は上げ調子で発音します。", "items": [{"num": 1, "ja": "あなたは留学生ですか。", "hint": "Are you 〜 ?", "notes": "", "en": "Are you an international student?", "pron": "", "exp": "You areの主語と動詞の順番を入れ替えるとAre youとなり、疑問文になります。"}, {"num": 2, "ja": "彼女はまだオフィスで仕事をしていますか。", "hint": "Is she 〜 ?", "notes": "「〜している」という現在進行形の疑問文です。", "en": "Is she still working in her office?", "pron": "", "exp": ""}, {"num": 3, "ja": "クレジットカードを持っていますか。", "hint": "Do you 〜 ?", "notes": "", "en": "Do you have a credit card?", "pron": "", "exp": "肯定文のYou haveの前にDoをつけて疑問文にします。"}, {"num": 4, "ja": "彼はこのあたりに住んでいますか。", "hint": "Does he 〜 ?", "notes": "「このあたりに」は「地域」という意味のareaを使ってみましょう。", "en": "Does he live in this area?", "pron": "", "exp": "Heという主語は3人称単数なので、DoではなくDoesです。"}, {"num": 5, "ja": "会社に遅刻したんですか。", "hint": "Were you 〜 ?", "notes": "この場合、「会社」は「仕事」ととらえましょう。", "en": "Were you late for work?", "pron": "", "exp": "areの過去形はwereですね。be late for 〜は「〜に遅れる」です。"}, {"num": 6, "ja": "彼は部屋にいましたか。", "hint": "Was he 〜 ?", "notes": "", "en": "Was he in his room?", "pron": "", "exp": "「存在する」というbe動詞を使います。活用はisの過去形のwasを使います。"}, {"num": 7, "ja": "昨夜はよく眠れましたか。", "hint": "Did you 〜 ?", "notes": "", "en": "Did you sleep well last night?", "pron": "", "exp": "doとdoesの過去形はdidです。"}, {"num": 8, "ja": "彼女はすぐ戻って来ますか。", "hint": "Will she 〜 ?", "notes": "「すぐ」はsoonです。", "en": "Will she be back soon?", "pron": "", "exp": "未来のことについて言う場合には主語にかかわらずwillを主語の前に出します。"}, {"num": 9, "ja": "ヨーロッパに行ったことがありますか。", "hint": "Have you 〜 ?", "notes": "「経験」を表す現在完了形を使います。", "en": "Have you ever been to Europe?", "pron": "", "exp": "「You have＋過去分詞」のhaveを主語 (you) の前に出します。"}]}, {"unit": 38, "chapter": "第2章 文法活用フレーズ編", "title": "「何？」「どれ？」 what / which", "book_pages": "pp. 90-91", "page": 46, "scan_image": "reader_pages/page_046.jpg", "cd_info": "CD1 38 (Track 38)", "intro": "whatは「何」、「何の」、「どんな」の意味で使います。使う頻度の高い疑問詞なので、基本フレーズを暗記しておきましょう。", "key_title": "英会話のカギ", "key_content": "whatやwhichなどの疑問詞を使って疑問文を作る場合は、一般疑問文の前に疑問詞を持ってきます。whatとwhichは名詞と結びついてひとまとまりになることもあります。例えば、what languageと言えば「何語」、what kindと言えば「どんな種類」、which teamと言えば「どのチーム」となります。", "items": [{"num": 1, "ja": "何をしているのですか。", "hint": "What 〜 ?", "notes": "現在進行形の一般疑問文が後ろに続きます。", "en": "What are you doing?", "pron": "", "exp": "What (何を) はdoingの目的語です。"}, {"num": 2, "ja": "どういうご用件ですか。", "hint": "What 〜 ?", "notes": "", "en": "What can I do for you?", "pron": "", "exp": ""}, {"num": 3, "ja": "どうしたのですか。", "hint": "What 〜 ?", "notes": "「問題は何なのですか」となります。", "en": "What's the matter?", "pron": "", "exp": "matterは「問題」という意味です。What'sはWhat isの短縮形です。"}, {"num": 4, "ja": "どんな音楽が好きですか。", "hint": "What kind of 〜 ?", "notes": "what kind of 〜 ? で「どんな（種類の）〜 ?」という意味です。", "en": "What kind of music do you like?", "pron": "", "exp": ""}, {"num": 5, "ja": "フィリピンでは何語を話すのですか。", "hint": "What language 〜 ?", "notes": "they (フィリピンに住んでいる人たち) を主語にします。", "en": "What language do they speak in the Philippines?", "pron": "", "exp": "フィリピンは群島なので複数形にします。固有名詞の複数形にはtheが必要です。"}, {"num": 6, "ja": "どちらがあなたのマグカップですか。", "hint": "Which 〜 ?", "notes": "二択（どちら）にはwhichを使います。", "en": "Which is your mug?", "pron": "", "exp": "英語ではマグカップのことは1語でmugと言います。"}, {"num": 7, "ja": "夏と冬とではどちらが好きですか。", "hint": "Which 〜 ?", "notes": "比較を表すbetter (より〜だ) を使います。", "en": "Which do you like better, summer or winter?", "pron": "", "exp": "summerを上げ調子、winterを下げ調子で発音しましょう。"}, {"num": 8, "ja": "どのバスが銀座に行きますか。", "hint": "Which bus 〜 ?", "notes": "whichは二択の「どちら（の）」の他に、三択以上の「どれ（どの）」にも使います。", "en": "Which bus goes to Ginza?", "pron": "", "exp": "which busが主語なので、その後ろに動詞 (goes) がきます。"}, {"num": 9, "ja": "どのサッカーチームが一番好きですか。", "hint": "Which 〜 team 〜 ?", "notes": "best (いちばん〜だ) を使います。", "en": "Which soccer team do you like the best?", "pron": "", "exp": "この場合、theを省略してもかまいません。"}]}, {"unit": 39, "chapter": "第2章 文法活用フレーズ編", "title": "「だれ？」「だれの？」 who / whose", "book_pages": "pp. 92-93", "page": 47, "scan_image": "reader_pages/page_047.jpg", "cd_info": "CD1 39 (Track 39)", "intro": "who（誰）は主語になることが多い疑問詞です。応答も他の疑問詞とは異なるので、質問→応答の練習をしておきましょう。", "key_title": "英会話のカギ", "key_content": "whoとwhoseを使った疑問文の作り方はUNIT 38と同じですが、whoはよく主語になります。例えば、She is Lisa. のLisaをwhoに変えて、Who is she?（彼女は誰ですか？）とします。whoseは直後に名詞を置いてwhose book（誰の本）となり、whose単独で「誰のもの」となります。", "items": [{"num": 1, "ja": "彼は誰ですか。——彼は私の友だちです。", "hint": "Who 〜 ?", "notes": "", "en": "Who is he? —— He is a friend of mine.", "pron": "", "exp": ""}, {"num": 2, "ja": "彼らは誰ですか。——彼らは私の同僚です。", "hint": "Who 〜 ?", "notes": "", "en": "Who are they? —— They are my coworkers.", "pron": "", "exp": "「同僚」はcolleagueとも言います。"}, {"num": 3, "ja": "どちら様ですか(家の玄関で)。——僕だよ、ブライアンだよ。", "hint": "Who 〜 ?", "notes": "主語はitを使います。", "en": "Who is it? —— It's me, Brian.", "pron": "", "exp": ""}, {"num": 4, "ja": "どちら様ですか（電話で）。——アンですが。", "hint": "Who 〜 ?", "notes": "「誰が電話をかけていますか」と聞きます。", "en": "Who's calling, please? —— This is Ann speaking.", "pron": "", "exp": "Who'sはWho isの短縮形。電話で「私は〜」はThis is 〜 (speaking). です。"}, {"num": 5, "ja": "誰が優勝しましたか。", "hint": "Who 〜 ?", "notes": "win（勝つ）の過去形を使います。", "en": "Who won the championship?", "pron": "", "exp": "wonはwinの過去形。one [ワン] と発音が同じです。[ウォン] と発音しないように。"}, {"num": 6, "ja": "これは誰のコンピュータですか。——あ〜、私のです。", "hint": "Whose computer 〜 ?", "notes": "mine（私のもの）という所有代名詞を使います。", "en": "Whose computer is this? —— Oh, it's mine.", "pron": "", "exp": ""}, {"num": 7, "ja": "あれは誰の車ですか。——私の父のです。", "hint": "Whose car 〜 ?", "notes": "", "en": "Whose car is that? —— It's my father's.", "pron": "", "exp": "fatherのように名詞や人の名前の場合は〜'sの形で「〜のもの」という意味になります。"}, {"num": 8, "ja": "このコートは誰のですか。——たぶんヨウコのです。", "hint": "Whose 〜 ?", "notes": "「たぶん」はprobablyを使ってみましょう。", "en": "Whose is this coat? —— It's probably Yoko's.", "pron": "", "exp": "Whose coat is this? とも言えます。"}, {"num": 9, "ja": "これらの本は誰のですか。——私たちのです。", "hint": "Whose 〜 ?", "notes": "ours（私たちのもの）という所有代名詞を使います。", "en": "Whose are these books? —— They are ours.", "pron": "", "exp": "Whose books are these? とも言えます。"}]}, {"unit": 40, "chapter": "第2章 文法活用フレーズ編", "title": "「いつ？」「どこ？」 when / where", "book_pages": "pp. 94-95", "page": 48, "scan_image": "reader_pages/page_048.jpg", "cd_info": "CD1 40 (Track 40)", "intro": "whenとwhereはTPOがはっきりした使いやすい疑問詞です。日本語につられて、atやtoなどをつけないようにしましょう。", "key_title": "英会話のカギ", "key_content": "whenは「いつ」という「時」を表す疑問詞です。「何時」や「何日」などを尋ねるときに使います。whereは「どこ」という「場所」を表す疑問詞です。疑問詞としてはいずれも副詞の役目をしますので、主語にはなりません。", "items": [{"num": 1, "ja": "あなたの誕生日はいつですか。——4月21日です。", "hint": "When 〜 ?", "notes": "答えるときは「月」「日」の順番で言いましょう。", "en": "When is your birthday? —— It's April 21.", "pron": "", "exp": "日は数字で書きますが、読み方は序数 [トゥウェニーファーストゥ] です。"}, {"num": 2, "ja": "夏休みはいつ始まりますか。", "hint": "When 〜 ?", "notes": "「始まる」はstartを使ってみましょう。", "en": "When does the summer vacation start?", "pron": "", "exp": ""}, {"num": 3, "ja": "あなたはふつういつ運動しますか。", "hint": "When 〜 ?", "notes": "「運動する」はexerciseです。", "en": "When do you usually exercise?", "pron": "", "exp": "usually (ふつう) など頻度を表す副詞は一般動詞の前、be動詞の後ろにきます。"}, {"num": 4, "ja": "いつ仕事を終えたのですか。", "hint": "When 〜 ?", "notes": "", "en": "When did you finish your work?", "pron": "", "exp": "「過去のいつ終わったのか」と聞いているので、現在完了形は使えません。"}, {"num": 5, "ja": "彼はいつシアトルを訪問する予定ですか。", "hint": "When 〜 ?", "notes": "予定を表すbe going to 〜を使いましょう。", "en": "When is he going to visit Seattle?", "pron": "", "exp": "toの後ろは動詞の原形です。"}, {"num": 6, "ja": "すみません。お手洗いはどこですか。", "hint": "Where 〜 ?", "notes": "", "en": "Excuse me. Where is the restroom?", "pron": "", "exp": "restroomはアメリカ英語。toilet (便所) は直接的な言い方なので避けられがちです。"}, {"num": 7, "ja": "どこに行きたいですか。", "hint": "Where 〜 ?", "notes": "", "en": "Where do you want to go?", "pron": "", "exp": "goの後ろに「〜に」という前置詞のtoを入れないように注意しましょう。"}, {"num": 8, "ja": "どこで彼に会う予定ですか。", "hint": "Where 〜 ?", "notes": "", "en": "Where are you going to meet him?", "pron": "", "exp": ""}, {"num": 9, "ja": "夕食はどこで食べましたか。", "hint": "Where 〜 ?", "notes": "過去なのでdidを使います。eatの代わりにhaveを使ってみましょう。", "en": "Where did you have dinner?", "pron": "", "exp": "haveは「食べる」や「飲む」という意味でも使います。"}]}, {"unit": 41, "chapter": "第2章 文法活用フレーズ編", "title": "「なぜ？」 why", "book_pages": "pp. 96-97", "page": 49, "scan_image": "reader_pages/page_049.jpg", "cd_info": "CD1 41 (Track 41)", "intro": "日本語では「まあ仕方ないな」と思うことでも、英語ではよく理由を聞かれるので答え方のパターンも練習しておきましょう。", "key_title": "英会話のカギ", "key_content": "Why 〜 ?（なぜ〜？）には「to＋動詞の原形」（〜するためです）や「Because 主語＋動詞」（なぜなら〜だからです）で答えるのが一般的です。whyの疑問文に答えるには、知識だけでは答えられないときがあります。論理的に理由を説明する力も身につけましょう。", "items": [{"num": 1, "ja": "なぜ彼は怒っているのですか。", "hint": "Why 〜 ?", "notes": "be動詞を主語の前に出します。", "en": "Why is he angry?", "pron": "", "exp": "「怒っている」はmadとも言います。"}, {"num": 2, "ja": "なぜそれらはそんなに値段が高いのですか。", "hint": "Why 〜 ?", "notes": "「値段が高い」はexpensiveです。", "en": "Why are they so expensive?", "pron": "", "exp": ""}, {"num": 3, "ja": "なぜ彼女は黙っていたのですか。", "hint": "Why 〜 ?", "notes": "「黙っている」は「静かな」と考えます。", "en": "Why was she quiet?", "pron": "", "exp": "「黙っている」はsilentとも言います。"}, {"num": 4, "ja": "なぜそう思うのですか。", "hint": "Why 〜 ?", "notes": "", "en": "Why do you think so?", "pron": "", "exp": ""}, {"num": 5, "ja": "なぜ彼女はアンティークが好きなのですか。", "hint": "Why 〜 ?", "notes": "", "en": "Why does she like antiques?", "pron": "", "exp": "主語のsheは3人称単数、時制は現在なのでdoesを使います。"}, {"num": 6, "ja": "なぜ英語を勉強するのですか。——いい仕事に就くためです。", "hint": "Why 〜 ?", "notes": "「〜するために」の「to＋動詞の原形」を使いましょう。", "en": "Why do you study English? —— To get a good job.", "pron": "", "exp": "UNIT 50の「to不定詞の副詞的用法」を参照してください。"}, {"num": 7, "ja": "なぜ空港に行くのですか。——夫を迎えに行くためです。", "hint": "Why 〜 ?", "notes": "「迎えに行く」はmeetでOKです。", "en": "Why are you going to the airport? —— To meet my husband.", "pron": "", "exp": "近い未来は進行形「be動詞＋〜ing形」を使います。"}, {"num": 8, "ja": "なぜ遅刻したのですか。——電車に乗り遅れたからです。", "hint": "Why 〜 ?", "notes": "「乗り遅れる」はmissを使います。", "en": "Why were you late? —— Because I missed the train.", "pron": "", "exp": "Because (なぜなら) の後ろは「主語＋動詞」です。"}, {"num": 9, "ja": "なぜ彼女はパーティーに現れなかったのですか。——病気だったからです。", "hint": "Why 〜 ?", "notes": "「現れる」はcomeでOKです。", "en": "Why didn't she come to the party? —— Because she was sick.", "pron": "", "exp": "「現れる」「出席する」はshow upとも言います。"}]}, {"unit": 42, "chapter": "第2章 文法活用フレーズ編", "title": "「どのように？」「どれくらい？」 how", "book_pages": "pp. 98-99", "page": 50, "scan_image": "reader_pages/page_050.jpg", "cd_info": "CD1 42 (Track 42)", "intro": "howは「どういうふうに」という「方法・手段」、「どのような」という「状態」を表し、多様な質問ができる便利な疑問詞です。", "key_title": "英会話のカギ", "key_content": "日本の人はhowとwhyの質問には弱い傾向があります。ある程度の説明ができるように練習しておきましょう。howは、long（長い）やold（古い、年をとっている）など、他の言葉と結びついてhow long（どのくらい長い）とかhow old（どのくらい古い、何歳）のように「程度」を尋ねるときにも使います。", "items": [{"num": 1, "ja": "大阪の天気はどうですか。——晴れています。", "hint": "How 〜 ?", "notes": "「晴れている」はsunnyです。", "en": "How is the weather in Osaka? —— It's sunny.", "pron": "", "exp": "weather (天気) の前にtheを忘れないようにしましょう。"}, {"num": 2, "ja": "日本までの飛行機の旅はいかがでしたか。——快適でした。", "hint": "How 〜 ?", "notes": "「飛行機（の旅）」はflightです。", "en": "How was your flight to Japan? —— It was great.", "pron": "", "exp": ""}, {"num": 3, "ja": "会社へはどうやって行きますか。——電車で行きます。", "hint": "How 〜 ?", "notes": "交通手段はby 〜で表します。", "en": "How do you go to work? —— By train.", "pron": "", "exp": "交通手段の場合には、trainなど乗り物を表す語にaやtheはつけません。"}, {"num": 4, "ja": "食事は美味しかったですか。——とても美味しかったです。", "hint": "How 〜 ?", "notes": "「食事はどのくらい好きでしたか」と言ってみましょう。", "en": "How did you like the food? —— I liked it very much.", "pron": "", "exp": "I liked it 〜のitを忘れないようにしましょう。"}, {"num": 5, "ja": "それはいくらですか。——25ドルです。", "hint": "How much 〜 ?", "notes": "", "en": "How much is it? —— It's 25 dollars.", "pron": "", "exp": ""}, {"num": 6, "ja": "あなたの息子さんは何歳ですか。——9歳です。", "hint": "How old 〜 ?", "notes": "", "en": "How old is your son? —— He is nine years old.", "pron": "", "exp": "He is nine. だけでもOKです。"}, {"num": 7, "ja": "CDを何枚持っていますか。——約200枚です。", "hint": "How many 〜 ?", "notes": "", "en": "How many CDs do you have? —— About two hundred.", "pron": "", "exp": "200でもhundredに複数のsはつけません。"}, {"num": 8, "ja": "どのくらい頻繁にジムに行きますか。——週に1回行きます。", "hint": "How often 〜 ?", "notes": "「1回」はonceです。", "en": "How often do you go to the gym? —— Once a week.", "pron": "", "exp": "2回はtwice、3回以降はthree times, four times... となります。"}, {"num": 9, "ja": "ここでどのくらい長く働いていますか。——7年働いています。", "hint": "How long 〜 ?", "notes": "現在完了進行形を使います。", "en": "How long have you been working here? —— For seven years.", "pron": "", "exp": "現在完了進行形の疑問文の文頭にHow longをつけた形です。"}]}, {"unit": 43, "chapter": "第2章 文法活用フレーズ編", "title": "「ですよね？」「でしょう？」 付加疑問文", "book_pages": "pp. 100-101", "page": 51, "scan_image": "reader_pages/page_051.jpg", "cd_info": "CD1 43 (Track 43)", "intro": "付加疑問文は文を言い切ったあとで、文の最後に「ですよね？」「でしょう？」というニュアンスをつけ加えます。", "key_title": "英会話のカギ", "key_content": "付加疑問文は、自分が言ったことを確認したり、響きを和らげたりする効果があります。通常、主文が肯定文の場合には否定文を、否定文の場合には肯定文をつけ足します。主語については、それぞれの文の主語と同じもの（または代名詞）を使います。", "items": [{"num": 1, "ja": "あなたはアメリカ出身ですね。", "hint": "〜 aren't you?", "notes": "「〜出身」と言うときはfromを使います。", "en": "You are from America, aren't you?", "pron": "", "exp": "be動詞を使った文を付加疑問文にするには、同じbe動詞をつけ足します。"}, {"num": 2, "ja": "これはあなたの傘ですね。", "hint": "〜 isn't it?", "notes": "", "en": "This is your umbrella, isn't it?", "pron": "", "exp": "主文のisが肯定ですから、否定のisn'tを使います。thisやthatはitに変えます。"}, {"num": 3, "ja": "あなたは日本語を話しますね。", "hint": "〜 don't you?", "notes": "", "en": "You speak Japanese, don't you?", "pron": "", "exp": "speakのような一般動詞には、don'tやdoesn'tを使います。"}, {"num": 4, "ja": "福田さんは銀行で働いていますね。", "hint": "〜 doesn't she?", "notes": "「〜で働く」はwork for 〜です。", "en": "Ms. Fukuda works for a bank, doesn't she?", "pron": "", "exp": "主語が固有名詞の場合は代名詞（この場合はshe）を使います。"}, {"num": 5, "ja": "ジョージは昨日ここに来ましたね。", "hint": "〜 didn't he?", "notes": "", "en": "George came here yesterday, didn't he?", "pron": "", "exp": "過去形にはdidn'tを使います。"}, {"num": 6, "ja": "あなたはカナダに行ったことがありますね。", "hint": "〜 haven't you?", "notes": "「行ったことがある」は「経験」を表す現在完了形です。", "en": "You have been to Canada, haven't you?", "pron": "", "exp": "現在完了形はhaveをhaven'tにします。don'tにしないように注意しましょう。"}, {"num": 7, "ja": "彼は家にいませんね。", "hint": "〜 is he?", "notes": "「家に」はat homeですがhomeだけでも大丈夫です。", "en": "He is not home, is he?", "pron": "", "exp": "主文が否定 (is not) ですから、肯定 (is) をつけ足します。"}, {"num": 8, "ja": "あなたは野菜が好きではありませんね。", "hint": "〜 do you?", "notes": "", "en": "You don't like vegetables, do you?", "pron": "", "exp": ""}, {"num": 9, "ja": "散歩に行きましょうか。", "hint": "〜 shall we?", "notes": "Let'sで始めます。", "en": "Let's take a walk, shall we?", "pron": "", "exp": "Let'sの文にはshall we? をつけ足します。"}]}, {"unit": 44, "chapter": "第2章 文法活用フレーズ編", "title": "丁寧な言い方をしたい 命令文", "book_pages": "pp. 102-103", "page": 52, "scan_image": "reader_pages/page_052.jpg", "cd_info": "CD1 44 (Track 44)", "intro": "英語の命令文は実に簡単！文を動詞の原形で始めればいいのです。Pleaseをつけた丁寧な依頼パターンも練習しましょう。", "key_title": "英会話のカギ", "key_content": "命令文は「あなた」か「あなたたち」に対してしか言わないので、主語のyouが省かれます。be動詞の場合はBeで始め、否定文はDon'tで始めます。Pleaseをつければ丁寧な依頼の文になります。", "items": [{"num": 1, "ja": "座りなさい。", "hint": "Have 〜", "notes": "「座席を持ちなさい」と考えます。", "en": "Have a seat.", "pron": "", "exp": "もちろんSit down. でもOK。Take a seat. とも言います。"}, {"num": 2, "ja": "私の言うことを信じなさい。", "hint": "Take 〜", "notes": "「私の言葉」に当たる英語を使います。", "en": "Take my word for it.", "pron": "", "exp": "「私の言葉」(my word) を「(心に) 取り入れる」(take) というイメージです。"}, {"num": 3, "ja": "もっとゆっくり話してください。", "hint": "Please 〜", "notes": "「ゆっくりと」はslowlyです。", "en": "Please speak more slowly.", "pron": "", "exp": "動詞の原形の前にpleaseをつけると「〜してください」と丁寧な言い方になります。"}, {"num": 4, "ja": "一緒に来てください。", "hint": "Please 〜", "notes": "", "en": "Please come with me.", "pron": "", "exp": ""}, {"num": 5, "ja": "お酒を飲み過ぎないように。", "hint": "Don't 〜", "notes": "「お酒を飲む」はdrinkだけでOK。「お酒」という名詞はいりません。", "en": "Don't drink too much.", "pron": "", "exp": "否定の命令文はDon'tで始めましょう。"}, {"num": 6, "ja": "みんなに親切にしなさい。", "hint": "Be 〜", "notes": "「親切な」はniceを使ってみましょう。", "en": "Be nice to everybody.", "pron": "", "exp": "You are nice. のYouを省略して、areを原形のbeに変えると考えます。"}, {"num": 7, "ja": "美術館内では静かにしてください。", "hint": "Please 〜", "notes": "", "en": "Please be quiet in the museum.", "pron": "", "exp": ""}, {"num": 8, "ja": "そんなささいなことで怒らないで。", "hint": "Don't 〜", "notes": "「怒っている」はangryを使いましょう。", "en": "Don't be angry about such a small thing.", "pron": "", "exp": ""}, {"num": 9, "ja": "図書館ではおしゃべりをしないでください。", "hint": "Please don't 〜", "notes": "「おしゃべりをする」はtalkを使いましょう。", "en": "Please don't talk in the library.", "pron": "", "exp": "pleaseはdon'tの前につけます。"}]}, {"unit": 45, "chapter": "第2章 文法活用フレーズ編", "title": "動詞に意味を添える 助動詞", "book_pages": "pp. 104-105", "page": 53, "scan_image": "reader_pages/page_053.jpg", "cd_info": "CD1 45 (Track 45)", "intro": "助動詞をうまく使えば、可能・可能性・義務・禁止など、動詞にさまざまな意味を添えられます。", "key_title": "英会話のカギ", "key_content": "run（走る）という動詞の前に助動詞のcan（〜できる）をつけ、can runとすることによって「走ることができる」となります。主語が何であれ、助動詞の後ろは動詞の原形です。疑問文は助動詞を主語の前に出し、否定文は助動詞の後ろにnotをつけます。", "items": [{"num": 1, "ja": "ジュンコは英語とスペイン語が話せます。", "hint": "can", "notes": "", "en": "Junko can speak English and Spanish.", "pron": "", "exp": "Junko speaks はcan をつけるとspeak（動詞の原形）になります。"}, {"num": 2, "ja": "ギターを弾けますか。——はい、弾けます。/ いいえ、弾けません。", "hint": "can", "notes": "疑問文を作るには助動詞canを主語の前に出しましょう。", "en": "Can you play the guitar? —— Yes, I can. / No, I can't.", "pron": "", "exp": ""}, {"num": 3, "ja": "もう帰ってもいいですよ。", "hint": "may", "notes": "leave (帰る、立ち去る) を使いましょう。", "en": "You may leave now.", "pron": "", "exp": "mayは「〜してもよい」です。"}, {"num": 4, "ja": "あなたが正しいかもしれません。", "hint": "may", "notes": "", "en": "You may be right.", "pron": "", "exp": "mayには「〜かもしれない」という意味もあります。"}, {"num": 5, "ja": "あなたは今すぐそれをしなければなりません。", "hint": "must [have to]", "notes": "have toは [ハフトゥ] と発音します（UNIT 26の5を参照）。", "en": "You must [have to] do it right now.", "pron": "", "exp": "mustは強い強制です。right nowは「今すぐ」です。"}, {"num": 6, "ja": "あなたは疲れているに違いありません。", "hint": "must", "notes": "", "en": "You must be tired.", "pron": "", "exp": "mustには「〜に違いない」という意味もあります。"}, {"num": 7, "ja": "そこに入ってはいけません。", "hint": "must not", "notes": "「〜してはいけない」と「禁止」の意味にするにはmust notとします。", "en": "You must not go in there.", "pron": "", "exp": "must notはmustn't [マスントゥ] とも言います（UNIT 26の4を参照）。"}, {"num": 8, "ja": "私と一緒に来なくてもいいですよ。", "hint": "don't have to", "notes": "一般動詞の否定文と同じようにdon'tを使います。", "en": "You don't have to come with me.", "pron": "", "exp": "mustとhave toはほぼ同じ意味でも、否定文になると意味が変わります。"}, {"num": 9, "ja": "飛行機の時刻を調べるべきですよ。", "hint": "should", "notes": "「調べる」はcheckを使ってみましょう。", "en": "You should check the plane schedule.", "pron": "", "exp": ""}]}, {"unit": 46, "chapter": "第2章 文法活用フレーズ編", "title": "上手に使おう 受動態", "book_pages": "pp. 106-107", "page": 54, "scan_image": "reader_pages/page_054.jpg", "cd_info": "CD2 01 (Track 46)", "intro": "会話の中で受動態を何度も繰り返して使いすぎると、内容が消極的な響きになることがあります。適度に使うようにしましょう。", "key_title": "英会話のカギ", "key_content": "受動態は「〜される」のように、主語が他から動作をしかけられる「受け身」の意味を表します。基本形は「be動詞＋過去分詞」です。例えば、「私はインタビューされました」はI was interviewed. となります。過去分詞は過去形と同じ形のものが多くですが、まったく形が異なるものもあるで、少しずつ覚えていきましょう。", "items": [{"num": 1, "ja": "フランスは多くの芸術家によって訪問されます。", "hint": "is visited", "notes": "「〜によって」はby 〜です。", "en": "France is visited by many artists.", "pron": "", "exp": ""}, {"num": 2, "ja": "その本は彼女によって書かれました。", "hint": "was written", "notes": "byの後ろが代名詞の場合は目的格を使います。", "en": "That book was written by her.", "pron": "", "exp": "sheは主格、herが目的格です。"}, {"num": 3, "ja": "すべての仕事は小坂さんによってなされました。", "hint": "was done", "notes": "", "en": "All the work was done by Mr. Kosaka.", "pron": "", "exp": "work (仕事) は数えられない名詞なので単数扱いです。doneはdoの過去分詞です。"}, {"num": 4, "ja": "このシステムは日本企業によって導入されました。", "hint": "was introduced", "notes": "", "en": "This system was introduced by a Japanese company.", "pron": "", "exp": "introduceは「紹介する」、「導入する」という意味です。"}, {"num": 5, "ja": "リンダの犬はクピピと呼ばれています。", "hint": "is called", "notes": "周りの人たち全員にそう呼ばれているのでby 〜は言わなくても分かります。", "en": "Linda's dog is called Kupipi.", "pron": "", "exp": "補語 (Kupipi) はcalledの直後に置きます。"}, {"num": 6, "ja": "ここからたくさんの星が見られます。", "hint": "can be seen", "notes": "これも特定の人によって見られるわけではないのでby 〜は省略します。", "en": "A lot of stars can be seen from here.", "pron": "", "exp": "canなど助動詞がある場合は、be動詞は原形にします。"}, {"num": 7, "ja": "小包は明日送られます。", "hint": "will be sent", "notes": "", "en": "The package will be sent tomorrow.", "pron": "", "exp": "willも未来を表す助動詞なのでbe動詞は原形を使います。"}, {"num": 8, "ja": "食事はちょうど今作られています。", "hint": "is being cooked", "notes": "「ちょうど今」はright nowを使ってみましょう。", "en": "The food is being cooked right now.", "pron": "", "exp": "現在進行形の受動態 (〜されている) は「be動詞＋being＋過去分詞」です。"}, {"num": 9, "ja": "コンピュータはちょうど修理されたところです。", "hint": "has been repaired", "notes": "「ちょうど」はjustを使います。", "en": "The computer has just been repaired.", "pron": "", "exp": "現在完了形の受動態 (〜されたところです) は「have been＋過去分詞」です。"}]}, {"unit": 47, "chapter": "第2章 文法活用フレーズ編", "title": "「あります」「います」 there is 構文", "book_pages": "pp. 108-109", "page": 55, "scan_image": "reader_pages/page_055.jpg", "cd_info": "CD2 02 (Track 47)", "intro": "There is / are 〜は「〜があります」や「〜がいます」のように存在を表現するための文です。", "key_title": "英会話のカギ", "key_content": "日本語では生物（植物以外）には「います」を使い、無生物には「あります」を使いますが、英語にはその使い分けはありません。その代わりに、後ろに来る名詞が単数であればThere is 〜 . (There was 〜 .)、複数であればThere are 〜 . (There were 〜 .) とします。", "items": [{"num": 1, "ja": "テーブルの上に新聞があります。", "hint": "There is 〜", "notes": "「ひとつの新聞」と考えて単数形を使いましょう。", "en": "There is a newspaper on the table.", "pron": "", "exp": "newspaperの前に冠詞のaを忘れないようにしましょう。"}, {"num": 2, "ja": "門のところに警備員がいます。", "hint": "There is 〜", "notes": "「門」という「場所」を表す前置詞atを使います。", "en": "There is a guard at the gate.", "pron": "", "exp": "「警備員」はguardです。「ガードマン」は和製英語です。"}, {"num": 3, "ja": "日本には温泉がたくさんあります。", "hint": "There are 〜", "notes": "「温泉」はhot springです。", "en": "There are many hot springs in Japan.", "pron": "", "exp": "「たくさんの温泉」なので複数形にします。there areを使いましょう。"}, {"num": 4, "ja": "この近くに郵便局がありますか。", "hint": "Is there 〜 ?", "notes": "", "en": "Is there a post office around here?", "pron": "", "exp": "疑問文はthere isの語順を逆にします。「この近くに」はnear hereでもOK。"}, {"num": 5, "ja": "冷蔵庫の中に卵がありますか。", "hint": "Are there 〜 ?", "notes": "「冷蔵庫」はrefrigeratorです。", "en": "Are there any eggs in the refrigerator?", "pron": "", "exp": "疑問文ではanyは「いくつか」という意味で使います。"}, {"num": 6, "ja": "彼の部屋には大きなソファーがありました。", "hint": "There was 〜", "notes": "単数の過去形にはwasを使います。", "en": "There was a big sofa in his room.", "pron": "", "exp": "「ありました」ですから過去形にするのを忘れないように。"}, {"num": 7, "ja": "スタジアムにはたくさんの人がいました。", "hint": "There were 〜", "notes": "複数の過去形にはwereを使います。", "en": "There were many people in the stadium.", "pron": "", "exp": "stadiumの発音は [ステイディアム] と聞こえます。"}, {"num": 8, "ja": "昔そこに大きな桜の木がありました。", "hint": "There used to be 〜", "notes": "「大きな」はhuge (巨大な) を使ってみましょう。", "en": "There used to be a huge cherry tree there.", "pron": "", "exp": "used to は「昔はそうだったが今はそうではない」という意味です。"}, {"num": 9, "ja": "あまり時間が残っていません。", "hint": "There is not 〜", "notes": "「残されて」という意味のleft (leaveの過去分詞) を使います。", "en": "There is not much time left.", "pron": "", "exp": "timeは数えられない名詞なのでmanyではなくmuchを使います。"}]}, {"unit": 48, "chapter": "第2章 文法活用フレーズ編", "title": "「〜すること」 to不定詞 名詞的用法", "book_pages": "pp. 110-111", "page": 56, "scan_image": "reader_pages/page_056.jpg", "cd_info": "CD2 03 (Track 48)", "intro": "「〜すること」という名詞の働きをして、主語や補語、目的語として使います。「動詞＋to不定詞」の常用表現も練習します。", "key_title": "英会話のカギ", "key_content": "「to不定詞」とは「to＋動詞の原形」のことです。名詞的用法（〜すること）では、例えば、to exerciseは「運動すること」という意味になります。To exercise is important.（運動することは大切です）のように主語にも、I need to exercise.（私は運動することが必要です）のように目的語や、補語でも使うことができます。", "items": [{"num": 1, "ja": "バイオリンを弾くことは難しいです。", "hint": "To play 〜", "notes": "", "en": "To play the violin is difficult.", "pron": "", "exp": "playの後ろに楽器名が来る場合はtheが必要です。"}, {"num": 2, "ja": "英語を学ぶことはとても大切です。", "hint": "To study 〜", "notes": "", "en": "To study English is very important.", "pron": "", "exp": ""}, {"num": 3, "ja": "毎日運動することは健康に良いです。", "hint": "To exercise 〜", "notes": "", "en": "To exercise every day is good for your health.", "pron": "", "exp": "exerciseは「運動」という名詞と「運動する」という動詞があります。"}, {"num": 4, "ja": "彼の仕事は輸入車を売ることです。", "hint": "to sell", "notes": "", "en": "His job is to sell imported cars.", "pron": "", "exp": ""}, {"num": 5, "ja": "私の趣味は写真を撮ることです。", "hint": "to take", "notes": "", "en": "My hobby is to take pictures.", "pron": "", "exp": "to takeの代わりにtakingでもOK (UNIT 52参照)。"}, {"num": 6, "ja": "彼ともう一度話したいです。", "hint": "to talk", "notes": "「話したい」は「話すことを欲する」と考えます。", "en": "I want to talk to him again.", "pron": "", "exp": "talk to 〜 (talk with 〜) は「〜と話す」です。"}, {"num": 7, "ja": "ドナは突然泣き始めました。", "hint": "to cry", "notes": "「泣くことを始めた」と考えます。", "en": "Donna suddenly began to cry.", "pron": "", "exp": "begin (始める) の過去形beganを使います。"}, {"num": 8, "ja": "私はお金を貯めようと努力しました。", "hint": "to save", "notes": "「貯めることを試みた」と考えます。", "en": "I tried to save money.", "pron": "", "exp": ""}, {"num": 9, "ja": "私たちはそこにタクシーで行くことに決めました。", "hint": "to go", "notes": "", "en": "We decided to go there by taxi.", "pron": "", "exp": "by taxiは「タクシーで」。交通手段の場合はbusなど乗り物にaはつけません。"}]}, {"unit": 49, "chapter": "第2章 文法活用フレーズ編", "title": "「〜するための」 to不定詞 形容詞的用法", "book_pages": "pp. 112-113", "page": 57, "scan_image": "reader_pages/page_057.jpg", "cd_info": "CD2 04 (Track 49)", "intro": "形容詞的用法は後ろから名詞を修飾します。話すときには、名詞につけ足す感覚で言うといいでしょう。", "key_title": "英会話のカギ", "key_content": "to不定詞の形容詞的用法は、to不定詞が名詞を修飾する用法です。例えば、a book to read（読むための本）のようにto不定詞を名詞の後ろに置きます。something to drinkなら「飲むための何か」、つまり「何か飲み物」という意味になります。", "items": [{"num": 1, "ja": "今日はするべきことがたくさんあります。", "hint": "to do", "notes": "文をI haveで始めてみましょう。", "en": "I have a lot of things to do today.", "pron": "", "exp": "「するべきこと」は「するためのこと」と考えます。"}, {"num": 2, "ja": "何か飲み物が欲しいです。", "hint": "to drink", "notes": "「何か」はsomethingを使います。", "en": "I'd like something to drink.", "pron": "", "exp": "I'd likeはI wantの丁寧な言い方です。I want something to drink. でもOKです。"}, {"num": 3, "ja": "何か読むものがありますか。", "hint": "to read", "notes": "「ありますか」は「持っていますか」と考え、haveを使います。", "en": "Do you have anything to read?", "pron": "", "exp": "someは通常、疑問文と否定文ではanyに変わります。"}, {"num": 4, "ja": "何も言うことはありません。", "hint": "to say", "notes": "", "en": "I don't have anything to say.", "pron": "", "exp": "[not＋any] で「何も〜ない」という全否定になります。"}, {"num": 5, "ja": "沖縄には見るべき場所がたくさんあります。", "hint": "to see", "notes": "there is構文を使ってみましょう。", "en": "There are many places to see in Okinawa.", "pron": "", "exp": ""}, {"num": 6, "ja": "私たちは手伝ってくれる誰かを探しています。", "hint": "to help", "notes": "「探す」はlook forです。", "en": "We are looking for someone to help us.", "pron": "", "exp": "今探しているので現在進行形 (be動詞＋〜ing) を使います。"}, {"num": 7, "ja": "私にはかけるべき重要な電話があります。", "hint": "to make", "notes": "", "en": "I have an important phone call to make.", "pron": "", "exp": "「かける」は基本動詞のmakeを使います。"}, {"num": 8, "ja": "彼は話す友だちが1人もいません。", "hint": "to talk", "notes": "He doesn'tで始めます。", "en": "He doesn't have any friends to talk with.", "pron": "", "exp": "[not＋any] ＝「全然〜ない」。talkの後ろのwithを忘れないように。"}, {"num": 9, "ja": "彼女には世話をする小さい子どもたちがいます。", "hint": "to take", "notes": "基本動詞haveを使います。", "en": "She has little children to take care of.", "pron": "", "exp": "take care of 〜は「〜の世話をする」です。"}]}, {"unit": 50, "chapter": "第2章 文法活用フレーズ編", "title": "「〜するために」 to不定詞 副詞的用法", "book_pages": "pp. 114-115", "page": 58, "scan_image": "reader_pages/page_058.jpg", "cd_info": "CD2 05 (Track 50)", "intro": "「〜するために」という目的の用法でよく使います。主文のあとにつけ加えるように話しましょう。", "key_title": "英会話のカギ", "key_content": "to不定詞の副詞的用法にはいくつか種類がありますが、ここでは「目的」（〜するために）を表す使い方を取り上げます。例えば、I go to college to study Medicine.（私は医学を勉強するために大学に行っています）のように、動詞（この場合go）を後ろから修飾します。", "items": [{"num": 1, "ja": "私は食料品を買うためにスーパーに行きました。", "hint": "to buy", "notes": "「食料品」はgroceriesです。", "en": "I went to the supermarket to buy some groceries.", "pron": "", "exp": "「スーパーに行った」と言った後で「食料品を買うために」と言います。"}, {"num": 2, "ja": "私たちは快速電車に乗るために走りました。", "hint": "to catch", "notes": "「(電車など) に乗る」はcatchです。", "en": "We ran to catch the express train.", "pron": "", "exp": "express trainは「快速電車、急行電車」。「各駅停車」はlocal trainです。"}, {"num": 3, "ja": "私は友だちに会うために喫茶店に行きます。", "hint": "to meet", "notes": "", "en": "I'll go to the coffee shop to meet my friends.", "pron": "", "exp": ""}, {"num": 4, "ja": "彼は経営学を学ぶために大学に行きました。", "hint": "to study", "notes": "", "en": "He went to college to study Business.", "pron": "", "exp": "「経営学」はbusinessまたはbusiness administrationです。"}, {"num": 5, "ja": "彼女はいい成績を取るために一生懸命に勉強しました。", "hint": "to get", "notes": "「成績」はgradeです。", "en": "She studied hard to get good grades.", "pron": "", "exp": "科目が複数であればgradeは複数形にしましょう。"}, {"num": 6, "ja": "私はホットケーキを作るためにミルクと卵を買いました。", "hint": "to make", "notes": "「ホットケーキ」はpancakeと言います。", "en": "I bought some milk and eggs to make pancakes.", "pron": "", "exp": ""}, {"num": 7, "ja": "私はアドバイスをもらうために彼女に会いに行く予定です。", "hint": "to ask", "notes": "「〜する予定です」はbe going to 〜を使いましょう。", "en": "I'm going to meet her to ask for some advice.", "pron": "", "exp": "ask for 〜は「〜を要求する」という意味です。"}, {"num": 8, "ja": "ジムは電話をするために立ち止まりました。", "hint": "to make", "notes": "「電話をする」はmakeを使います (UNIT 49の7を参照)。", "en": "Jim stopped to make a phone call.", "pron": "", "exp": "make a phone callは「電話をする」という意味です。"}, {"num": 9, "ja": "私は健康であるために毎日ジョギングをします。", "hint": "to stay", "notes": "「ジョギングをする」はjogという動詞を使います。", "en": "I jog every day to stay healthy.", "pron": "", "exp": "「stay＋形容詞」で「〜の状態のままでいる」という意味です。"}]}, {"unit": 51, "chapter": "第2章 文法活用フレーズ編", "title": "「日時」「天気」を話す itの用法", "book_pages": "pp. 116-117", "page": 59, "scan_image": "reader_pages/page_059.jpg", "cd_info": "CD2 06 (Track 51)", "intro": "itには「それ」と訳さない特別な用法があります。「日時」、「天候」、「寒暖」、「明暗」などを表すために主語として使います。", "key_title": "英会話のカギ", "key_content": "「暑い」はIt is hot.、「雨が降る」はIt rains.です。「(時間が)かかる」はIt takes 〜.、「(費用が)かかる」はIt costs 〜.と言います。また、to不定詞（名詞的用法）の仮の主語としても使います。", "items": [{"num": 1, "ja": "今日は暑いです。", "hint": "It is 〜", "notes": "", "en": "It is hot today.", "pron": "", "exp": "もちろんToday is hot. でもOK。"}, {"num": 2, "ja": "雨がひどく降っています。", "hint": "It is 〜", "notes": "「ひどく」はhardです。", "en": "It is raining very hard.", "pron": "", "exp": ""}, {"num": 3, "ja": "この部屋はとても暗いですね。", "hint": "It is 〜", "notes": "", "en": "It is so dark in this room.", "pron": "", "exp": ""}, {"num": 4, "ja": "今何時ですか。―― 5時半です。", "hint": "〜 is it ?", "notes": "", "en": "What time is it now? ―― It's 5:30.", "pron": "", "exp": ""}, {"num": 5, "ja": "今日は何曜日ですか。―― 火曜日です。", "hint": "〜 is it ?", "notes": "「何曜日」はwhat dayと言います。", "en": "What day is it today? ―― It's Tuesday.", "pron": "", "exp": "「今日は何日ですか」はWhat's the date today? です。"}, {"num": 6, "ja": "そこに着くのに約10分かかります。", "hint": "It takes 〜", "notes": "to不定詞の副詞的用法（〜するために）を使います。", "en": "It takes about ten minutes to get there.", "pron": "", "exp": "「It takes（+人）+所要時間+to不定詞」で「人に（時間が）かかる」という意味です。"}, {"num": 7, "ja": "アメリカを旅行するのにすごくお金がかかりました。", "hint": "It cost 〜", "notes": "6と同様にto不定詞の副詞的用法（〜するために）を使います。", "en": "It cost me a lot of money to travel in America.", "pron": "", "exp": "cost（費用がかかる）の過去形は、現在形と同じcostです。"}, {"num": 8, "ja": "外国を訪れるのは面白いです。", "hint": "It 〜 to 〜", "notes": "まず「面白い」と言って、何が面白いかを後で言います。", "en": "It is interesting to visit foreign countries.", "pron": "", "exp": "Itはto以下を示す仮の主語です。実際の主語はto以下です。"}, {"num": 9, "ja": "この仕事をすることは私にとって難しいです。", "hint": "It 〜 to 〜", "notes": "「〜にとって」はfor 〜です。", "en": "It is difficult for me to do this work.", "pron": "", "exp": "for 〜（〜にとって）は通常toの前に置きます。"}]}, {"unit": 52, "chapter": "第2章 文法活用フレーズ編", "title": "「〜すること」 動名詞", "book_pages": "pp. 118-119", "page": 60, "scan_image": "reader_pages/page_060.jpg", "cd_info": "CD2 07 (Track 52)", "intro": "動名詞は文字通り、動詞が名詞化したもので「〜すること」という意味になり、〜 ing形で表します。", "key_title": "英会話のカギ", "key_content": "動名詞は「〜すること」となるのでto不定詞の名詞的用法と同じように使われる場合もあります。ただし、enjoy、finish、mindなど特定の動詞の後ろや、of、on、fromなど前置詞の後ろには動名詞を使い、to不定詞の名詞的用法を使うことはできません。", "items": [{"num": 1, "ja": "英語を話すことはそんなに簡単ではありません。", "hint": "Speaking 〜", "notes": "", "en": "Speaking English is not so easy.", "pron": "", "exp": ""}, {"num": 2, "ja": "海岸沿いにドライブするのはとても楽しいです。", "hint": "Driving 〜", "notes": "「海岸」はcoastです。", "en": "Driving along the coast is a lot of fun.", "pron": "", "exp": "along 〜は「〜に沿って」。「とても楽しい」はa lot of fun（たくさんの楽しみ）です。"}, {"num": 3, "ja": "私の趣味はクラシック音楽を聴くことです。", "hint": "listening", "notes": "「クラシック音楽」はclassical musicです。", "en": "My hobby is listening to classical music.", "pron": "", "exp": "listeningの後ろのtoを忘れないようにしましょう。"}, {"num": 4, "ja": "早朝に散歩をすることが好きです。", "hint": "taking", "notes": "「散歩をする」はtake a walkです。", "en": "I like taking
