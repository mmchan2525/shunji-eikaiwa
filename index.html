a walk early in the morning.", "pron": "", "exp": ""}, {"num": 5, "ja": "おしゃべりをやめてもらえませんか。", "hint": "talking", "notes": "「stop 〜 ing」で「〜することをやめる」です。", "en": "Will you please stop talking?", "pron": "", "exp": "Will you 〜?は「〜してくれませんか」と人にお願いをするときに使います。"}, {"num": 6, "ja": "先週の日曜日はテニスをして楽しみました。", "hint": "playing", "notes": "", "en": "We enjoyed playing tennis last Sunday.", "pron": "", "exp": "enjoyの後ろはto不定詞ではなく動名詞です。"}, {"num": 7, "ja": "昼食はもう食べ終わりましたか。", "hint": "eating", "notes": "疑問文で「もう」はyetを使います。", "en": "Have you finished eating lunch yet?", "pron": "", "exp": "「〜してしまった」は現在完了形です。"}, {"num": 8, "ja": "ドアを開けてくださいませんか。", "hint": "opening", "notes": "動詞はmindを使ってみましょう。", "en": "Would you mind opening the door for me?", "pron": "", "exp": "Would you mind 〜 ing?はとても丁寧なお願いの表現です。"}, {"num": 9, "ja": "間違えることを恐れないでください。", "hint": "making", "notes": "「間違いをおかす」はmake mistakesです。", "en": "Don't be afraid of making mistakes.", "pron": "", "exp": "前置詞ofの後ろはto不定詞は使えません。"}]}, {"unit": 53, "chapter": "第2章 文法活用フレーズ編", "title": "「〜している」「〜された」 現在分詞・過去分詞", "book_pages": "pp. 120-121", "page": 61, "scan_image": "reader_pages/page_061.jpg", "cd_info": "CD2 08 (Track 53)", "intro": "現在分詞は「〜している…」という能動の意味で、過去分詞は「〜された…」という受動の意味で名詞を修飾します。", "key_title": "英会話のカギ", "key_content": "現在分詞は動名詞と見た目は同じ〜 ing形で進行形に使います。過去分詞は受動態や完了形に使います。ここでは、現在分詞・過去分詞が名詞を修飾する例を挙げます。a sleeping babyのように名詞の前に置いたり、a baby sleeping in the roomのように副詞句(in the room)がある場合はまとめて名詞の後ろに置きます。", "items": [{"num": 1, "ja": "その眠っている赤ちゃんを起こさないで。", "hint": "sleeping", "notes": "", "en": "Don't wake that sleeping baby.", "pron": "", "exp": "sleeping（眠っている）が名詞babyを前から修飾します。"}, {"num": 2, "ja": "私の娘はほえている犬が怖い。", "hint": "barking", "notes": "「〜が怖い」はbe afraid of 〜を使います。", "en": "My daughter is afraid of barking dogs.", "pron": "", "exp": "barking 〜は「ほえている〜」となります。〜 ing形は進行の意味があります。"}, {"num": 3, "ja": "ベンチに座っている女の人は私の母です。", "hint": "sitting", "notes": "どんな女の人かを後ろで説明します。", "en": "The woman sitting on the bench is my mother.", "pron": "", "exp": "sittingとon the benchを切り離せないので、まとめてwomanの後ろに置きます。"}, {"num": 4, "ja": "ドアのそばに立っている男の子を知っていますか。", "hint": "standing", "notes": "どんな男の子なのかを後ろで説明します。", "en": "Do you know the boy standing by the door?", "pron": "", "exp": "3と同様に「ドアのそばに」のような副詞句がある場合は後ろから修飾します。"}, {"num": 5, "ja": "私は先月、中古車を買いました。", "hint": "used", "notes": "", "en": "I bought a used car last month.", "pron": "", "exp": "過去分詞usedは「使われた」という意味でcarを前から修飾します。"}, {"num": 6, "ja": "割れたガラスを踏まないでください。", "hint": "broken", "notes": "「〜を踏む」はstep on 〜です。", "en": "Don't step on that broken glass.", "pron": "", "exp": "過去分詞は受け身の意味。breakの過去分詞、brokenは「割られた」という意味です。"}, {"num": 7, "ja": "彼はスイス製の時計を持っています。", "hint": "made", "notes": "「スイスで作られた時計」と考えます。", "en": "He has a watch made in Switzerland.", "pron": "", "exp": "made in Switzerlandがwatchを後ろから修飾します。"}, {"num": 8, "ja": "インドで話されている言語は何ですか。", "hint": "spoken", "notes": "", "en": "What is the language spoken in India?", "pron": "", "exp": "spokenはspeakの過去分詞で「話される」となります。"}, {"num": 9, "ja": "幸運を祈っておいてください。", "hint": "crossed", "notes": "基本動詞keepを使います。", "en": "Please keep your fingers crossed.", "pron": "", "exp": "直訳は「指が交差された状態を保つ」ですが「幸運を祈る」という決まり文句です。"}]}, {"unit": 54, "chapter": "第2章 文法活用フレーズ編", "title": "「〜させる」「〜してもらう」 使役動詞", "book_pages": "pp. 122-123", "page": 62, "scan_image": "reader_pages/page_062.jpg", "cd_info": "CD2 09 (Track 54)", "intro": "「人に〜させる」、「人に〜してもらう」などと言いたいときに使う動詞です。make / let / have / getでニュアンスも異なります。", "key_title": "英会話のカギ", "key_content": "「使役動詞+目的語+動詞の原形（過去分詞）」という形でよく使います。makeは主語が「人」の場合は、通常「強制」（無理に〜させる）です。letは「〜させてあげる」、haveは「（頼んで）〜してもらう」という意味で使います。", "items": [{"num": 1, "ja": "上司が私たちに夜遅くまで仕事をさせました。", "hint": "make", "notes": "", "en": "Our boss made us work till late at night.", "pron": "", "exp": "「残業したくないのに残業させた」という意味です。"}, {"num": 2, "ja": "そのにおいは私の気分を悪くさせます。", "hint": "make", "notes": "「におい」はsmellです。", "en": "The smell makes me feel sick.", "pron": "", "exp": ""}, {"num": 3, "ja": "父が車を運転させてくれた。", "hint": "let", "notes": "letは現在形と過去形は同じ形です。", "en": "My father let me drive his car.", "pron": "", "exp": "「私が運転したいと言っているので運転させてくれた」という意味です。"}, {"num": 4, "ja": "もし助けが必要なら知らせてください。", "hint": "let", "notes": "「知るようにさせてあげる」と考えます。", "en": "Please let me know if you need any help.", "pron": "", "exp": ""}, {"num": 5, "ja": "私は妹に皿を洗ってもらいました。", "hint": "have", "notes": "", "en": "I had my sister do the dishes.", "pron": "", "exp": "「頼んで洗ってもらった」という意味です。doの代わりにwashでもOK。"}, {"num": 6, "ja": "自動車整備士に車を見てもらいます。", "hint": "have", "notes": "「自動車整備士」はmechanicです。", "en": "I'll have a mechanic look at my car.", "pron": "", "exp": "「車が調子が悪いのて頼んで見てもらう」という意味です。"}, {"num": 7, "ja": "彼女は血液を検査してもらった。", "hint": "have", "notes": "「検査する」はcheckを使ってみましょう。", "en": "She had her blood checked.", "pron": "", "exp": "目的語が「物」の場合、後ろには過去分詞が来ます。「〜を…してもらう」となります。"}, {"num": 8, "ja": "明日、髪を切ってもらいます。", "hint": "get", "notes": "cut（切る）の過去分詞は現在形と同じcutです。", "en": "I'll get my hair cut tomorrow.", "pron": "", "exp": "「物」が目的語の場合、haveの代わりにgetも使えます。"}, {"num": 9, "ja": "このプリンターを来週までに修理してもらえませんか。", "hint": "get", "notes": "「修理する」はfixを使ってみましょう。", "en": "Can I get this printer fixed by next week?", "pron": "", "exp": ""}]}, {"unit": 55, "chapter": "第2章 文法活用フレーズ編", "title": "「見える」「聞こえる」「感じる」 知覚動詞", "book_pages": "pp. 124-125", "page": 63, "scan_image": "reader_pages/page_063.jpg", "cd_info": "CD2 10 (Track 55)", "intro": "see（見える）/ hear（聞こえる）/ feel（感じる）など、人の感覚を表す動詞です。語順に注意して練習しましょう。", "key_title": "英会話のカギ", "key_content": "seeを使った場合、知覚動詞(see) + 目的語の後ろに動詞の原形を使えば「___が〜するのを見る」、現在分詞(〜 ing形)を使えば「___が〜しているのを見る」、過去分詞を使えば「___が〜されるのを見る」という意味になります。", "items": [{"num": 1, "ja": "彼女が通りを横切るのが見えました。", "hint": "see", "notes": "「知覚動詞+目的語+動詞の原形」の形を使います。seeの過去形はsawです。", "en": "I saw her walk across the street.", "pron": "", "exp": "seeは「視界に入る」、「見える」というイメージです。"}, {"num": 2, "ja": "私はジョンが歌を歌うのを聞いたことがありません。", "hint": "hear", "notes": "hearの過去形はheardです。", "en": "I have never heard John sing a song.", "pron": "", "exp": "hearは「聞こえる」、「耳にする」というイメージです。"}, {"num": 3, "ja": "私たちはあなたがステージで踊るのを見たいです。", "hint": "watch", "notes": "", "en": "We want to watch you dance on the stage.", "pron": "", "exp": "watchは「じっと見る」、「見張る」というイメージです。"}, {"num": 4, "ja": "私は鳥が空を飛んでいるのを見ていました。", "hint": "look", "notes": "「知覚動詞+目的語+現在分詞（〜ing）」を使います。", "en": "I was looking at the birds flying in the sky.", "pron": "", "exp": "lookは「視線を向ける」というイメージです。lookの後ろにatを忘れずに。"}, {"num": 5, "ja": "私は子供たちが公園で遊んでいるのを見ました。", "hint": "see", "notes": "child（子供）の複数形はchildrenです。", "en": "I saw children playing in the park.", "pron": "", "exp": ""}, {"num": 6, "ja": "私は何かが腕の上で動いているのを感じました。", "hint": "feel", "notes": "feel（感じる）の過去形はfeltです。", "en": "I felt something moving on my arm.", "pron": "", "exp": "例えば、虫が腕の上で動いている状況をイメージしてください。"}, {"num": 7, "ja": "私は自分の名前が呼ばれるのが聞こえました。", "hint": "hear", "notes": "「知覚動詞+目的語+過去分詞」の形を使います。callの過去分詞を使います。", "en": "I heard my name called.", "pron": "", "exp": ""}, {"num": 8, "ja": "私は彼がしかられているのを見たことがありません。", "hint": "see", "notes": "現在完了形（経験）を使います。「しかる」はscoldです。", "en": "I have never seen him scolded.", "pron": "", "exp": ""}, {"num": 9, "ja": "私たちは男の人が警察に捕まるのを見ました。", "hint": "see", "notes": "「捕まえる」はcatchを使います。", "en": "We saw a man caught by the police.", "pron": "", "exp": "policeの前にはtheをつけましょう。"}]}, {"unit": 56, "chapter": "第2章 文法活用フレーズ編", "title": "2つのものを比べる 比較級", "book_pages": "pp. 126-127", "page": 64, "scan_image": "reader_pages/page_064.jpg", "cd_info": "CD2 11 (Track 56)", "intro": "2つのものを比べるときに使います。比較級になるのは形容詞または副詞です。", "key_title": "英会話のカギ", "key_content": "比較級を作るには、ふつう形容詞・副詞の語尾にerがつきます。young（若い）の比較級はyounger（より若い）です。文字数の多い形容詞・副詞の場合、erではなく、単語の前にmoreをつけます。goodの比較級がbetterであるように、元の形（原級）が変わってしまうものもあります。", "items": [{"num": 1, "ja": "今日は昨日より暖かいですね。", "hint": "warmer", "notes": "「昨日より」の「より」はthanを使います。", "en": "Today is warmer than yesterday.", "pron": "", "exp": ""}, {"num": 2, "ja": "デイビッドはあなたより若く見えます。", "hint": "younger", "notes": "", "en": "David looks younger than you.", "pron": "", "exp": "youの後ろにdoが省略されています。"}, {"num": 3, "ja": "君の部屋の方が彼女の部屋よりも大きいよ。", "hint": "bigger", "notes": "「彼女の（部屋）」=「彼女のもの」→ hersを使います。", "en": "Your room is bigger than hers.", "pron": "", "exp": "bigにgを重ねてerをつけます。"}, {"num": 4, "ja": "これらの花はそれらの花よりもきれいですね。", "hint": "prettier", "notes": "thisの複数形はtheseです。", "en": "These flowers are prettier than those.", "pron": "", "exp": "prettyのyをiに変えてerをつけます。thoseの後ろにはflowersが省略されています。"}, {"num": 5, "ja": "エマは私より熱心に勉強します。", "hint": "harder", "notes": "主語である「エマ」と比較するのですから「私」も主格を使いましょう。", "en": "Emma studies harder than I.", "pron": "", "exp": "Iの後ろにdoが省略されています。「私が勉強するよりエマの方が…」となります。"}, {"num": 6, "ja": "あなたは私よりずっとよく知っていますね。", "hint": "better", "notes": "比較級の強調にはmuchを使います。", "en": "You know much better than I do.", "pron": "", "exp": "「よく知っている」の「よく」はwell。betterはwellとgoodの比較級です。"}, {"num": 7, "ja": "あなたの辞書は私のよりも役に立ちます。", "hint": "more useful", "notes": "「私の（辞書）」=「私のもの」→ mineを使います。", "en": "Your dictionary is more useful than mine.", "pron": "", "exp": "usefulのような文字数の多い形容詞の前にはmoreをつけて比較級を作ります。"}, {"num": 8, "ja": "あの映画はこの映画よりも面白かったです。", "hint": "more interesting", "notes": "", "en": "That movie was more interesting than this one.", "pron": "", "exp": "oneはmovieを表します。"}, {"num": 9, "ja": "数学は他のどの教科よりも難しいです。", "hint": "more difficult", "notes": "「教科」はsubjectです。", "en": "Math is more difficult than any other subject.", "pron": "", "exp": "any other（他のどの）の後ろは単数形の名詞です。"}]}, {"unit": 57, "chapter": "第2章 文法活用フレーズ編", "title": "「最も」「同じくらい」 最上級・同等比較", "book_pages": "pp. 128-129", "page": 65, "scan_image": "reader_pages/page_065.jpg", "cd_info": "CD2 12 (Track 57)", "intro": "最上級は「一番〜」、「最も〜」と言いたいときに使います。同等比較は「同じくらい〜」と言う場合に使います。", "key_title": "英会話のカギ", "key_content": "最上級は形容詞または副詞の語尾にestをつけます。例えば、long（長い）の最上級はlongest（一番長い）です。文字数の多い単語には前にmostをつけます。形容詞の場合は通常、前にtheが必要です。同等比較は「as+原級+as」の形を取ります。", "items": [{"num": 1, "ja": "富士山は日本で一番高い山です。", "hint": "the highest", "notes": "highの最上級はhighestです。", "en": "Mt. Fuji is the highest mountain in Japan.", "pron": "", "exp": "highestの前にtheを忘れないようにしましょう。"}, {"num": 2, "ja": "平野さんは私たちの会社で一番忙しい人です。", "hint": "the busiest", "notes": "", "en": "Mr. Hirano is the busiest man in our company.", "pron": "", "exp": "busyはyをiに変えてestをつけます。"}, {"num": 3, "ja": "私は3人の中で一番若いです。", "hint": "the youngest", "notes": "「3人」はthe threeだけでOK。", "en": "I'm the youngest of the three.", "pron": "", "exp": "「3人の中で」のように他の人と比較する場合はinではなくofを使います。"}, {"num": 4, "ja": "彼女はアメリカで一番人気がある歌手です。", "hint": "the most popular", "notes": "", "en": "She is the most popular singer in America.", "pron": "", "exp": "popularのような文字数の多い単語の最上級は、前にmostをつけます。"}, {"num": 5, "ja": "これはこの店で一番高いカメラです。", "hint": "the most expensive", "notes": "", "en": "This is the most expensive camera in this shop.", "pron": "", "exp": ""}, {"num": 6, "ja": "トモコは私たちのクラスの中で一番速く走ります。", "hint": "fastest", "notes": "この場合fast（速く）は動詞（run）を修飾する副詞なのでtheはなくてもOKです。", "en": "Tomoko runs fastest in our class.", "pron": "", "exp": "fastには「速い」という形容詞もあります。earlyは時間的に「早い」、「早く」です。"}, {"num": 7, "ja": "ジャックはあなたと同じ年齢です。", "hint": "as 〜 as", "notes": "as 〜 asは「同じくらい〜」です。", "en": "Jack is as old as you.", "pron": "", "exp": "asとasの間に形容詞を入れる場合は原級（もとの形）を使います。"}, {"num": 8, "ja": "この質問は私が思ったほど簡単ではありません。", "hint": "as 〜 as", "notes": "「私が思ったのと同じくらい簡単ではない」ということです。", "en": "This question is not as easy as I thought.", "pron": "", "exp": ""}, {"num": 9, "ja": "ヒサシは私の2倍の本を持っています。", "hint": "as 〜 as", "notes": "asとasの間には「形容詞+名詞」が来る場合もあります。", "en": "Hisashi has twice as many books as I do.", "pron": "", "exp": "twice（2倍）、three times（3倍）と言う場合には比較級ではなくas 〜 asを使います。"}]}, {"unit": 58, "chapter": "第2章 文法活用フレーズ編", "title": "「もし〜なら」 仮定法", "book_pages": "pp. 130-131", "page": 66, "scan_image": "reader_pages/page_066.jpg", "cd_info": "CD2 13 (Track 58)", "intro": "仮定法は「（私はあなたではないが）もし私があなたなら」という「事実とは異なることを仮定する」ときに使います。", "key_title": "英会話のカギ", "key_content": "仮定法は主にif（もし〜なら）やI wish（〜であればなぁ）を使います。現在の事実と異なることを仮定する場合（仮定法過去）は過去形を、過去の事実と異なることを仮定する場合（仮定法過去完了）は過去完了形（had+過去分詞）を用います。", "items": [{"num": 1, "ja": "もし私があなたなら、歯医者さんに診てもらいますよ。", "hint": "If 〜", "notes": "if節の動詞にはwereを、主節は助動詞の過去形のwouldを使います。", "en": "If I were you, I would go to see a dentist.", "pron": "", "exp": "主語が何であってもbe動詞の過去形にはwereを使います。"}, {"num": 2, "ja": "もしあなたがそうしてくださるなら、感謝いたします。", "hint": "if 〜", "notes": "「もしあなたができるのなら」→ if節にはcan（できる）の過去形を使います。", "en": "I would appreciate it if you could.", "pron": "", "exp": "appreciateの後ろにitを忘れないようにしましょう。itはif以下を指します。"}, {"num": 3, "ja": "私に兄がいたらなあ。", "hint": "I wish 〜", "notes": "I wish 〜. は「〜ならなぁ」という意味です。動詞はhaveの過去形を使います。", "en": "I wish I had a brother.", "pron": "", "exp": "実際には兄はいないのですから、現在の事実と違うことの仮定です。"}, {"num": 4, "ja": "もしジェニーの電話番号を知っていたなら、彼女に電話していたのに。", "hint": "If 〜", "notes": "if節はhad known（過去完了）、主節は「would have + 過去分詞」にします。", "en": "If I had known Jennie's phone number, I would have called her.", "pron": "", "exp": "「（実際には知らなかったけれども）知っていたなら」→ 過去の事実と違うことの仮定。"}, {"num": 5, "ja": "もし家族がいなかったら、生きていけません。", "hint": "If it weren't for 〜", "notes": "「生きていく」はgo onを使ってみましょう。", "en": "If it weren't for my family, I couldn't go on.", "pron": "", "exp": "If it weren't for 〜は「もし〜がないなら」という決まり文句です。"}, {"num": 6, "ja": "もしあなたの助けがなかったなら、私たちは成功しなかったでしょうに。", "hint": "If it hadn't been for 〜", "notes": "過去の事実と異なることの仮定なので、主節は「couldn't have + 過去分詞」です。", "en": "If it hadn't been for your help, we couldn't have succeeded.", "pron": "", "exp": "If it hadn't been for 〜は「もし〜がなかったなら」という意味です。"}, {"num": 7, "ja": "仮に海外へ行くようなことがあれば、とても多くのことを経験することでしょう。", "hint": "If you were to 〜", "notes": "主節は助動詞の過去形を使います。「経験する」はexperienceです。", "en": "If you were to go abroad, you would experience so many things.", "pron": "", "exp": "were toは将来起こりそうもないことの仮定（仮定法未来）に使います。"}]}, {"unit": 59, "chapter": "第2章 文法活用フレーズ編", "title": "2つの文をつなぐ 関係代名詞", "book_pages": "pp. 132-133", "page": 67, "scan_image": "reader_pages/page_067.jpg", "cd_info": "CD2 14 (Track 59)", "intro": "関係代名詞は2つの文をつなぐ接着剤のような働きをします。名詞の後ろに置き、その名詞を説明します。", "key_title": "英会話のカギ", "key_content": "説明される語（先行詞）が「人」であればwho（主格）、whose（所有格）、whom（目的格）を使い、「人以外」であればwhich（主格）、whose（所有格）、which（目的格）を使います。thatをwhoとwhichの代わりに使うこともできます。", "items": [{"num": 1, "ja": "私にはシカゴに住んでいる友だちがいます。", "hint": "who [that]", "notes": "まず「私には友だちがいる」と言い、どういう友だちかを後ろで説明します。", "en": "I have a friend who [that] lives in Chicago.", "pron": "", "exp": "先行詞はfriendで、後ろの動詞liveの主語に当たるのでwho（主格）を使います。"}, {"num": 2, "ja": "私は息子さんが有名なピアニストである人を知っています。", "hint": "whose", "notes": "まず「私はある人を知っている」と言い、その後その人について説明します。", "en": "I know a man whose son is a famous pianist.", "pron": "", "exp": "先行詞manの息子（son）ですから「〜の」というwhose（所有格）を使います。"}, {"num": 3, "ja": "あの人は私がパーティーで会った女性です。", "hint": "(that)", "notes": "英会話ではwhomはほとんど使われず、目的格のthatも省略されることが多いです。", "en": "That is the woman (that) I saw at the party.", "pron": "", "exp": "先行詞womanは後ろの動詞sawの目的語に当たるので目的格を使います。"}, {"num": 4, "ja": "ちょうど到着した飛行機はロンドンから来ました。", "hint": "which [that]", "notes": "先行詞planeは「人以外」なので、使用する関係代名詞に注意しましょう。", "en": "The plane which [that] has just arrived came from London.", "pron": "", "exp": "先行詞planeは後ろの動詞arriveの主語に当たるので、which（主格）を使います。"}, {"num": 5, "ja": "これはマスミが好きな花です。", "hint": "which (that)", "notes": "", "en": "This is the flower (which / that) Masumi likes.", "pron": "", "exp": "目的格のwhichやthatは英会話ではたいてい省略されます。"}, {"num": 6, "ja": "あなたが手に持っているものを見せてください。", "hint": "what", "notes": "what（もの）に続けて「あなたが手に持っている」と言います。", "en": "Let me see what you have in your hand.", "pron": "", "exp": "whatは「〜するもの（こと）」という意味で使い、先行詞は不要です。"}, {"num": 7, "ja": "あなたのおっしゃっていることは理解できます。", "hint": "what", "notes": "", "en": "I understand what you are saying.", "pron": "", "exp": ""}]}, {"unit": 60, "chapter": "第2章 文法活用フレーズ編", "title": "「場所」「時」でつなぐ 関係副詞", "book_pages": "pp. 134-135", "page": 68, "scan_image": "reader_pages/page_068.jpg", "cd_info": "CD2 15 (Track 60)", "intro": "関係副詞も関係代名詞と同じように、前の名詞を説明するために使う接着剤です。関係代名詞との用法の違いに注意！", "key_title": "英会話のカギ", "key_content": "ここでは「場所」と「時」を表す関係副詞を使ってみましょう。先行詞が場所を表す語であればwhereを使い、時を表す語であればwhenを使います。関係副詞の後ろは必ず「主語+動詞」が続きます。関係代名詞のwhichと間違いやすいので注意しましょう。", "items": [{"num": 1, "ja": "ここは私が勉強する部屋です。", "hint": "where", "notes": "どんな部屋かを後ろで説明します。", "en": "This is the room where I study.", "pron": "", "exp": "先行詞roomはstudyの目的語には当たらないのでwhichは使えません。"}, {"num": 2, "ja": "眺めがいい場所に行きましょう。", "hint": "where", "notes": "「眺め」はviewを使いましょう。", "en": "Let's go to a place where we can see a nice view.", "pron": "", "exp": "「場所を見る」ではなく「その場所で見る」。seeの目的語はplaceではなくviewです。"}, {"num": 3, "ja": "福岡は彼女が20年前に生まれた街です。", "hint": "where", "notes": "「その街で〜した」という場所を説明します。", "en": "Fukuoka is the city where she was born twenty years ago.", "pron": "", "exp": "先行詞cityは後ろの動詞was bornの目的語にはならないので、whereを用います。"}, {"num": 4, "ja": "あれが私がジェームズに初めて会った喫茶店です。", "hint": "where", "notes": "", "en": "That is the coffee shop where I met James for the first time.", "pron": "", "exp": "先行詞the coffee shopはmetの目的語ではないので、which（目的格）は使えません。"}, {"num": 5, "ja": "日曜日は彼らが教会に行く日です。", "hint": "when", "notes": "日曜日がどんな日かを後ろで説明します。", "en": "Sunday is the day when they go to church.", "pron": "", "exp": "先行詞dayは「時」を表す名詞ですから、「時」を表す関係副詞whenを使います。"}, {"num": 6, "ja": "夏は私たちがお祭りを楽しむ季節です。", "hint": "when", "notes": "", "en": "Summer is the season when we can enjoy festivals.", "pron": "", "exp": "seasonは後ろの動詞enjoyの目的語ではないので、which（目的格）は使えません。"}, {"num": 7, "ja": "4月は日本で新しい学年が始まる月です。", "hint": "when", "notes": "「学年」はschool yearです。", "en": "April is the month when the new school year starts in Japan.", "pron": "", "exp": "「その月を〜する」ではなく「その月に〜する」という「時」を表しています。"}]}, {"unit": 61, "chapter": "第3章 日常会話フレーズ編", "title": "家族との朝の会話", "book_pages": "pp. 138-139", "page": 70, "scan_image": "reader_pages/page_070.jpg", "cd_info": "CD2 16 (Track 61)", "intro": "朝、家族で交わすフレーズを練習してみましょう。「学校に遅れるよ」「とても眠い」「車で送って」などはそのまま使えます。", "key_title": "英会話のカギ", "key_content": "go off（目覚ましが鳴る）、hurry up（急ぐ）、brush my teeth（歯を磨く）、sleepy（眠い）など朝によくある出来事や動作を中心に覚えておきましょう。「行ってきます」、「行ってらっしゃい」は英語ではお互いにHave a nice day.とかBye.と言います。「ただいま」はI'm home.とも言えますがHi!でOKです。", "items": [{"num": 1, "ja": "急がないと学校に遅れるよ。", "hint": "hurry up 〜", "notes": "命令文で始めましょう。", "en": "Hurry up, or you'll be late for school.", "pron": "", "exp": "命令文の後ろにorを使うと「〜しなさい。そうしないと…」となります。"}, {"num": 2, "ja": "目覚ましが鳴らなかったよ。", "hint": "go off", "notes": "「目覚ましが鳴る」はgo offです。didn'tを使って過去形の否定文にします。", "en": "My alarm didn't go off.", "pron": "", "exp": "「目覚まし（時計）」はalarm (clock)です。"}, {"num": 3, "ja": "とても眠い。", "hint": "sleepy", "notes": "", "en": "I'm so sleepy.", "pron": "", "exp": "sleepyは「眠たい」、asleepは「眠っている」という形容詞です。"}, {"num": 4, "ja": "夕べは寝るのが遅すぎた。", "hint": "go to bed", "notes": "「〜すぎる」はtoo 〜を使います。goの過去形を使いましょう。", "en": "I went to bed too late last night.", "pron": "", "exp": "go to bedは「床につく」、go to sleepは「眠りにつく」です。"}, {"num": 5, "ja": "歯は磨いた？", "hint": "brush", "notes": "brushは「ブラシ」という名詞以外に「磨く」という動詞もあります。", "en": "Did you brush your teeth?", "pron": "", "exp": "「歯」の単数形はtooth、複数形はteethです。"}, {"num": 6, "ja": "歯磨きがなくなってきているよ。", "hint": "run out", "notes": "現在進行形を使います。", "en": "We are running out of toothpaste.", "pron": "", "exp": "run out (of 〜)で「(〜が)なくなる」という意味です。"}, {"num": 7, "ja": "駅まで車で送ってくれない？", "hint": "drive", "notes": "driveは「運転する」以外に「車で送る」という意味でも使います。", "en": "Can you drive me to the train station?", "pron": "", "exp": "train stationは電車の駅、バスターミナルはbus station、地下鉄の駅はsubway station。"}, {"num": 8, "ja": "帰る途中、車で拾ってくれない？", "hint": "pick 〜 up", "notes": "Could you 〜?を使って丁寧に頼んでみましょう。", "en": "Could you pick me up on your way home?", "pron": "", "exp": "「車で拾う」はpick 〜 up、「車から降ろす」はdrop 〜 offと言います。"}, {"num": 9, "ja": "行ってらっしゃい。", "hint": "a nice day", "notes": "動詞の原形で始めて命令文にします。", "en": "Have a nice day.", "pron": "", "exp": "こう言われたらYou too.と返しましょう。"}]}, {"unit": 62, "chapter": "第3章 日常会話フレーズ編", "title": "家族との夜の会話", "book_pages": "pp. 140-141", "page": 71, "scan_image": "reader_pages/page_071.jpg", "cd_info": "CD2 17 (Track 62)", "intro": "夜は一日の出来事を話すなどして、家族団らんの時間を過ごします。リビングやダイニングで交わす会話を練習しましょう。", "key_title": "英会話のカギ", "key_content": "夜はリラックスタイム。朝のあわただしい様子を表す表現とは違って、その日の出来事や明日の予定などについての表現が中心です。例えば「〜はどうだった？」は疑問詞howを使ってHow was 〜 ?でOK。「外食する」はeat out。単純に「外で食べる」と言えばいいのです。", "items": [{"num": 1, "ja": "学校はどうだった？", "hint": "How was 〜 ?", "notes": "", "en": "How was school?", "pron": "", "exp": "「今日はどんな日だった？」はHow was your day? です。"}, {"num": 2, "ja": "夕食ができたよ。", "hint": "ready", "notes": "", "en": "Dinner is ready.", "pron": "", "exp": "readyは準備できている状態を表します。"}, {"num": 3, "ja": "今日の夕食は何？", "hint": "What are we going to 〜 ?", "notes": "「夕食用に何を食べるか」と聞きます。", "en": "What are we going to have for dinner?", "pron": "", "exp": "be going to 〜は予定を表します。for 〜は「〜用に」と考えます。"}, {"num": 4, "ja": "今日のテストはどうだった？", "hint": "How did you do 〜 ?", "notes": "「テスト」はtest、またはexam(ination)です。", "en": "How did you do in today's exam?", "pron": "", "exp": "How did the test go? とも言えます。"}, {"num": 5, "ja": "今テレビでは何をやってるの？", "hint": "What 〜 ?", "notes": "疑問詞whatを主語として使います。", "en": "What's on now?", "pron": "", "exp": "テレビに関してはWhat's on?、「どんな映画をやってるの？」はWhat's playing? です。"}, {"num": 6, "ja": "テレビを見る前に宿題を終わらせなさい。", "hint": "Finish 〜", "notes": "「宿題」はhomeworkです。", "en": "Finish your homework before you watch TV.", "pron": "", "exp": "homeworkは数えられないのでaや複数形のsをつけないように。"}, {"num": 7, "ja": "そろそろ寝る時間だよ。", "hint": "It's time 〜", "notes": "「そろそろ」にはalmostを使ってみましょう。", "en": "It's almost time for you to go to bed.", "pron": "", "exp": "to不定詞の形容詞的用法（寝るべき時間）を使います（UNIT 49を参照）。"}, {"num": 8, "ja": "明日の計画はどうなっているの？", "hint": "What 〜 ?", "notes": "「明日用の計画」と考えます。「〜用の」はfor 〜です。", "en": "What are your plans for tomorrow?", "pron": "", "exp": "「計画はどうなっているの？」は単純に「計画は何？」と言います。"}, {"num": 9, "ja": "今夜は外に食べに行くかい？", "hint": "eat out", "notes": "「〜したい」のwould like to 〜を使います。「外食する」はeat outです。", "en": "Would you like to eat out tonight?", "pron": "", "exp": "Would you like to 〜?はDo you want to 〜?の丁寧な言い方です。"}]}, {"unit": 63, "chapter": "第3章 日常会話フレーズ編", "title": "家事をする", "book_pages": "pp. 142-143", "page": 72, "scan_image": "reader_pages/page_072.jpg", "cd_info": "CD2 18 (Track 63)", "intro": "アメリカなどでは夫婦共働きが普通です。男女ともに家事は必須。doやmakeなど基本動詞が活躍します。", "key_title": "英会話のカギ", "key_content": "家事は私たちにとって欠かすことのできない活動です。まずは身近な表現から学びましょう。do the dishes（皿を洗う）、do the laundry（洗濯する）、do the ironing（アイロンをかける）のように、doのような簡単な動詞を使っていろいろなことが言えます。", "items": [{"num": 1, "ja": "ベッドは自分できれいにしてね。", "hint": "make", "notes": "「ベッドをきれいにする」は「ベッドを作る」と言います。", "en": "You should make your own bed.", "pron": "", "exp": "your own 〜は「あなた自身の〜」という意味です。"}, {"num": 2, "ja": "エアコンの修理をするよ。", "hint": "fix", "notes": "申し出る表現のLet me 〜. を使ってみましょう。", "en": "Let me fix the air conditioning.", "pron": "", "exp": "「エアコン」はair conditioning、またはair conditionerです。"}, {"num": 3, "ja": "猫にエサをあげたほうがいいよ。", "hint": "feed", "notes": "「提案」のshouldを使います。", "en": "You should feed the cats.", "pron": "", "exp": "feedはfoodの動詞形で「食べ物を与える」という意味です。"}, {"num": 4, "ja": "もうすぐミルクを買わないといけないよ。", "hint": "buy", "notes": "「強制」のhave to 〜を使いましょう。", "en": "We have to buy some more milk soon.", "pron": "", "exp": "some more 〜は「もう少しの〜」という意味です。"}, {"num": 5, "ja": "買い物リストを作ろうよ。", "hint": "make", "notes": "誘う表現のLet'sを使います。", "en": "Let's make a shopping list.", "pron": "", "exp": "make aは2語つないで［メイカ］のように発音しましょう。"}, {"num": 6, "ja": "洗濯するのを忘れていた！", "hint": "do", "notes": "laundry（洗濯物）を使います。", "en": "I forgot to do the laundry!", "pron": "", "exp": "「forget + 〜 ing形」は「〜したこと（過去の行動）を忘れる」という意味になります。"}, {"num": 7, "ja": "花に水をやってくれない？", "hint": "water", "notes": "頼む表現のCan you 〜? を使いましょう。", "en": "Can you water the flowers, please?", "pron": "", "exp": "waterは動詞で「水をやる」という意味があります。"}, {"num": 8, "ja": "冷蔵庫には食べ物があまり残ってないよ。", "hint": "There's 〜", "notes": "there is構文の否定形です。", "en": "There's not much food left in the refrigerator.", "pron": "", "exp": "foodは数えられない名詞なのでmanyではなくmuchを使います。"}, {"num": 9, "ja": "キッチンを掃除してくれない？", "hint": "clean", "notes": "丁寧に頼む表現Would you mind 〜? を使ってみましょう。", "en": "Would you mind cleaning the kitchen?", "pron": "", "exp": "mindの後ろは動名詞（〜 ing形）です。"}]}, {"unit": 64, "chapter": "第3章 日常会話フレーズ編", "title": "パーソナルな電話をする", "book_pages": "pp. 144-145", "page": 73, "scan_image": "reader_pages/page_073.jpg", "cd_info": "CD2 19 (Track 64)", "intro": "英語で電話をかけたり受けたりするのは、なかなかハードルが高いです。「慣れ」が大切で、まず決まり文句をマスターしましょう。", "key_title": "英会話のカギ", "key_content": "電話の会話は相手の表情が見えないのでなかなかたいへんだと言われますが、覚えやすい決まり文句もいくつかあります。難しい単語はほとんど使いません。状況に合わせた言い方をいくつか覚えておきましょう。受話器から聞こえてくる英語だと思ってリスニングしてみましょう。", "items": [{"num": 1, "ja": "もしもし。オリビアはいますか。", "hint": "May I 〜 ?", "notes": "「〜してもいいですか」という許可を求める表現May I 〜?を使います。", "en": "Hello. May I speak to Olivia, please?", "pron": "", "exp": "May I speak to 〜?は「〜さんはいらっしゃいますか」という定番の表現です。"}, {"num": 2, "ja": "もしもし。スティーブはいますか。", "hint": "Is 〜 there?", "notes": "「〜はそこにいますか」ということなので存在を表すbe動詞を使います。", "en": "Hello. Is Steve there?", "pron": "", "exp": "「〜はそこにいますか」ということなので存在を表すbe動詞を使います。"}, {"num": 3, "ja": "もしもし。ポーターさんですか。", "hint": "Is this 〜 ?", "notes": "", "en": "Hello. Is this Mrs. Porter?", "pron": "", "exp": "「〜さんですか」と電話で聞くときはAre you 〜?ではなくIs this 〜?です。"}, {"num": 4, "ja": "もしもし。マサヨシですが。", "hint": "This is 〜 speaking.", "notes": "", "en": "Hello. This is Masayoshi speaking.", "pron": "", "exp": "自分にもI am 〜. ではなくThis is 〜. を使います。"}, {"num": 5, "ja": "少々お待ちください。", "hint": "Just a 〜", "notes": "「ほんの1分」と言います。", "en": "Just a minute, please.", "pron": "", "exp": "Just a second. とかJust a moment. とも言います。"}, {"num": 6, "ja": "どちらさまですか。", "hint": "May I 〜 ?", "notes": "「誰が電話をかけているのか尋ねてもいいですか」と言います。", "en": "May I ask who's calling?", "pron": "", "exp": "who'sはwho isの短縮形です。"}, {"num": 7, "ja": "間違い電話だと思いますが。", "hint": "wrong number", "notes": "「間違い番号（wrong number）を持つ」と考えます。", "en": "I think you have the wrong number.", "pron": "", "exp": "I thinkを使えば、言い方が少し和らぎ、丁寧に聞こえます。"}, {"num": 8, "ja": "こんなに遅い時間に電話をかけてすみません。", "hint": "I'm sorry 〜", "notes": "「こんなに遅い時間に」はthis lateを使ってみましょう。", "en": "I'm sorry to call you this late.", "pron": "", "exp": "お詫び表現のI'm sorry to 〜.（〜してすみません）を使います。"}, {"num": 9, "ja": "10分くらいしてかけ直してくれない？", "hint": "call 〜 back", "notes": "時間の経過を表す「〜くらいして」はin 〜です。", "en": "Can you call me back in about ten minutes?", "pron": "", "exp": "call 〜 backは「(電話を)〜にかけ直す」という意味です。"}]}, {"unit": 65, "chapter": "第3章 日常会話フレーズ編", "title": "オフィスで電話をかける", "book_pages": "pp. 146-147", "page": 74, "scan_image": "reader_pages/page_074.jpg", "cd_info": "CD2 20 (Track 65)", "intro": "ビジネスで電話をかけるときも決まった言い方があります。お決まりフレーズを覚えておけば、スムーズに本題に入れます。", "key_title": "英会話のカギ", "key_content": "ビジネスで電話をかけるのはけっこう気をつかうもの。でも、英語では「貴社」と「弊社」の使い分けや自分の上司に「〜さん」をつけないことなど、日本語ほど気をつかわなくて大丈夫です。自分を名乗るときは名前の後に会社名を言いましょう。個人の電話の会話と共通した表現もたくさんあります。", "items": [{"num": 1, "ja": "もしもし。SFC銀行の坂本ですが。", "hint": "This is 〜", "notes": "電話をかけて英語で自分を名乗るときは名前の後に会社名を言います。", "en": "Hello. This is Sakamoto of SFC Bank.", "pron": "", "exp": "ビジネスシーンで、相手とそこまで親しくない場合は名字を使います。"}, {"num": 2, "ja": "もしもし。コネリーさんは今日ご出勤でしょうか。", "hint": "Is 〜 in?", "notes": "Mr. やMs. は名字の前につけます。", "en": "Hello. Is Mr. Connelly in today?", "pron": "", "exp": "「出勤している」はinで表します。"}, {"num": 3, "ja": "伝言をお願いしてもよろしいでしょうか。", "hint": "leave a message", "notes": "伝言を「置いて行く（leave）」と考えます。", "en": "Can I leave a message?", "pron": "", "exp": "許可を求めるCan I 〜?を使います。"}, {"num": 4, "ja": "企画課につないでもらえませんか。", "hint": "connect", "notes": "頼む表現のCould you 〜?を使ってみましょう。", "en": "Could you connect me with someone in the Planning Division?", "pron": "", "exp": "「電話をつなぐ」はconnectです。put 〜 through toも使えます（UNIT 66の8を参照）。"}, {"num": 5, "ja": "折り返しお電話差し上げております。", "hint": "return your call", "notes": "「あなたからの電話を返す」と考えます。", "en": "I'm returning your call.", "pron": "", "exp": "自分が不在だったときに電話がかかり、「今かけ直している」という意味です。"}, {"num": 6, "ja": "私から電話があったことを彼女にお伝えくださいませんか。", "hint": "Could you just tell 〜 ?", "notes": "tellの後ろには「人」が入ります。", "en": "Could you just tell her that I called?", "pron": "", "exp": "Could you 〜?はCan you 〜?よりも丁寧な頼み方です。"}, {"num": 7, "ja": "30分前にお電話差し上げましたが、話し中でした。", "hint": "busy", "notes": "", "en": "I called you thirty minutes ago, but the line was busy.", "pron": "", "exp": "「話し中です」はThe line is busy.と言います。"}, {"num": 8, "ja": "今お時間は大丈夫ですか。", "hint": "talk with", "notes": "話す時間があるかどうかを聞きます。to不定詞の形容詞的用法を使います。", "en": "Do you have time to talk with me now?", "pron": "", "exp": "「〜がありますか」は基本動詞haveを使います。"}, {"num": 9, "ja": "いつでもお気軽にお電話ください。", "hint": "feel free to 〜", "notes": "「いつでも」はanytimeです。", "en": "Please feel free to call me anytime.", "pron": "", "exp": "feel free to 〜は「気軽に〜する」という意味です。"}]}, {"unit": 66, "chapter": "第3章 日常会話フレーズ編", "title": "オフィスで電話を受ける", "book_pages": "pp. 148-149", "page": 75, "scan_image": "reader_pages/page_075.jpg", "cd_info": "CD2 21 (Track 66)", "intro": "電話で仕事の話が終わった後は、お礼に続いてHave a nice day. など、相手に対する思いやりのひと言をつけ足します。", "key_title": "英会話のカギ", "key_content": "英語で電話を受けるときは話す内容が相手によってさまざまなので、何をどう聞いてくるのか不安ですよね。しかし、ポイントの表現を覚えておくだけで、聞き取りにも慣れますし、会話もスムーズになります。電話をかけるときは自分の名前を先に言いましたが、電話を受けるときには会社の名前を先に言います。", "items": [{"num": 1, "ja": "おはようございます。東名旅行、斎藤宏が承ります。", "hint": "This is 〜 speaking.", "notes": "電話を受けるときは、まず会社の名前を言ってから自分の名前を言いましょう。", "en": "Good Morning. Tomei Travel. This is Hiroshi Saito speaking. How may I help you?", "pron": "", "exp": ""}, {"num": 2, "ja": "彼は今日は休暇で休んでおります。", "hint": "on leave", "notes": "「休暇」はleaveです。", "en": "He's on leave today.", "pron": "", "exp": "on leaveで「休暇中」という意味です。He'sはHe isの短縮形です。"}, {"num": 3, "ja": "彼女はちょっと席を外しております。", "hint": "step out", "notes": "現在完了形を使います。", "en": "She's just stepped out.", "pron": "", "exp": "She'sはShe hasの短縮形です。She is not here right now. でもOKです。"}, {"num": 4, "ja": "ご伝言をお預かりいたしましょうか。", "hint": "take a message", "notes": "「外から自分の領域に入れる」というイメージの基本動詞takeを使います。", "en": "Can I take a message?", "pron": "", "exp": "伝言を残すときはCan I leave a message?でしたね（UNIT 65の3を参照）。"}, {"num": 5, "ja": "スーザンさん、林さんからお電話です。", "hint": "on the phone", "notes": "「林さんが電話上にいる」というイメージなのでonを使います。", "en": "Susan, Mr. Hayashi is on the phone.", "pron": "", "exp": ""}, {"num": 6, "ja": "彼女はいま別の電話に出ています。", "hint": "on another line", "notes": "phone（電話）ではなくline（回線）を使います。", "en": "She is on another line.", "pron": "", "exp": ""}, {"num": 7, "ja": "彼はおそらく30分くらいしたら戻ると思います。", "hint": "will be back", "notes": "「おそらく」はprobablyを使いましょう。", "en": "He will probably be back in about thirty minutes.", "pron": "", "exp": "「30分したら」のように未来のことを言う場合はin 〜を使います。"}, {"num": 8, "ja": "上司におつなぎします。", "hint": "put 〜 through", "notes": "「あなたを〜に（電話線上で）通してあげる」というイメージです。", "en": "I'll put you through to my supervisor.", "pron": "", "exp": "I'llの代わりに、申し出る表現のLet meを使ってもOKです。"}, {"num": 9, "ja": "彼が戻り次第、電話をかけさせましょうか。", "hint": "have 〜 call", "notes": "申し出る表現のShall I 〜?を使います。「〜次第」はas soon as 〜です。", "en": "Shall I have him call you as soon as he comes back?", "pron": "", "exp": "「使役動詞have + 人 + 動詞の原形」の形で「(人)に〜させる」です（UNIT 54参照）。"}]}, {"unit": 67, "chapter": "第3章 日常会話フレーズ編", "title": "予約する・約束する", "book_pages": "pp. 150-151", "page": 76, "scan_image": "reader_pages/page_076.jpg", "cd_info": "CD2 22 (Track 67)", "intro": "予約のキーワードはreserve/reservationやappointmentなど限られています。キーワードを上手に使って話しましょう。", "key_title": "英会話のカギ", "key_content": "英語では飛行機の座席、レストランのテーブル、コンサートのチケットをおさえるための予約をreservation、医者や美容師（美容院）など、人に会うための予約をappointmentと言います。場面によって使い分けましょう。「予約をする」という動詞はmake、「予約してある」という状態を表すときはhaveを使います。", "items": [{"num": 1, "ja": "予約はなさっていますでしょうか、お客様。", "hint": "reservation", "notes": "ホテルのフロントでの会話をイメージしてください。", "en": "Do you have a reservation, sir?", "pron": "", "exp": "「予約してある」はhaveを使います。敬称は男性にはsir、女性にはma'amを使います。"}, {"num": 2, "ja": "土曜日の夜に予約を取りたいのですが。", "hint": "reservation", "notes": "レストランに電話している様子をイメージしてください。", "en": "I'd like to make a reservation for this Saturday night.", "pron": "", "exp": "「予約する」はmakeを使います。"}, {"num": 3, "ja": "窓側のテーブルがいいのですが。", "hint": "I'd like 〜", "notes": "I'd likeはI wantの丁寧な言い方です。", "en": "I'd like a table by the window.", "pron": "", "exp": "by 〜は「〜のそばの」という意味です。"}, {"num": 4, "ja": "明日の夜、テーブルは空いてますか。", "hint": "available", "notes": "「明日の夜用に」と考え、for 〜を使います。", "en": "Do you have a table available for tomorrow night?", "pron": "", "exp": "availableは「空いている」、「利用できる」という意味です。"}, {"num": 5, "ja": "2時半に予約を取っているのですが。", "hint": "appointment", "notes": "歯医者さんをイメージしてください。", "en": "I have a two-thirty appointment.", "pron": "", "exp": "two-thirtyは「2時半の」です。"}, {"num": 6, "ja": "1時にジョーンズさんに  air mail?", "pron": "", "exp": ""}, {"num": 4, "ja": "10セント切手を5枚ください。", "hint": "Can I 〜 ?", "notes": "", "en": "Can I have five ten-cent stamps, please?", "pron": "", "exp": "「10セントの〜」など後ろの名詞を修飾する場合は、centに複数形のsはつけません。"}, {"num": 5, "ja": "本の割引レートで送りたいのですが。", "hint": "I'd like to 〜", "notes": "「本の割引レート」のことをbook rateと言います。", "en": "I'd like to send it at the book rate.", "pron": "", "exp": ""}, {"num": 6, "ja": "普通預金口座を開設したいのですが。", "hint": "I'd like to 〜", "notes": "「開設する」はopenでOKです。", "en": "I'd like to open a savings account.", "pron": "", "exp": "savings accountは「普通預金口座」。savingsの語尾のsを忘れないように。"}, {"num": 7, "ja": "この小切手を現金にしたいのですが。", "hint": "I'd like to 〜", "notes": "", "en": "I'd like to cash this check, please.", "pron": "", "exp": "cashには「現金」という名詞と「現金にする」という動詞があります。"}, {"num": 8, "ja": "紙幣の種類はどうなさいますか。", "hint": "How 〜 ?", "notes": "「お金はどういうふうに欲しいですか」と聞きます。", "en": "How would you like your money?", "pron": "", "exp": "What denominations would you like? でもOK。denominationは「お金の種類」です。"}, {"num": 9, "ja": "日本円の為替レートはいくらですか。", "hint": "What 〜 ?", "notes": "", "en": "What's the exchange rate for Japanese yen?", "pron": "", "exp": "What'sはWhat isの短縮形。exchange rateは「為替レート」です。"}]}, {"unit": 73, "chapter": "第3章 日常会話フレーズ編", "title": "バス・電車に乗る", "book_pages": "pp. 162-163", "page": 82, "scan_image": "reader_pages/page_082.jpg", "cd_info": "CD2 28 (Track 73)", "intro": "「行き先」「運賃」「乗り換え」など聞くことは決まっています。基本表現をしっかり練習すれば、交通機関が使いこなせます。", "key_title": "英会話のカギ", "key_content": "海外で公共交通機関を利用するときは、けっこう勇気がいるものです。行き先や運賃、乗り換えや支払い方法に関する英語表現を覚えておくと不安もある程度解消されます。I'd like to 〜.（〜したいのですが）やCould you tell me 〜 ?（〜を教えてもらえませんか）などの基本表現を使えるようになりましょう。", "items": [{"num": 1, "ja": "このバスは街の方まで行きますか。", "hint": "Does this bus 〜 ?", "notes": "", "en": "Does this bus go downtown?", "pron": "", "exp": "downtownは「繁華街へ」という副詞なので、goの後ろにtoは要りません。"}, {"num": 2, "ja": "ここからグレンパーク駅までの運賃はいくらですか。", "hint": "How much 〜 ?", "notes": "「運賃」はfareです。", "en": "How much is the fare from here to Glen Park Station?", "pron": "", "exp": ""}, {"num": 3, "ja": "すみません。降ります。", "hint": "I'd like to 〜", "notes": "「降りたいです」と言います。", "en": "Excuse me. I'd like to get off.", "pron": "", "exp": "バスや電車から「降りる」はget off、「乗る」はget onです。"}, {"num": 4, "ja": "降りるときに教えてもらえませんか。", "hint": "Could you 〜 ?", "notes": "", "en": "Could you tell me when to get off?", "pron": "", "exp": "「降りる停留所に着いたときに教えてほしい」とバスの運転手に伝える表現です。"}, {"num": 5, "ja": "終電に乗り遅れました。", "hint": "miss", "notes": "", "en": "I missed the last train.", "pron": "", "exp": "「始発の電車」はthe first trainです。"}, {"num": 6, "ja": "電車を乗り間違えました。", "hint": "wrong train", "notes": "「間違った電車に乗った」と言います。", "en": "I took the wrong train.", "pron": "", "exp": "「(電車に)乗る」はtakeやcatchを使います。"}, {"num": 7, "ja": "新宿駅で電車を乗り換えないといけません。", "hint": "have to", "notes": "駅の名前にtheはつけません。", "en": "You have to change trains at Shinjuku Station.", "pron": "", "exp": "change trains（乗り換える）。trainsの語尾のsを忘れないように。"}, {"num": 8, "ja": "空港へ行くにはどの電車に乗ったらいいですか。", "hint": "Which 〜", "notes": "「乗る」はtakeを使います。", "en": "Which train do I take to go to the airport?", "pron": "", "exp": ""}, {"num": 9, "ja": "急行に間に合うように急ぎましょう。", "hint": "Let's 〜", "notes": "「急行」はexpress (train)と言います。", "en": "Let's hurry so we can catch the express.", "pron": "", "exp": "「so (that) 主語 + can + 動詞」は「(主語)が(動詞)できるように」という意味です。"}]}, {"unit": 74, "chapter": "第3章 日常会話フレーズ編", "title": "空港で話す", "book_pages": "pp. 164-165", "page": 83, "scan_image": "reader_pages/page_083.jpg", "cd_info": "CD2 29 (Track 74)", "intro": "入国審査では滞在目的・日数が聞かれます。チェックインカウンターでの決まった会話フレーズも練習しておきましょう。", "key_title": "英会話のカギ", "key_content": "チェックインカウンターではI'd prefer 〜. やCan I 〜 ?を使い、座席の好みを言ってみましょう。入国審査ではWhat's the purpose of your visit?（滞在目的は？）、How long are you going to stay?（滞在期間は？）、Where are you going to stay?（訪問先は？）などの質問に英語で答えなければなりません。", "items": [{"num": 1, "ja": "飛行機の出発は予定通りですか。", "hint": "on schedule", "notes": "on scheduleは「予定通り」という意味です。", "en": "Is the flight on schedule?", "pron": "", "exp": "「予定より遅れている」はbehind scheduleです。"}, {"num": 2, "ja": "座席を隣同士にして欲しいのですが。", "hint": "We'd like 〜", "notes": "「お互いの隣」と考えます。", "en": "We'd like seats next to each other.", "pron": "", "exp": "We'd like two seats together. とも言えます。"}, {"num": 3, "ja": "出口の近くの座席がいいです。", "hint": "I'd prefer 〜", "notes": "「出口」はexitです。preferは「〜のほうがいい」という動詞です。", "en": "I'd prefer to sit near the exit.", "pron": "", "exp": "I'dはI wouldの短縮形です。"}, {"num": 4, "ja": "通路側の座席をお願いします。", "hint": "Can I 〜 ?", "notes": "「通路」はaisleを使います。", "en": "Can I have an aisle seat?", "pron": "", "exp": "aisleはsを発音せず［アイオ］となります。「窓側の席」はwindow seatです。"}, {"num": 5, "ja": "仕事で来ています。", "hint": "on business", "notes": "", "en": "I'm here on business.", "pron": "", "exp": "on businessは「商用で」です。「休暇で」はon vacationと言います。"}, {"num": 6, "ja": "アメリカには5日滞在の予定です。", "hint": "I'm going to 〜", "notes": "be going to 〜は予定を表しましたね（UNIT 32を参照）。", "en": "I'm going to stay in the States for five days.", "pron": "", "exp": "the United States（アメリカ）のUnitedは、会話では省くこともあります。"}, {"num": 7, "ja": "国際会議に出席します。", "hint": "I'm going to 〜", "notes": "「会議」はmeetingですが、大きい会議のことはconferenceと言います。", "en": "I'm going to attend an international conference.", "pron": "", "exp": "attendは「〜に出席する」です。"}, {"num": 8, "ja": "シャトルバスはどこで乗ったらいいのですか。", "hint": "Where 〜 ?", "notes": "", "en": "Where do I get the shuttle bus?", "pron": "", "exp": "getのt音は小さな「ッ」のようになりtheにつながります。"}, {"num": 9, "ja": "レンタカーセンターへの行き方を教えてもらえませんか。", "hint": "Could you 〜 ?", "notes": "「〜の仕方」はhow to 〜です。", "en": "Could you tell me how to get to the Rental Car Center?", "pron": "", "exp": "Rental Car Centerは空港に隣接しているレンタカー営業所のことです。"}]}, {"unit": 75, "chapter": "第3章 日常会話フレーズ編", "title": "機内で話す", "book_pages": "pp. 166-167", "page": 84, "scan_image": "reader_pages/page_084.jpg", "cd_info": "CD2 30 (Track 75)", "intro": "機内での会話もお決まりの表現が活躍します。客室乗務員に言いたいことを伝えられるよう、定型フレーズを練習しましょう。", "key_title": "英会話のカギ", "key_content": "機内の放送ではflight（飛行）、departure（出発）、arrival（到着）という言葉がよく使われます。また、time difference（時差）、turbulence（乱気流）、airsickness（飛行機酔い）、fasten your seat belt（シートベルトを締める）、など、機内で使いそうな語句を知っておくと役に立ちます。", "items": [{"num": 1, "ja": "毛布をいただけますか。", "hint": "Can I 〜 ?", "notes": "動詞はhaveを使います。", "en": "Can I have a blanket, please?", "pron": "", "exp": ""}, {"num": 2, "ja": "何か冷たい飲み物をいただけませんか。", "hint": "Could I 〜 ?", "notes": "to不定詞の形容詞的用法を使います。", "en": "Could I have something cold to drink?", "pron": "", "exp": "something coldは「何か冷たいもの」を指します。coldはsomethingの後ろです。"}, {"num": 3, "ja": "すみません。日本語の新聞はありますか。", "hint": "Do you have 〜 ?", "notes": "「〜を持っていますか」と聞きます。", "en": "Excuse me. Do you have newspapers in Japanese?", "pron": "", "exp": ""}, {"num": 4, "ja": "日本とハワイの時差はどのくらいですか。", "hint": "time difference", "notes": "「どのくらいですか」は「何ですか」と聞けばOKです。", "en": "What's the time difference between Japan and Hawaii?", "pron": "", "exp": "time differenceは「時差」です。between A and Bは「AとBの間の」です。"}, {"num": 5, "ja": "あまり気分がよくないのですが。", "hint": "feel", "notes": "", "en": "I don't feel very well.", "pron": "", "exp": "「気分が悪い」はfeel sickとも言います。"}, {"num": 6, "ja": "飛行機酔いの薬はありますか。", "hint": "Do you have 〜 ?", "notes": "「飛行機酔い」はairsicknessです。", "en": "Do you have medicine for airsickness?", "pron": "", "exp": "「船酔い」はseasicknessと言います。"}, {"num": 7, "ja": "シートベルトをお締めください。", "hint": "seat belt", "notes": "", "en": "Please fasten your seat belt.", "pron": "", "exp": "fastenの発音は［ファスン］です。tは発音しません。"}, {"num": 8, "ja": "気流の悪いところを通過しております。", "hint": "turbulence", "notes": "「乱気流を体験している」と考えます。", "en": "We are experiencing some turbulence.", "pron": "", "exp": "turbulenceは「乱気流」のことです。"}, {"num": 9, "ja": "(隣の席の乗客に) すみません。お手洗いに行きたいのですが。", "hint": "need to", "notes": "「邪魔をしてすみません」と言います。「邪魔をする」はdisturbです。", "en": "I'm sorry to disturb you, but I need to go to the restroom.", "pron": "", "exp": "トイレに立つ際に、隣に座っている通路側の席の人に一声かける言い方です。"}]}, {"unit": 76, "chapter": "第3章 日常会話フレーズ編", "title": "ホテルで話す", "book_pages": "pp. 168-169", "page": 85, "scan_image": "reader_pages/page_085.jpg", "cd_info": "CD2 31 (Track 76)", "intro": "英語圏では宿泊客とフロント係が親しげに話しているのをよく目にします。基本フレーズを覚えれば、気軽に話しかけられます。", "key_title": "英会話のカギ", "key_content": "旅行や出張で滞在するホテルでは、できるだけ快適に過ごしたいものですね。好みの部屋や提供されるサービスについて会話ができたら最高です。例えば、「〜はありますか」はDo you have 〜 ?でOK。「〜の方がいいです」はI'd prefer 〜.と言います。", "items": [{"num": 1, "ja": "チェックインをお願いします。", "hint": "I'd like to 〜", "notes": "「チェックインしたい」と言います。", "en": "I'd like to check in, please.", "pron": "", "exp": "動詞のcheck inはinを強く、名詞のcheck-inはcheckを強く発音します。"}, {"num": 2, "ja": "ツインの部屋をお願いできますか。", "hint": "Can I 〜 ?", "notes": "「ツイン」はtwin bedsです。", "en": "Can I have a room with twin beds?", "pron": "", "exp": ""}, {"num": 3, "ja": "チェックアウトは何時ですか。", "hint": "What 〜 ?", "notes": "", "en": "What's the check-out time?", "pron": "", "exp": "What'sはWhat isの短縮形。check-out timeはcheckを強く発音します。"}, {"num": 4, "ja": "これが私の予約確認番号です。", "hint": "This is 〜", "notes": "", "en": "This is my confirmation number.", "pron": "", "exp": "「予約の確認番号」のことをconfirmation numberと言います。"}, {"num": 5, "ja": "できたら禁煙ルームがいいのですが。", "hint": "I'd prefer 〜", "notes": "「できたら」は「もし可能なら」と言います。", "en": "I'd prefer a nonsmoking room if possible.", "pron": "", "exp": ""}, {"num": 6, "ja": "海側の部屋は空いていますか。", "hint": "Do you have 〜 ?", "notes": "「海に面している部屋」と言います。「面している」はfaceを使います。", "en": "Do you have a room facing the ocean available?", "pron": "", "exp": "availableは「空いている」、「利用できる」という意味でしたね。"}, {"num": 7, "ja": "車の預かりサービスはいくらですか。", "hint": "How much 〜 ?", "notes": "charge（お金を請求する）という動詞を使ってみましょう。", "en": "How much do you charge for valet parking?", "pron": "", "exp": "ホテルで車を預かり駐車場に運ぶサービスをvalet parkingと言います。"}, {"num": 8, "ja": "タクシーを呼んでもらえませんか。", "hint": "Could you please 〜 ?", "notes": "", "en": "Could you please call a taxi for me?", "pron": "", "exp": "「〜用に（for）タクシーを呼ぶ」と考えます。"}, {"num": 9, "ja": "滞在はとても楽しかったです。", "hint": "enjoy", "notes": "「とても」はreallyを使ってみましょう。", "en": "We really enjoyed our stay.", "pron": "", "exp": "enjoyの後ろにour stayなどの目的語を忘れないようにしましょう。"}]}, {"unit": 77, "chapter": "第3章 日常会話フレーズ編", "title": "観光を楽しむ", "book_pages": "pp. 170-171", "page": 86, "scan_image": "reader_pages/page_086.jpg", "cd_info": "CD2 32 (Track 77)", "intro": "観光地では写真を撮るのが楽しみですね。写真を撮ってもらうときに使う会話フレーズを中心に練習しましょう。", "key_title": "英会話のカギ", "key_content": "観光地での会話ではinteresting、beautiful、wonderfulのような感動を表す形容詞がよく使われます。また、観光地では写真がつきものです。おっくうがらずに思い切って「写真を撮ってもらえませんか」と頼んでみましょう。「写真」のことはpictureまたはphotograph（略してphoto）、動詞はtakeを使います。", "items": [{"num": 1, "ja": "あそこ、面白そうだよ。", "hint": "interesting", "notes": "「おもしろく見える」と言います。", "en": "That place looks interesting.", "pron": "", "exp": "「興味深く見える」ということですね。"}, {"num": 2, "ja": "セントラルパークには43番バスで行けますよ。", "hint": "We can 〜", "notes": "「バスに乗る」はtakeを使いましょう。", "en": "We can take the 43 bus to Central Park.", "pron": "", "exp": ""}, {"num": 3, "ja": "ここで写真を撮ろう。", "hint": "Let's 〜", "notes": "誘う表現のLet'sを使いましょう。", "en": "Let's take some pictures here.", "pron": "", "exp": "「写真を撮る」はtake a picture、またはtake a photo (photograph) です。"}, {"num": 4, "ja": "写真を撮ってもらえませんか。―― いいですよ。", "hint": "Would you please 〜 ?", "notes": "", "en": "Would you please take our picture? ―― Sure.", "pron": "", "exp": "「写真」はpictureまたはphotographと言います。"}, {"num": 5, "ja": "写真を撮っていただけませんか。―― もちろんです。", "hint": "Would you mind 〜 ?", "notes": "mindの後ろには動名詞（〜 ing形）を使います。", "en": "Would you mind taking our picture? ―― Not at all.", "pron": "", "exp": "mindは「気にする」です。「もちろん」はNot at all. (全然気にしない) を使います。"}, {"num": 6, "ja": "写真をお撮りしましょうか。", "hint": "Would you like 〜 ?", "notes": "「あなたの写真を私に撮ってほしいですか」と聞きます。", "en": "Would you like me to take a picture of you?", "pron": "", "exp": "would like to 〜は「〜したい」、would like 人 to 〜は「人に〜して欲しい」です。"}, {"num": 7, "ja": "ワイキキビーチをバックに入れてください。", "hint": "We'd like 〜", "notes": "「〜を私たちの後ろにほしい」と言います。", "en": "We'd like Waikiki Beach behind us.", "pron": "", "exp": ""}, {"num": 8, "ja": "こんな美しい眺めは見たことがありません。", "hint": "I've never seen 〜", "notes": "「こんな〜」はsuch 〜を使います。", "en": "I've never seen such beautiful scenery.", "pron": "", "exp": "「〜したことがある（ない）」という「経験」を表す現在完了形です。"}, {"num": 9, "ja": "眺めのいいところに行って写真を撮りたいです。", "hint": "I want to 〜", "notes": "to不定詞の名詞的用法と副詞的用法を使います。", "en": "I want to go to some scenic spots to take pictures.", "pron": "", "exp": "scenic spotは「眺めのいいところ」です。"}]}, {"unit": 78, "chapter": "第3章 日常会話フレーズ編", "title": "天気を話題にする", "book_pages": "pp. 172-173", "page": 87, "scan_image": "reader_pages/page_087.jpg", "cd_info": "CD2 33 (Track 78)", "intro": "天候はIt's 〜.で表現します。晴れ・雨・くもりなどのキーワードを後ろに続ければ天気について簡単に話せます。", "key_title": "英会話のカギ", "key_content": "日常生活の会話では、天候・気候をよく話題にします。天候の言葉で、例えば、「暑い」(hot)や「寒い」(cold)、「晴れている」(sunny)や「雨模様の」(rainy)、「じめじめしている」(humid)や「蒸し暑い」(muggy)など、季節によって使い分けできるようになると会話が弾みます。", "items": [{"num": 1, "ja": "今日は天気がいいですね。", "hint": "The weather is 〜", "notes": "", "en": "The weather is fine today.", "pron": "", "exp": "It is fine.とすると何がfineなのかが曖昧です。主語にはthe weatherがベターです。"}, {"num": 2, "ja": "今日は本当にじめじめしていますね。", "hint": "It's 〜", "notes": "", "en": "It's so humid today.", "pron": "", "exp": "湿気が多い状態をhumidと言います。「湿気」はhumidityです。"}, {"num": 3, "ja": "今日は少し肌寒いですね。", "hint": "It's 〜", "notes": "付加疑問文を使ってみましょう。", "en": "It's a little chilly today, isn't it?", "pron": "", "exp": "chillyは「肌寒い」です。"}, {"num": 4, "ja": "ここ2、3日蒸し暑いですね。", "hint": "It's been 〜", "notes": "「ここ2、3日」は過去から現在までのことを表すので現在完了形を使います。", "en": "It's been muggy for the last few days.", "pron": "", "exp": "It's beenはIt has beenの短縮形。for the last 〜は「過去〜の間」という意味です。"}, {"num": 5, "ja": "暖かくなってきていますね。", "hint": "It's 〜", "notes": "比較級を使います。", "en": "It's getting warmer.", "pron": "", "exp": "get 〜は「〜になる」です。"}, {"num": 6, "ja": "フロリダでは雪は降りますか。", "hint": "Does it 〜 ?", "notes": "", "en": "Does it snow in Florida?", "pron": "", "exp": "snowは「雪」という名詞以外に「雪が降る」という動詞でもあります。"}, {"num": 7, "ja": "今日は雨が降らなくてよかったですね。", "hint": "Good thing 〜", "notes": "「Good thing 主語+動詞」で「〜でよかった」という意味です（UNIT 19の6、7を参照）。", "en": "Good thing it didn't rain today.", "pron": "", "exp": ""}, {"num": 8, "ja": "いい天気になりましたね。", "hint": "It turned out to be 〜", "notes": "turn out to be 〜は「結局〜になる」という意味の表現です。", "en": "It turned out to be a nice day.", "pron": "", "exp": ""}, {"num": 9, "ja": "こんないい天気の日に家の中にいるなんてもったいない。", "hint": "It's a shame 〜", "notes": "「It 〜 to + 動詞の原形」の形を使います。「家の中に」はindoorsです。", "en": "It's a shame to stay indoors on such a sunny day.", "pron": "", "exp": "It's a shame 〜.は「もったいない」、「残念だ」という意味です。"}]}, {"unit": 79, "chapter": "第3章 日常会話フレーズ編", "title": "運転する・車に乗る", "book_pages": "pp. 174-175", "page": 88, "scan_image": "reader_pages/page_088.jpg", "cd_info": "CD2 34 (Track 79)", "intro": "pick up（迎えに行く）、flat tire（パンク）、driver's license（免許証）など、キーワードを上手に使って話しましょう。", "key_title": "英会話のカギ", "key_content": "アメリカでは車が生活に密着しているからこそ、車に関する話題が会話の中に頻繁に出てきます。go for a drive（ドライブに行く）やgive 〜 a ride（〜を車に乗せる）など、お決まり表現を覚えていきましょう。ガソリン(gasoline)は簡単にgasでOK。gas upと言えば「ガソリンを入れる」という動詞になります。", "items": [{"num": 1, "ja": "ドライブに行きましょう。", "hint": "Let's 〜", "notes": "", "en": "Let's go for a drive.", "pron": "", "exp": "「ドライブに行く」はgo for a driveです。go toの後ろは「場所」が来ます。"}, {"num": 2, "ja": "お家まで迎えに行きますよ。", "hint": "Let me 〜", "notes": "「(車で)迎えに行く」はpick 〜 upです。", "en": "Let me pick you up at your place.", "pron": "", "exp": "Let me 〜.は申し出る表現でしたね。"}, {"num": 3, "ja": "ガソリンがなくなってきています。", "hint": "run out", "notes": "現在進行形を使います。", "en": "We are running out of gas.", "pron": "", "exp": "run out of 〜で「〜がなくなる」です。"}, {"num": 4, "ja": "洗車をしないといけません。", "hint": "need to", "notes": "to不定詞の名詞的用法を使います。", "en": "I need to wash my car.", "pron": "", "exp": ""}, {"num": 5, "ja": "タイヤがパンクしたよ。", "hint": "have", "notes": "", "en": "I had a flat tire.", "pron": "", "exp": "flatは「平らな」。「パンク」は「平らなタイヤ」というイメージです。"}, {"num": 6, "ja": "車に乗せてもらえませんか。", "hint": "Could you 〜 ?", "notes": "", "en": "Could you give me a ride?", "pron": "", "exp": "give 〜 a rideは「〜を車に乗せる」という意味です。"}, {"num": 7, "ja": "運転免許証の期限が来月で切れます。", "hint": "will", "notes": "来月のことなので未来形を使います。", "en": "My driver's license will expire next month.", "pron": "", "exp": "expireは「期限が切れる」です。「有効（賞味）期限」はexpiration dateです。"}, {"num": 8, "ja": "もうすぐ車検をしないといけません。", "hint": "have to", "notes": "「〜してもらう」という意味の「get + 目的語 + 過去分詞」を使います。", "en": "I'll have to get my car inspected pretty soon.", "pron": "", "exp": "have to 〜は「強制」の表現でしたね（UNIT 45の5を参照）。"}, {"num": 9, "ja": "電車に乗るよりもレンタカーを借りたいな。", "hint": "I'd rather 〜", "notes": "I'd ratherの後ろには動詞の原形が続きます。", "en": "I'd rather rent a car than take a train.", "pron": "", "exp": "would rather A than Bは「BするよりもむしろAしたい」です。"}]}, {"unit": 80, "chapter": "第3章 日常会話フレーズ編", "title": "大学で話す", "book_pages": "pp. 176-177", "page": 89, "scan_image": "reader_pages/page_089.jpg", "cd_info": "CD2 35 (Track 80)", "intro": "アメリカの大学は集団討論やプレゼンテーションが多く、学生は講義中でも遠慮なく手を上げて質問をし、意見を言います。", "key_title": "英会話のカギ", "key_content": "ここでは、成績のことや講義内容のことなど、大学生活の中でよく使われる会話表現を練習します。「専攻（する）」はmajorです。「レポート」はpaperでOKです。学内外の生活について、「キャンパス内」はon campus、「キャンパス外」はoff campusと言います。", "items": [{"num": 1, "ja": "経済学を専攻しています。", "hint": "major", "notes": "現在進行形を使ってみましょう。", "en": "I'm majoring in Economics.", "pron": "", "exp": "major in 〜は「〜を専攻する」です。"}, {"num": 2, "ja": "集団討論は大嫌いです。", "hint": "hate", "notes": "「討論」はdiscussionを使います。", "en": "I hate group discussions.", "pron": "", "exp": "hateはlove（大好きだ）の反対語です。"}, {"num": 3, "ja": "期末試験を受ける準備をしているところなんだ。", "hint": "get ready", "notes": "「準備する」はget readyを使いましょう。", "en": "I'm getting ready to take my final exams.", "pron": "", "exp": "「期末試験」はfinalにsをつけてfinalsとも言います。"}, {"num": 4, "ja": "統計学でAを取ったよ。", "hint": "get", "notes": "", "en": "I got an A in Statistics.", "pron": "", "exp": "ひとつのAを取ったのですから、冠詞のanをつけましょう。"}, {"num": 5, "ja": "どんなアドバイスでもいただけたらうれしいです。", "hint": "I'd appreciate 〜", "notes": "「あなたがくれるどんなアドバイスでも感謝するでしょうに」と考えます。", "en": "I'd appreciate any advice you could give me.", "pron": "", "exp": "adviceの後ろに目的格の関係代名詞whichまたはthatが省かれています。"}, {"num": 6, "ja": "学期末レポートは今日が締め切りです。", "hint": "due", "notes": "dueの後ろに日時が続きます。", "en": "The term paper is due today.", "pron": "", "exp": "学校で提出する「レポート」はpaperでOKです。"}, {"num": 7, "ja": "その先生の言っていることはよく分かりません。", "hint": "I have difficulty 〜", "notes": "関係代名詞what（〜すること）を使います。", "en": "I have some difficulty understanding what the teacher says.", "pron": "", "exp": "「have difficulty + 〜 ing形」で「〜するのに苦労する」です。"}]}, {"unit": 81, "chapter": "第3章 日常会話フレーズ編", "title": "日本について話す", "book_pages": "pp. 178-179", "page": 90, "scan_image": "reader_pages/page_090.jpg", "cd_info": "CD2 36 (Track 81)", "intro": "日本について話すには、日本のことを知っておく必要があります。日本にちなんだキーワードを折り込んで会話練習をしましょう。", "key_title": "英会話のカギ", "key_content": "習慣、食、地理など、世界中の人に日本のことを伝えてみましょう。「お辞儀（をする）」はbow、「名刺」はbusiness cardsでOKです。「大学入試」はcollege entrance examinations、「焼き鳥」「寿司」はカタカナ表記で問題ありません。", "items": [{"num": 1, "ja": "日本では初めて誰かに会うときはよく名刺交換をします。", "hint": "business cards", "notes": "「交換する」はexchangeを使います。", "en": "In Japan we often exchange business cards when we meet for the first time.", "pron": "", "exp": "for the first timeは「初めて」という意味です。"}, {"num": 2, "ja": "日本では誰かにあいさつをするときにお辞儀をするのが習慣です。", "hint": "bow", "notes": "「It 〜 to不定詞」の形を使いましょう。「あいさつする」はgreetです。", "en": "It is the Japanese custom to bow when they greet somebody.", "pron": "", "exp": ""}, {"num": 3, "ja": "日本社会では年齢はとても大切です。", "hint": "Japanese society", "notes": "", "en": "Age is the keyword in Japanese society.", "pron": "", "exp": "Age is very important in Japanese society. とも言えます。"}, {"num": 4, "ja": "日本ではたいてい夜にお風呂に入ります。", "hint": "take a bath", "notes": "peopleを主語にします。", "en": "In Japan people usually take a bath in the evening.", "pron": "", "exp": ""}, {"num": 5, "ja": "漢字を書くときには筆順がとても大切です。", "hint": "stroke order", "notes": "「筆順」はstroke orderです。", "en": "The stroke order is very important when you write kanji, or Chinese characters.", "pron": "", "exp": "orは「または」ではなく「言い換えると」という意味です。"}, {"num": 6, "ja": "沖縄は日本の南の島で、人気の観光地です。", "hint": "tourist destination", "notes": "主格の関係代名詞whichを使います。", "en": "Okinawa is an island in southern Japan, which is a popular tourist destination.", "pron": "", "exp": "destinationは「目的地」です。"}, {"num": 7, "ja": "焼き鳥は食べたことありますか。日本の料理は寿司だけではないですよ。", "hint": "cuisine", "notes": "「経験」を表す現在完了形を使います。cuisineは「料理」です。", "en": "Have you ever tried yakitori? Japanese cuisine is not just sushi, you know.", "pron": "", "exp": "文末にyou knowと軽くつけ足すと、「〜なんだよね」という意味です。"}]}, {"unit": 82, "chapter": "第3章 日常会話フレーズ編", "title": "趣味について話す", "book_pages": "pp. 180-181", "page": 91, "scan_image": "reader_pages/page_091.jpg", "cd_info": "CD2 37 (Track 82)", "intro": "相手の趣味を聞く。自分の自由時間の過ごし方を話す。カンタンフレーズをきっかけに、深い話に進展することもあります。", "key_title": "英会話のカギ", "key_content": "英語でも話の種として、趣味や娯楽がよく取り上げられます。自分の趣味や娯楽について英語で表現できるようにしておきましょう。「〜することが好きです」にはlikeやloveを使います。「よく〜します」はoften+動詞です。favorite（好きな）やcrazy（夢中だ）も趣味について話すときに便利な形容詞です。", "items": [{"num": 1, "ja": "趣味は何ですか。", "hint": "What 〜 ?", "notes": "趣味はいくつかあることを想定して複数で聞いたほうがいいでしょう。", "en": "What are your hobbies?", "pron": "", "exp": ""}, {"num": 2, "ja": "暇なときにはふつう何をしていますか。", "hint": "What 〜 ?", "notes": "「暇」、「空いている時間」はfree timeです。", "en": "What do you usually do in your free time?", "pron": "", "exp": "頻度の副詞usually（ふつう、たいてい）は、一般動詞の前、be動詞の後ろに置きます。"}, {"num": 3, "ja": "読書がとても好きです。", "hint": "like", "notes": "動名詞（〜 ing形）を使いましょう。", "en": "I like reading books a lot.", "pron": "", "exp": "Reading books is my favorite way to relax. とも言えます。"}, {"num": 4, "ja": "旅行が本当に大好きです。", "hint": "love", "notes": "「大好き」はloveでOKです。loveは人以外にも使えます。", "en": "I really love traveling.", "pron": "", "exp": ""}, {"num": 5, "ja": "よく映画を見に行きます。", "hint": "often go", "notes": "often（よく）も頻度の副詞なので、一般動詞goの前に置きます。", "en": "I often go to see movies.", "pron": "", "exp": "go to the moviesとも言います。"}, {"num": 6, "ja": "私の好きなスポーツはバスケットボールです。", "hint": "favorite", "notes": "「スポーツ」の単数形はsportです。", "en": "My favorite sport is basketball.", "pron": "", "exp": "favoriteは「お気に入りの」という意味です。"}, {"num": 7, "ja": "K-popに夢中なんです。", "hint": "crazy about", "notes": "", "en": "I'm crazy about K-pop.", "pron": "", "exp": "「気が狂ったように夢中だ」ということです。"}, {"num": 8, "ja": "日曜日には友だちと料理をして楽しんでいます。", "hint": "enjoy", "notes": "「〜することを楽しむ」と言う場合、enjoyの後ろは動名詞（〜 ing形）です。", "en": "I enjoy cooking with my friends on Sundays.", "pron": "", "exp": "on Sundaysのような時を表す言葉は通常文末です。"}, {"num": 9, "ja": "時には気晴らしが必要ですよ。", "hint": "need", "notes": "", "en": "You need a change of pace sometimes.", "pron": "", "exp": "change of paceは「気分転換」、「気晴らし」という意味です。"}]}, {"unit": 83, "chapter": "第3章 日常会話フレーズ編", "title": "スポーツを楽しむ", "book_pages": "pp. 182-183", "page": 92, "scan_image": "reader_pages/page_092.jpg", "cd_info": "CD2 38 (Track 83)", "intro": "スポーツは会話の手軽な話題にもってこいです。試合の結果、好きなスポーツなど、汎用性の高いフレーズを練習しましょう。", "key_title": "英会話のカギ", "key_content": "スポーツには独特の用語がたくさん出てきます。例えば、野球で「強打者」はslugger、「好プレー」はdazzler、「連勝」はsweepなど、挙げ出したらきりがありません。ここでは、スポーツ全般や趣味・娯楽にも共通して使える表現を練習してみましょう。", "items": [{"num": 1, "ja": "どっちのチームが勝っている？", "hint": "Which 〜 ?", "notes": "現在進行形を使います。", "en": "Which team is winning?", "pron": "", "exp": ""}, {"num": 2, "ja": "タイガースがドラゴンズに6対1で勝ちました。", "hint": "beat", "notes": "beat（打ち負かす）は過去形も同じ形です。", "en": "The Tigers beat the Dragons 6 to 1.", "pron": "", "exp": "チーム名など固有名詞の複数にはtheをつけます。"}, {"num": 3, "ja": "サッカーにはけっこう詳しいんですよ。", "hint": "familiar", "notes": "familiarは「よく知っている」という意味の形容詞です。", "en": "I'm quite familiar with soccer.", "pron": "", "exp": "「サッカー」はfootballとも言います。"}, {"num": 4, "ja": "メジャーリーグのことはよく分かりません。", "hint": "follow", "notes": "followは「〜に興味を持つ」という意味の動詞です。", "en": "I don't really follow Major League Baseball.", "pron": "", "exp": "Major League Baseballはアメリカのプロ野球リーグのことです。"}, {"num": 5, "ja": "ほとんど毎日ジムに通っています。", "hint": "gym", "notes": "「通う」はgoでOKです。", "en": "I go to the gym almost every day.", "pron": "", "exp": "gymはgymnasiumの略語です。"}, {"num": 6, "ja": "それは本当に番狂わせでした。", "hint": "upset", "notes": "「本当に」はquiteを使ってみましょう。", "en": "It was quite an upset.", "pron": "", "exp": "upsetは「意外な結果」、「番狂わせ」のことです。"}, {"num": 7, "ja": "テレビで相撲を見ていますか。", "hint": "watch", "notes": "", "en": "Do you watch sumo on TV?", "pron": "", "exp": "「テレビで」はon TV、「ラジオで」はon the radioです。"}, {"num": 8, "ja": "とてもおもしろい（相撲の）一番でした。", "hint": "bout", "notes": "「(相撲の)一番」、「取組」はboutを使います。", "en": "It was a very interesting bout.", "pron": "", "exp": ""}, {"num": 9, "ja": "あなたの国で一番人気のあるスポーツは何ですか。", "hint": "popular", "notes": "最上級のmostを使います。", "en": "What is the most popular sport in your country?", "pron": "", "exp": "形容詞の最上級にはtheをつけます。"}]}, {"unit": 84, "chapter": "第3章 日常会話フレーズ編", "title": "お金について話す", "book_pages": "pp. 184-185", "page": 93, "scan_image": "reader_pages/page_093.jpg", "cd_info": "CD2 39 (Track 84)", "intro": "値段・支払い・懐具合。お金の話題は尽きないものです。応用の利く会話フレーズを覚えておきましょう。", "key_title": "英会話のカギ", "key_content": "お金について話をするときには、使う表現はある程度決まっています。例えば、形容詞ではexpensive（高い）、cheap（安い）、short（不足している）、動詞ではpay（支払う）、spend（費やす）、cost（費用がかかる）、waste（無駄づかいする）、deposit（預金をする）、withdraw（お金を引き出す）などです。", "items": [{"num": 1, "ja": "お財布が寂しいの。", "hint": "I'm 〜", "notes": "「低い」、「少ない」という意味のlowを使います。", "en": "I'm low on money.", "pron": "", "exp": "be low on 〜は「〜を十分持っていない」という意味です。"}, {"num": 2, "ja": "チケットはいくらだったの？", "hint": "How much 〜 ?", "notes": "過去形のbe動詞を使います。", "en": "How much was the ticket?", "pron": "", "exp": ""}, {"num": 3, "ja": "現金で支払えますか。", "hint": "Can I 〜 ?", "notes": "", "en": "Can I pay with cash?", "pron": "", "exp": "アメリカでは治安の関係で現金を受け取りたがらないところもあります。"}, {"num": 4, "ja": "無駄づかいをしてはいけないよ。", "hint": "Don't 〜", "notes": "Don'tの後ろは「浪費する」という意味の動詞が続きます。", "en": "Don't waste your money.", "pron": "", "exp": "否定の命令文はDon'tで始まります。"}, {"num": 5, "ja": "50円足りない。", "hint": "short", "notes": "Iを主語にします。", "en": "I am 50 yen short.", "pron": "", "exp": "shortは「短い」という意味以外に「不足している」という意味もあります。"}, {"num": 6, "ja": "洋服にけっこうお金をかけるんだ。", "hint": "spend", "notes": "「お金をかける」は「お金を費やす」と考えます。", "en": "I spend a lot of money on clothes.", "pron": "", "exp": "「〜にお金を費やす」はspend money on 〜です。"}, {"num": 7, "ja": "それでお金をもらっているんですか。", "hint": "get paid", "notes": "", "en": "Do you get paid for it?", "pron": "", "exp": "get paidは「お金が支払われる」「給料をもらっている」という意味です。"}, {"num": 8, "ja": "オーストラリアに行くのに約2,500ドルかかりました。", "hint": "It cost 〜", "notes": "「〜に行くために」はto不定詞の副詞的用法を使います。", "en": "It cost me about 2,500 dollars to go to Australia.", "pron": "", "exp": "costの過去形は原形と同じcostです。"}, {"num": 9, "ja": "札幌に行く一番安い方法は何ですか。", "hint": "What's 〜 ?", "notes": "cheap（安い）の最上級を使います。What'sはWhat isの短縮形です。", "en": "What's the cheapest way to go to Sapporo?", "pron": "", "exp": "「札幌に行くための〜」はto不定詞の形容詞的用法です。"}]}, {"unit": 85, "chapter": "第3章 日常会話フレーズ編", "title": "オフィスで話す", "book_pages": "pp. 186-187", "page": 94, "scan_image": "reader_pages/page_094.jpg", "cd_info": "CD2 40 (Track 85)", "intro": "英米のビジネスでは「人と人とは対等」です。敬語はないので、上司に対しても言葉づかいに神経質になる必要はありません。", "key_title": "英会話のカギ", "key_content": "英語圏では、上司を名字ではなく名前で呼ぶ場合があります。もちろん英語にも丁寧表現はあるので、状況と雰囲気を考え、名字か名前かの選択をしましょう。「忙しい」はbusyやall tied up、「休憩する」はtake a break、「お疲れ様でした」はSee you. やHave a nice evening. です。", "items": [{"num": 1, "ja": "おはよう、メグ。調子はどう？", "hint": "How's 〜 ?", "notes": "「あなたに関して全てはどうですか」と言います。", "en": "Good morning, Meg. How's everything with you?", "pron": "", "exp": "How's everything? でもOK。"}, {"num": 2, "ja": "休暇はどうでしたか。", "hint": "How 〜 ?", "notes": "", "en": "How was your vacation?", "pron": "", "exp": "It was great!（とてもよかったよ！）などと答えます。"}, {"num": 3, "ja": "休憩をしましょう。", "hint": "Let's 〜", "notes": "「休憩」はbreakを使ってみましょう。", "en": "Let's take a break.", "pron": "", "exp": "「休憩する」はtake a restとも言います。"}, {"num": 4, "ja": "すぐ戻ります。", "hint": "I'll 〜", "notes": "", "en": "I'll be right back.", "pron": "", "exp": "I'll be back soon. でもOK。"}, {"num": 5, "ja": "今忙しくて手が離せません。", "hint": "I'm 〜", "notes": "仕事に縛りつけられているイメージで、tie（縛る、結ぶ）を使います。", "en": "I'm all tied up right now.", "pron": "", "exp": "all tied upはvery busy（とても忙しい）のことです。"}, {"num": 6, "ja": "風邪をひいたので、今日は休ませてください。", "hint": "I'd like to 〜", "notes": "「病欠を取る」はtake sick leaveです。leaveは「休暇」の意味。", "en": "I'd like to take sick leave today because I have a cold.", "pron": "", "exp": "「年次休暇」ならannual leaveです。"}, {"num": 7, "ja": "渋滞で、30分ほど遅刻します。", "hint": "I'll 〜", "notes": "「渋滞」はtraffic jamです。", "en": "I'll be about thirty minutes late because of a traffic jam.", "pron": "", "exp": "because of 〜は「〜のために」、「〜が原因で」という意味です。"}, {"num": 8, "ja": "スミス部長、少しお時間をよろしいですか。", "hint": "could I 〜 ?", "notes": "「少しの時間」はa few minutesを使いましょう。", "en": "Mr. Smith, could I have a few minutes of your time?", "pron": "", "exp": "英語では仕事上の肩書きではなくMr. 〜やMs. 〜で呼びます。"}, {"num": 9, "ja": "お先に失礼します。", "hint": "I'll 〜", "notes": "", "en": "I'll see you tomorrow.", "pron": "", "exp": "簡単に言うとSee you. です。「お疲れ様でした」の意味でも使います。"}]}, {"unit": 86, "chapter": "第3章 日常会話フレーズ編", "title": "業務のやりとり", "book_pages": "pp. 188-189", "page": 95, "scan_image": "reader_pages/page_095.jpg", "cd_info": "CD2 41 (Track 86)", "intro": "英語では、胸を張って積極的に話す姿勢が好まれます。前向きな態度や話し方で上司や顧客から信頼を得ることができます。", "key_title": "英会話のカギ", "key_content": "業務に関する英語は毎日繰り返して使われ、ある程度限られています。charge（担当）、document（書類）、proposal（案）、deadline（締切）など、基本単語をしっかり覚えておきましょう。アメリカの仕事の流れはトップダウンと言われながらも、上司が部下によく意見を求めます。部下もそれに対して堂々と自分の考えを述べます。", "items": [{"num": 1, "ja": "企画の進み具合はどうですか。", "hint": "How's 〜 ?", "notes": "基本動詞comeを使います。", "en": "How's your project coming along?", "pron": "", "exp": "企画が徐々に進み、仕上がる時点に近づいてくるイメージです。"}, {"num": 2, "ja": "この案についてどう思いますか。", "hint": "What 〜 ?", "notes": "「案」にはproposalを使いましょう。", "en": "What do you think of this proposal?", "pron": "", "exp": "「どう思う」の「どう」にはHowを使わないように注意してください。"}, {"num": 3, "ja": "この点がよく分からないのですが。", "hint": "I don't understand 〜", "notes": "", "en": "I don't understand this point clearly.", "pron": "", "exp": "clearlyは「はっきりと」という意味です。"}, {"num": 4, "ja": "今日、残業してもらえないかな？", "hint": "Can I 〜 ?", "notes": "「残業する」はwork overtimeです。", "en": "Can I ask you to work overtime today?", "pron": "", "exp": "「ask + 人 + to + 動詞の原形」は「人に〜するように頼む」です。"}, {"num": 5, "ja": "この仕事は私には無理です。", "hint": "overwhelming", "notes": "overwhelmingは「圧倒される」という形容詞です。", "en": "This job is overwhelming for me.", "pron": "", "exp": ""}, {"num": 6, "ja": "この件については中村さんが担当しています。", "hint": "in charge of", "notes": "「件」にはmatterを使いましょう。", "en": "Ms. Nakamura is in charge of this matter.", "pron": "", "exp": "in charge (of 〜) は「(〜の)担当（係）だ」です。"}, {"num": 7, "ja": "この書類を3部ずつコピーしてください。", "hint": "Could you 〜 ?", "notes": "「〜のコピーを取る」はmake a copy of 〜です。       const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `UNIT ${u.unit} : ${u.title}`;
      unitSelect.appendChild(opt);
    });

    function renderUnit(index) {
      currentUnitIndex = index;
      const u = unitsData[index];
      unitSelect.value = index;

      document.getElementById('pageIndicator').textContent = `UNIT ${u.unit} / 90 (${u.book_pages})`;
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === unitsData.length - 1);

      const container = document.getElementById('mainContainer');

      if (viewMode === 'scan') {
        container.innerHTML = `
          <div class="scan-view-stage">
            <img class="scan-view-img" src="${u.scan_image}" alt="UNIT ${u.unit} 原本スキャン" onclick="nextUnit()" title="クリックで次のUNITへ">
          </div>
        `;
        return;
      }

      // Render Synchronized CSS Grid
      const progress = getStoredProgress();
      const leftPageNum = u.book_pages.split('-')[0].replace(/[^0-9]/g, '') || '';
      const rightPageNum = u.book_pages.split('-')[1] ? u.book_pages.split('-')[1].replace(/[^0-9]/g, '') : '';

      let rowsHtml = '';

      // Row 1: Headers
      rowsHtml += `
        <!-- Left Header (col 1, row 1) -->
        <div class="header-left left-col-item">
          <div>
            <div class="unit-meta-bar">
              <span class="unit-badge-pill">UNIT ${u.unit}</span>
              <span class="chapter-tag">${u.chapter}</span>
            </div>
            <h1 class="unit-main-title">${u.title}</h1>
          </div>
          <div class="mascot-intro-box">
            <span class="mascot-icon">💡</span>
            <div>${u.intro}</div>
          </div>
        </div>

        <!-- Center Spine (spanning rows 1 to 11) -->
        <div class="book-spine-divider"></div>

        <!-- Right Header (col 3, row 1) -->
        <div class="header-right right-col-item">
          <div class="cd-track-bar">
            <span class="cd-pill">💿 ${u.cd_info}</span>
            <span class="repetition-header-badge">5段階 反復トレーニング</span>
          </div>
          <div class="key-box-card">
            <div class="key-box-title">🗝️ ${u.key_title || '英会話のカギ'}</div>
            <div>${u.key_content}</div>
          </div>
        </div>
      `;

      // Rows 2 to 10: Items 1 to 9 in horizontal lockstep
      u.items.forEach((it, idx) => {
        const gridRow = idx + 2;
        const escapedEn = (it.en || '').replace(/'/g, "\\'");

        // Left Checkboxes
        let checksHtml = '';
        for (let c = 1; c <= 5; c++) {
          const key = `${u.unit}_${it.num}_${c}`;
          const checked = progress[key] ? 'checked' : '';
          checksHtml += `<input type="checkbox" class="check-box-input" title="第${c}回チェック" ${checked} onchange="saveProgress(${u.unit}, ${it.num}, ${c}, this.checked)">`;
        }

        rowsHtml += `
          <!-- Left Item ${it.num} (col 1, row ${gridRow}) -->
          <div class="left-col-item" style="grid-row: ${gridRow};">
            <div class="item-card left-card">
              <div class="item-header-row">
                <div class="item-num-badge">${it.num}</div>
                <div class="item-text-area">
                  <div class="japanese-sentence">${it.ja}</div>
                  <div class="hint-note-row">
                    ${it.hint ? `<span class="hint-tag">🔑 ${it.hint}</span>` : ''}
                    ${it.notes ? `<span class="note-text">${it.notes}</span>` : ''}
                  </div>
                </div>
              </div>
              <div class="checks-row">
                <span>Check:</span>
                ${checksHtml}
              </div>
            </div>
          </div>

          <!-- Right Item ${it.num} (col 3, row ${gridRow}) -->
          <div class="right-col-item" style="grid-row: ${gridRow};">
            <div class="item-card right-card" onclick="revealCard(this)">
              <div class="item-header-row">
                <div class="item-num-badge">${it.num}</div>
                <div class="item-text-area">
                  <div class="english-top-row">
                    <div class="english-sentence">${it.en}</div>
                    <button class="btn-speak" onclick="event.stopPropagation(); speakPhrase('${escapedEn}')" title="音声を聞く (Web Speech API)">🔊</button>
                  </div>
                  ${it.pron ? `<div class="pronunciation-tag">[${it.pron}]</div>` : ''}
                  ${it.exp ? `<div class="explanation-callout">${it.exp}</div>` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // Row 11: Footers
      rowsHtml += `
        <!-- Left Footer (col 1, row 11) -->
        <div class="footer-left left-col-item">
          <span>p. ${leftPageNum}</span>
        </div>

        <!-- Right Footer (col 3, row 11) -->
        <div class="footer-right right-col-item">
          <span>p. ${rightPageNum}</span>
        </div>
      `;

      container.innerHTML = `
        <div class="book-spread-grid ${isMasked ? 'masked' : ''}" id="bookSpreadGrid">
          ${rowsHtml}
        </div>
      `;

      if (window.innerWidth <= 860) {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      adjustFitScreenScale();
    }

    function adjustFitScreenScale() {
      const grid = document.getElementById('bookSpreadGrid');
      if (!grid || !isFitMode || viewMode === 'scan' || window.innerWidth <= 860) {
        if (grid) grid.style.transform = 'none';
        return;
      }

      // Compute exact available space between headers
      const topH = 48;
      const botH = 48;
      const availW = window.innerWidth - 32;
      const availH = window.innerHeight - topH - botH - 16;

      grid.style.transform = 'none';
      const natW = grid.offsetWidth;
      const natH = grid.offsetHeight;

      const scaleW = availW / natW;
      const scaleH = availH / natH;
      const scale = Math.min(scaleW, scaleH);

      if (scale < 0.98) {
        grid.style.transform = `scale(${scale})`;
        grid.style.transformOrigin = 'center center';
      } else {
        grid.style.transform = 'none';
      }
    }

    window.addEventListener('resize', () => {
      adjustFitScreenScale();
    });

    function toggleFitScreen() {
      isFitMode = !isFitMode;
      const btn = document.getElementById('fitScreenBtn');
      const text = document.getElementById('fitScreenText');
      if (isFitMode) {
        document.body.classList.remove('scroll-mode');
        btn.classList.add('active');
        text.textContent = '全画面フィット';
      } else {
        document.body.classList.add('scroll-mode');
        btn.classList.remove('active');
        text.textContent = 'スクロール表示';
      }
      renderUnit(currentUnitIndex);
    }

    function revealCard(card) {
      if (isMasked) {
        card.classList.toggle('revealed');
      }
    }

    function goToUnit(idx) {
      if (idx >= 0 && idx < unitsData.length) {
        renderUnit(idx);
      }
    }

    function prevUnit() {
      if (currentUnitIndex > 0) goToUnit(currentUnitIndex - 1);
    }

    function nextUnit() {
      if (currentUnitIndex < unitsData.length - 1) goToUnit(currentUnitIndex + 1);
    }

    function toggleViewMode() {
      viewMode = (viewMode === 'typeset') ? 'scan' : 'typeset';
      const icon = document.getElementById('viewModeIcon');
      const text = document.getElementById('viewModeText');
      if (viewMode === 'scan') {
        icon.textContent = '📖';
        text.textContent = '組版表示';
      } else {
        icon.textContent = '🖼️';
        text.textContent = '原本スキャン';
      }
      renderUnit(currentUnitIndex);
    }

    function toggleMaskMode() {
      isMasked = !isMasked;
      const btn = document.getElementById('maskToggleBtn');
      const btnText = document.getElementById('maskBtnText');
      if (isMasked) {
        btn.classList.add('active');
        btnText.textContent = '暗記中 (クリック開示)';
      } else {
        btn.classList.remove('active');
        btnText.textContent = '暗記テスト';
      }
      renderUnit(currentUnitIndex);
    }

    function speakPhrase(phrase, onEnd) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      if (onEnd) utterance.onend = onEnd;
      window.speechSynthesis.speak(utterance);
    }

    function playAllPhrases() {
      if (!('speechSynthesis' in window)) return;
      const btn = document.getElementById('playAllBtn');
      if (isPlayingAll) {
        window.speechSynthesis.cancel();
        isPlayingAll = false;
        btn.classList.remove('active');
        btn.querySelector('span:last-child').textContent = '連続再生';
        return;
      }

      isPlayingAll = true;
      btn.classList.add('active');
      btn.querySelector('span:last-child').textContent = '停止';

      const items = unitsData[currentUnitIndex].items;
      let currentIndex = 0;

      function speakNext() {
        if (!isPlayingAll || currentIndex >= items.length) {
          isPlayingAll = false;
          btn.classList.remove('active');
          btn.querySelector('span:last-child').textContent = '連続再生';
          return;
        }
        const phrase = items[currentIndex].en;
        currentIndex++;
        speakPhrase(phrase, () => {
          setTimeout(speakNext, 700);
        });
      }

      speakNext();
    }

    function cycleTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      const theme = themes[themeIndex];
      document.body.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'sepia') {
        icon.textContent = '📜';
        text.textContent = '生成り紙';
      } else if (theme === 'white') {
        icon.textContent = '☀️';
        text.textContent = 'ホワイト';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'ダーク';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft') prevUnit();
      else if (e.key === 'ArrowRight') nextUnit();
      else if (e.key === ' ') {
        e.preventDefault();
        playAllPhrases();
      }
    });

    // Touch swipe navigation for mobile
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].clientX;
      touchEndY = e.changedTouches[0].clientY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT')) {
        return;
      }
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      if (Math.abs(diffX) >= 60 && Math.abs(diffX) > Math.abs(diffY) * 1.6) {
        if (diffX < 0) {
          nextUnit();
          showMobileToast('次のUNITへ 👉');
        } else {
          prevUnit();
          showMobileToast('👈 前のUNITへ');
        }
      }
    }

    function showMobileToast(msg) {
      let toast = document.getElementById('mobileToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'mobileToast';
        toast.style.position = 'fixed';
        toast.style.bottom = '65px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = 'rgba(18, 22, 33, 0.9)';
        toast.style.color = '#fff';
        toast.style.padding = '6px 14px';
        toast.style.borderRadius = '20px';
        toast.style.fontSize = '0.8rem';
        toast.style.fontWeight = '700';
        toast.style.zIndex = '9999';
        toast.style.pointerEvents = 'none';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
        toast.style.transition = 'opacity 0.25s ease';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 1000);
    }

    function handleSearch(query) {
      query = query.trim().toLowerCase();
      if (!query) {
        renderUnit(currentUnitIndex);
        return;
      }

      const matches = [];
      unitsData.forEach((u, uIdx) => {
        u.items.forEach(it => {
          if ((it.ja && it.ja.toLowerCase().includes(query)) || 
              (it.en && it.en.toLowerCase().includes(query)) || 
              (it.hint && it.hint.toLowerCase().includes(query)) ||
              (it.exp && it.exp.toLowerCase().includes(query)) ||
              (u.title && u.title.toLowerCase().includes(query))) {
            matches.push({ unit: u, item: it, unitIndex: uIdx });
          }
        });
      });

      const container = document.getElementById('mainContainer');
      if (matches.length === 0) {
        container.innerHTML = `
          <div style="padding: 40px; text-align: center; color: var(--text-muted); background: var(--paper-bg); border-radius: 10px; width: 100%; max-width: 800px; box-shadow: var(--shadow-book);">
            <h2>🔍 該当するフレーズが見つかりませんでした</h2>
            <p style="margin-top: 8px;">別のキーワードで検索してみてください。</p>
          </div>
        `;
        return;
      }

      let resultsHtml = `
        <div style="background: var(--paper-bg); border-radius: 10px; padding: 20px 24px; width: 100%; max-width: 1000px; max-height: calc(100vh - 120px); overflow-y: auto; box-shadow: var(--shadow-book);">
          <h2 style="font-family: 'Noto Serif JP', serif; margin-bottom: 14px; font-size: 1.2rem; color: var(--accent-red);">
            🔍 「${query}」の検索結果: ${matches.length} 件
          </h2>
          <div style="display: flex; flex-direction: column; gap: 8px;">
      `;

      matches.forEach(m => {
        const escapedEn = (m.item.en || '').replace(/'/g, "\\'");
        resultsHtml += `
          <div class="item-card" style="cursor: pointer; padding: 8px 12px;" onclick="goToUnit(${m.unitIndex})">
            <div style="font-size: 0.78rem; font-weight: 800; color: var(--accent-red); margin-bottom: 3px;">
              UNIT ${m.unit.unit} : ${m.unit.title} (問 ${m.item.num}) ➔ クリックで移動
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
              <div>
                <div class="japanese-sentence" style="font-size: 0.95rem; margin-bottom: 2px;">${m.item.ja}</div>
                <div class="english-sentence" style="font-size: 0.98rem; color: var(--accent-blue);">${m.item.en}</div>
              </div>
              <button class="btn-speak" onclick="event.stopPropagation(); speakPhrase('${escapedEn}')">🔊</button>
            </div>
          </div>
        `;
      });

      resultsHtml += `</div></div>`;
      container.innerHTML = resultsHtml;
    }

    renderUnit(0);
  </script>
</body>
</html>
